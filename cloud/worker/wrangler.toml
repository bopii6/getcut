name = "videogen-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 部署：wrangler deploy
# 配置密钥：wrangler secret put GITHUB_TOKEN
#
# 说明：界面(ui.html)不用 Cloudflare 的静态资源功能，而是直接打进 Worker 里返回。
# 原因：一旦启用 [assets]，Cloudflare 的资源层会先碰请求体，
# 在 HTTP/2 / HTTP/3 下会让 /api/upload 报 "Body has already been used"。
# 打进来就没有这一层，浏览器走什么协议都不会出问题。

# 保留 workers.dev 兜底入口（国内 DNS 被污染，仅作备用）
workers_dev = true
preview_urls = false

[vars]
REPO = "bopii6/videogen"

# 让 wrangler 把 .html 当纯文本打进包里，供 Worker 直接返回
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# 自定义域名（Cloudflare 会自动建 DNS 记录 + 签发证书）
[[routes]]
pattern = "vg.hellojoy.top"
custom_domain = true

[observability]
enabled = true
