name: tests

# 补上"改坏了当场知道"这一环：这两套测试都是离线的（不起服务器、不开浏览器、
# 不碰账号正本），所以能在 CI 里跑满绿。镜像构建与部署在 docker.yml，互不依赖。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend-contract:
    name: 前端出片契约测试（离线 29 条）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 装测试用的 DOM（linkedom 只装在 tests/.deps，不进 renderer/）
        working-directory: videogen/tests/.deps
        run: npm ci --no-audit --no-fund

      - name: 跑
        working-directory: videogen
        env:
          NODE_PATH: ${{ github.workspace }}/videogen/tests/.deps/node_modules
        run: node --test tests/frontend.test.cjs

      - name: 前端类型检查（tsc --noEmit，0 错误为基线）
        working-directory: videogen
        # CI 必须**真跑**：ts_check.sh 在没装 typescript 时会打印 SKIP 并 exit 0，
        # 那一步在 CI 里就是纯装饰 —— 一行绿字、一次类型都没查。所以先 npm ci，
        # 再把 SKIP 本身当失败：跳过不算通过（本地那条测试钉的是脚本文本，
        # CI 这层钉的是"这一轮到底查没查"）。
        run: |
          (cd renderer && npm ci --no-audit --no-fund)
          out="$(bash tools/ts_check.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          case "$out" in
            *SKIP*) echo "::error::tsc 在 CI 里被跳过了（npm ci 没装上 typescript）"; exit 1 ;;
          esac
          case "$out" in
            *"tsc --noEmit"*) : ;;
            *) echo "::error::ts_check.sh 没给出结论，这一轮等于没查"; exit 1 ;;
          esac

  backend-gate:
    name: 后端闸门（鉴权边界 / 状态文件 / 卡密 / 分镜节奏 / 剪映草稿）+ 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖（与镜像同一份锁定表；httpx 只给测试用）
        working-directory: videogen
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install httpx==0.28.1
          python -m pip check

      - name: 静态检查（规则与本地同一份 videogen/ruff.toml：只闸真缺陷，不闸排版）
        working-directory: videogen
        run: |
          pip install "ruff==0.16.8"
          ruff check . --output-format=github

      - name: 28 个模块全都要能 import（语法/循环依赖/可选依赖降级）
        working-directory: videogen
        run: python -c "import videogen.server; print('import OK')"

      - name: 跑
        working-directory: videogen
        run: bash tools/run_backend.sh
