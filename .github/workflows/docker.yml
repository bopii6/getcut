name: build-image

# 在 GitHub 云端构建镜像并推到 GHCR，任何云主机/容器平台可直接拉取：
#   docker pull ghcr.io/bopii6/videogen:latest
on:
  push:
    branches: [main]
    paths:
      - "getcut/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: getcut
          file: getcut/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/videogen:latest
            ghcr.io/${{ github.repository_owner }}/videogen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
