name: security

# 依赖漏洞这一环以前是零覆盖：装什么全凭"上次构建时没出事"。
# 2026-09-21 首跑实测：Python 侧 36 条锁定依赖、npm 侧（含 dev）**都是 0 个已知漏洞**，
# 所以这两步都设成**会拦人**的。哪天上游新爆 CVE，这里先红，而不是等客户先发现。
#
# 为什么要加定时那一栏：依赖是锁死的、不常重建，光靠 push 触发等于"锁完就再也不看"。
# 每周一重扫一次，新披露的漏洞才会自己浮上来。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  dependencies:
    name: 依赖漏洞（pip-audit 查锁定表 + npm audit 查前端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 侧（按 requirements.lock 逐条查 OSV）
        working-directory: getcut
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.lock --no-deps --strict --desc on

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 前端侧（renderer 依赖，含 dev：构建链被投毒同样是事故）
        working-directory: getcut/renderer
        run: npm audit --audit-level=low
