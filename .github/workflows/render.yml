name: render

# 云端渲染：把素材包 zip 放到 release，触发本工作流 → 容器里跑完整管线 → 成片回传到 release
# 由 Cloudflare Worker 调用（workflow_dispatch）
run-name: render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "任务 ID（Worker 生成，用于回传定位）"
        required: true
      bundle_tag:
        description: "素材包所在的 release tag（资产为该 tag 下的 zip）"
        required: true
      format:
        description: "成片形态：portrait_editorial / portrait"
        default: "portrait_editorial"
      voice:
        description: "音色（留空用默认）"
        default: ""
      rate:
        description: "语速，如 +15%（留空用默认）"
        default: ""
      bgm:
        description: "BGM 路径，如 assets/music/bgm-trap-400.mp3（留空=自动/不配）"
        default: ""
      subtitles:
        description: "字幕 on/off"
        default: "on"
      sources:
        description: "资料来源 on/off"
        default: "on"
      sfx:
        description: "音效 on/off"
        default: "on"
      use_llm:
        description: "LLM 导演/文案 on/off"
        default: "on"

permissions:
  contents: write
  packages: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/bopii6/videogen:latest
      JOB: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4

      - name: 取素材包（release 资产）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p in
          gh release download "${{ inputs.bundle_tag }}" -p "*.zip" -D in --clobber
          ZIP=$(ls in/*.zip | head -1)
          NAME=$(basename "$ZIP" .zip)
          mkdir -p data
          # 兼容 Windows 反斜杠路径 / 多套一层目录（uv 环境自带 python3）
          python3 tools/unzip_normalize.py "$ZIP" "data/$NAME"
          test -f "data/$NAME/content.json"
          echo "BUNDLE=$NAME" >> "$GITHUB_ENV"
          echo "素材包：$NAME（$(ls -A "data/$NAME" | wc -l) 项）"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取渲染镜像
        run: docker pull "$IMAGE"

      - name: 渲染（容器内跑完整管线）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(python -m videogen build "/data/$BUNDLE" -o /app/outputs/render.mp4
                --format "${{ inputs.format }}")
          [ -n "${{ inputs.voice }}" ] && ARGS+=(--voice "${{ inputs.voice }}")
          [ -n "${{ inputs.rate }}" ] && ARGS+=(--rate "${{ inputs.rate }}")
          [ -n "${{ inputs.bgm }}" ] && ARGS+=(--bgm "${{ inputs.bgm }}")
          [ "${{ inputs.subtitles }}" = "off" ] && ARGS+=(--no-subtitles) || true
          [ "${{ inputs.sources }}" = "off" ] && ARGS+=(--no-sources) || true
          [ "${{ inputs.sfx }}" = "off" ] && ARGS+=(--no-sfx) || true
          [ "${{ inputs.use_llm }}" = "off" ] && ARGS+=(--no-llm) || true
          mkdir -p out
          docker run --rm \
            -v "$PWD/data:/data" \
            -v "$PWD/out:/app/outputs" \
            -e DEEPSEEK_API_KEY -e ZHIPU_API_KEY \
            "$IMAGE" "${ARGS[@]}"
          ls -lh out/

      - name: 成片回传（release 资产，供 Worker 取回）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="out/render.mp4"
          test -f "$OUT"
          TAG="render-$JOB"
          gh release create "$TAG" "$OUT#video.mp4" \
            --title "成片 $JOB" \
            --notes "format=${{ inputs.format }} · bundle=$BUNDLE · 由 GitHub Actions 渲染" \
            || gh release upload "$TAG" "$OUT#video.mp4" --clobber
          echo "成片已发布：$TAG"

      - name: 失败也回传日志
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "render-$JOB" --title "渲染失败 $JOB" --notes "见 Actions 日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
