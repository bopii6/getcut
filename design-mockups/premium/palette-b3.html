<!doctype html>
<!-- GetCut 贵重感 B3 稿：在 B2（B 配色+大方形状）上借「严肃大报」的版式——
     版头细线、日期栏、双细线分隔、朱红印章。全篇无衬线黑体，靠字重撑场面。
     客户是 40+ 新闻/时评/投资人群：他们的"贵重"参照物是财新/经济学人头版。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GetCut · B3 紫玉描金（大报版）</title>
<style>
*{box-sizing:border-box;margin:0}
:root{
  --bg:#0D0B14; --surface:#171422; --surface2:#211D31;
  --ink:#EFECF6; --ink-2:#A79FBD;
  --line:#2E2942; --gold:#CBB88A; --gold-deep:#A6946C;
  --cinnabar:#B4433A;
}
body{background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:40px 28px 80px;text-align:center}
/* 版头：上下细线 + 中间黑体大字报名 + 日期栏 */
.masthead{border-top:3px double var(--gold-deep);border-bottom:1px solid var(--line);
  padding:26px 0 14px;margin-bottom:10px}
.mast-name{font-size:42px;font-weight:900;letter-spacing:.04em}
.mast-name small{font-family:"PingFang SC",sans-serif;font-size:16px;font-weight:500;color:var(--ink-2);margin-left:12px;letter-spacing:.2em}
.dateline{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);
  letter-spacing:.12em;padding:8px 2px;border-bottom:1px solid var(--line);margin-bottom:72px}
.kicker{font-size:15px;letter-spacing:.42em;text-indent:.42em;color:var(--gold);font-weight:600;margin-bottom:26px}
h1{font-size:56px;line-height:1.32;font-weight:900;letter-spacing:.01em;margin-bottom:22px}
h1 em{font-style:normal;color:var(--gold)}
.sub{font-size:18px;color:var(--ink-2);margin-bottom:60px}
/* 卡片 = 专栏：顶部双细线，标题居中 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:44px 44px 38px;text-align:left;position:relative}
.card::before{content:"";position:absolute;top:0;left:10%;right:10%;height:0;
  border-top:3px double var(--gold-deep)}
.row{display:flex;align-items:baseline;justify-content:space-between}
.row h3{font-size:26px;font-weight:800;letter-spacing:.04em}
.price{font-size:54px;font-weight:900;letter-spacing:-.01em}
.price small{font-size:15px;color:var(--ink-2);font-weight:500;margin-left:8px;font-family:"PingFang SC",sans-serif}
.fine{font-size:16px;color:var(--ink-2);margin:8px 0 26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
ul{list-style:none;margin:6px 0 34px;display:grid;gap:15px}
li{font-size:16.5px;line-height:1.65;padding-left:26px;position:relative}
li::before{content:"";position:absolute;left:2px;top:12px;width:8px;height:8px;
  background:var(--gold);transform:rotate(45deg)}
li b{font-weight:700}
.btn{display:block;width:100%;padding:18px;border-radius:6px;border:1px solid var(--gold-deep);
  cursor:pointer;background:linear-gradient(180deg,#D6C296,#BFA672);color:#241D0C;
  font-size:18px;font-weight:800;letter-spacing:.12em;text-indent:.12em}
.voices{margin-top:36px;border-top:1px solid var(--line);padding-top:26px}
.vlabel{font-size:15px;color:var(--ink-2);margin-bottom:14px;letter-spacing:.06em}
/* 音色 = 报纸栏目导航：文字+下划线，不做药丸 */
.chips{display:flex;flex-wrap:wrap;gap:26px}
.chip{padding:6px 2px;border-bottom:2px solid transparent;font-size:16px;font-weight:600;
  color:var(--ink-2);cursor:pointer}
.chip.on{color:var(--gold);border-bottom-color:var(--gold)}
/* 朱红印章：新闻人吃"落印=成交"这一套 */
.seal{position:absolute;right:26px;top:120px;width:88px;height:88px;border:2px solid var(--cinnabar);
  border-radius:8px;color:var(--cinnabar);display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-size:19px;font-weight:800;letter-spacing:.1em;line-height:1.5;
  transform:rotate(8deg);opacity:.92}
.seal span{font-size:12px;font-weight:600;letter-spacing:.24em}
.foot{margin-top:56px;font-size:15px;color:var(--ink-2);letter-spacing:.08em}
.foot b{color:var(--gold);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead"><span class="mast-name">GetCut<small>视频工作台</small></span></div>
  <div class="dateline"><span>买断制 · 不订阅 · 不涨价</span><span>财经 / 时事 / 热点评论</span></div>
  <div class="kicker">一次付费</div>
  <h1>永久是<em>你的。</em></h1>
  <p class="sub">从一个压缩包，到一条能发的片子。</p>
  <div class="card">
    <div class="seal">永久<span>有效</span></div>
    <div class="row"><h3>高级版</h3><span class="price">599<small>一次付费 · 永久有效</small></span></div>
    <p class="fine">把片子变成「你的」。</p>
    <ul>
      <li><b>基础版全部权益</b>，一条不少</li>
      <li><b>剪映草稿导出</b> —— 成片接着精剪，导进去就是分好镜的</li>
      <li><b>品牌套件</b>：你的 Logo、文字水印，每条片自动带上</li>
      <li><b>声音克隆</b>：录一分钟，以后都用你自己的声音配音</li>
      <li><b>优先出片</b>：高峰期渲染队列排在免费任务前面</li>
    </ul>
    <button class="btn">加微信，开通高级版</button>
    <div class="voices">
      <div class="vlabel">配音音色 · 沉稳播报</div>
      <div class="chips">
        <span class="chip on">云扬</span><span class="chip">云健</span>
        <span class="chip">云希</span><span class="chip">我的声音</span>
      </div>
    </div>
  </div>
  <p class="foot">付款由创始人<b>一对一</b>对接，转账后 5 分钟内发卡密</p>
</div>
</body>
</html>
