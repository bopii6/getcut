<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>现版复刻 · 首页（对照基线）</title>
<style>
:root{
  --bg:#0e0e11; --surface:#17171b; --surface2:#1c1c21; --sunken:#121216;
  --ink:#f4f4f6; --ink-2:#b6b6c0; --ink-3:#85858d;
  --line:#232329; --line2:#2e2e36;
  --acc:#d8b36a; --acc-ink:#1c1508; --acc-soft:rgba(216,179,106,.12);
  --btn-bg:#f4f4f6; --btn-ink:#101014;
  --ok:#5fa97a; --media:#0a0a0d;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}

.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:0 22px;height:58px;flex:none;
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .wm{font-size:17px;font-weight:800;letter-spacing:.02em}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--line2);color:var(--ink-2);font-size:13px;font-weight:600}
.me{display:flex;align-items:center;gap:8px}
.avatar{width:24px;height:24px;border-radius:50%;background:#2a2320;border:1.5px solid var(--acc);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.me b{font-size:13.5px;font-weight:650}
.tier{font-size:10.5px;font-weight:700;color:var(--acc);border:1px solid rgba(216,179,106,.45);
  border-radius:5px;padding:1px 7px}

.body{display:grid;grid-template-columns:minmax(400px,452px) 1fr;flex:1;min-height:0;
  width:100%;max-width:1240px;margin:0 auto}
.pane{overflow-y:auto;padding:22px 24px 20px;display:flex;flex-direction:column;gap:16px}
.pane.right{background:var(--bg);align-items:center;justify-content:center;padding:20px;overflow:hidden}

.lede{font-size:14.5px;color:var(--ink-2);line-height:1.7}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:13px;padding:13px 12px;border-radius:10px;border:1px solid transparent}
.step.on{background:transparent;border-color:transparent}
.step .no{width:26px;height:26px;flex:none;margin-top:1px;border-radius:8px;
  border:1.5px solid var(--line2);color:var(--ink-3);font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;background:var(--surface);font-family:var(--mono)}
.step.on .no{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.step .wrap{min-width:0;flex:1}
.step .t{font-size:16px;font-weight:750;letter-spacing:.01em}
.step .c{margin-top:12px}

.btn{display:block;width:100%;text-align:center;padding:14px 22px;border-radius:11px;
  background:var(--btn-bg);color:var(--btn-ink);font-size:16px;font-weight:800;letter-spacing:.02em;
  box-shadow:0 12px 32px rgba(0,0,0,.35)}
.drop{display:flex;flex-direction:column;gap:9px;padding:0;border-radius:0;border:none;
  background:transparent;color:var(--ink-2);font-size:13px;line-height:1.7;cursor:pointer}
.drop .dim{font-size:12.5px;color:var(--ink-3);line-height:1.7}
.drop .dim a{color:var(--acc)}

.envcheck{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:auto;
  padding-top:14px;border-top:1px dashed var(--line)}
.envres{font-size:13.5px;font-weight:700;color:#7fcb96}
.envre{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.envsub{flex-basis:100%;font-size:12px;color:var(--ink-3);line-height:1.65;padding-left:2px}

.stagedrop{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:30px;text-align:center;cursor:pointer;
  border:1.5px dashed rgba(255,255,255,.16);border-radius:14px;color:#8a857d;background:var(--media)}
.stagedrop .t{font-size:19px;font-weight:800;color:#efece7}
.stagedrop .s{font-size:13.5px;line-height:1.9}
.stagedrop .dim{opacity:.62;font-size:12.5px}

.footbar{flex:none;display:flex;align-items:center;gap:16px;padding:0 22px;height:40px;
  background:var(--bg);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32"><path d="M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z" fill="var(--acc)"/><path d="M10.5 8.6 23.6 15.6 10.5 22.6Z" fill="var(--acc-ink)"/></svg>
      <span class="wm">GetCut</span>
    </div>
    <div class="top-right">
      <a class="chip" href="#">作品库</a>
      <span class="me"><span class="avatar">🦊</span><b>创作者2997</b><span class="tier">高级版</span></span>
    </div>
  </header>

  <div class="body">
    <div class="pane left">
      <div class="lede">拖入素材包，一条好片子在你这台电脑上完成。</div>
      <div class="steps">
        <div class="step on">
          <div class="no">1</div>
          <div class="wrap">
            <div class="t">导入素材包</div>
            <div class="c">
              <div class="drop">
                <button class="btn">选择素材包 zip</button>
                <span class="dim">不解压，文案与素材一起读入 · 也可以直接拖到右边那块</span>
                <span class="dim">还没有素材包？<a href="#">下载一条现成的</a> 看它长什么样 · 注册后每天免费出 2 条（片子在你自己电脑上生成）</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="envcheck">
        <span class="envres">✓ 这台电脑可以正常出片</span>
        <button class="envre">重新检查</button>
        <span class="envsub">已检查：浏览器兼容 · 硬件加速（开）· 处理器 18 核 · 内存 32 GB · 网络（在线）</span>
      </div>
    </div>

    <div class="pane right">
      <div class="stagedrop">
        <svg width="44" height="44" viewBox="0 0 32 32"><path d="M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z" fill="var(--acc)"/><path d="M10.5 8.6 23.6 15.6 10.5 22.6Z" fill="var(--acc-ink)"/></svg>
        <div class="t">素材包拖到这里</div>
        <div class="s">文案、图片、视频一起读入，成片在这里出现</div>
        <div class="s dim">也可以点左边第 1 步选文件 · zip 不解压</div>
      </div>
    </div>
  </div>

  <footer class="footbar">本机出片能力 正常</footer>
</div>
</body>
</html>
