<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页主视觉样张 · 压缩包 → 成片</title>
<style>
:root{
  --bg:#0D0B14; --surface:#171422; --surface2:#211D31; --sunken:#131019;
  --ink:#EFECF6; --ink-2:#A79FBD;
  --line:#2E2942; --line2:#3B3555;
  --acc:#CBB88A; --acc-ink:#241D0C; --acc-soft:rgba(203,184,138,.10);
  --media:#080A0F;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  --ease:cubic-bezier(.25,.6,.3,1);
}
*{box-sizing:border-box;margin:0}
body{color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.65;
  background:radial-gradient(1100px 480px at 50% -160px,rgba(203,184,138,.07),transparent 65%),
             radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px),var(--bg);
  background-size:auto,22px 22px,auto;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
video{display:block}
.note{max-width:1000px;margin:18px auto 0;padding:10px 16px;border:1px dashed var(--line2);
  border-radius:8px;color:var(--ink-2);font-size:13px}
.note b{color:var(--acc)}
.wrap{max-width:1000px;margin:0 auto;padding:40px 24px 80px}

/* ── 主视觉：一条“生产线”横贯，左边压缩包进料，右边成品出片 ── */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,300px);
  align-items:center;gap:10px;padding:26px 0 8px}
/* 进料口：素材包 */
.pack{position:relative;width:236px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);transform:rotate(-2.5deg);
  animation:packIn .7s var(--ease) both}
.pack::after{content:"";position:absolute;inset:-1px;border-radius:12px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(203,184,138,.25),0 0 34px rgba(203,184,138,.10)}
.pack-h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.zipb{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;flex:none;
  background:var(--acc);color:var(--acc-ink);font-family:var(--mono);font-size:12px;font-weight:800}
.pack-h b{font-size:15px}
.pack-h small{display:block;color:var(--ink-2);font-size:12.5px;font-weight:400}
.pack ul{padding:6px 15px 12px}
.pack li{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px;color:var(--ink-2);
  border-top:1px dashed var(--line)}
.pack li:first-child{border-top:0}
.pack li svg{width:15px;height:15px;color:var(--ink-2);flex:none}
.pack li b{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600}
/* 传送带：虚线 + 跑动的光点 + 工序词 */
.line{position:relative;height:120px}
.line .rail{position:absolute;left:6px;right:6px;top:50%;height:2px;
  background:linear-gradient(90deg,rgba(203,184,138,.15),rgba(203,184,138,.55),rgba(203,184,138,.15));
  overflow:hidden}
.line .rail::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,var(--acc) 0 10px,transparent 10px 26px);
  opacity:.55;animation:dash 1.1s linear infinite}
@keyframes dash{to{transform:translateX(26px)}}
.dot{position:absolute;top:50%;left:0;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;
  background:var(--acc);box-shadow:0 0 12px rgba(203,184,138,.9);
  animation:run 2.6s cubic-bezier(.4,0,.6,1) infinite}
.dot:nth-child(3){animation-delay:.85s}
.dot:nth-child(4){animation-delay:1.7s}
@keyframes run{from{left:2%;opacity:0}12%{opacity:1}88%{opacity:1}to{left:96%;opacity:0}}
.steps{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:space-between;
  font-size:12.5px;color:var(--ink-2);letter-spacing:.05em;padding:0 2px}
.steps span{background:var(--bg);padding:2px 8px;border:1px solid var(--line);border-radius:999px}
.steps span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--acc);margin-right:6px;vertical-align:1px;animation:blink 2.6s ease-in-out infinite}
.steps span:nth-child(2)::before{animation-delay:.5s}
.steps span:nth-child(3)::before{animation-delay:1s}
.steps span:nth-child(4)::before{animation-delay:1.5s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
/* 出片口：成品手机，大、亮、自动播 */
.out{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;
  animation:outIn .7s var(--ease) .25s both}
.phone{width:212px;aspect-ratio:9/16;border-radius:26px;overflow:hidden;background:var(--media);
  border:1px solid var(--line2);
  box-shadow:0 26px 70px rgba(0,0,0,.65),0 0 60px rgba(203,184,138,.22),inset 0 0 0 1px rgba(203,184,138,.2)}
.phone video{width:100%;height:100%;object-fit:cover}
.out .halo{position:absolute;z-index:-1;left:50%;top:46%;width:330px;height:330px;translate:-50% -50%;
  border-radius:50%;background:radial-gradient(closest-side,rgba(203,184,138,.16),transparent);
  animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.out .tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
  color:var(--acc);letter-spacing:.08em}
.out .tag::before{content:"";width:22px;height:1px;background:var(--acc)}
@keyframes packIn{from{opacity:0;transform:rotate(-2.5deg) translateX(-26px)}}
@keyframes outIn{from{opacity:0;transform:translateY(14px) scale(.96)}}

/* ── 说明：主视觉之后才出场 ── */
.copy{text-align:center;margin-top:26px}
.copy h1{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.3}
.copy h1 em{font-style:normal;color:var(--acc)}
.copy p{font-size:15.5px;color:var(--ink-2);margin-top:10px}
/* ── 拖拽入口：退居说明之下 ── */
.drop{display:block;max-width:680px;margin:26px auto 0;padding:26px 22px;width:100%;
  background:var(--surface);border:1.5px dashed var(--line2);border-radius:14px;
  transition:border-color .2s,background .2s;text-align:center}
.drop:hover{border-color:var(--acc);background:var(--surface2)}
.drop b{display:block;font-size:16px}
.drop span{display:block;color:var(--ink-2);font-size:13.5px;margin-top:4px}
.drop .zip{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;
  background:var(--acc-soft);border:1px solid rgba(203,184,138,.4);color:var(--acc);
  font-family:var(--mono);font-size:11.5px;font-weight:800;margin:0 auto 10px}
.replay{position:fixed;right:18px;bottom:18px;padding:9px 16px;border:1px solid var(--line2);
  border-radius:9px;background:var(--surface);color:var(--ink-2);font-size:13px}
.replay:hover{color:var(--ink)}
@media(max-width:820px){.stage{grid-template-columns:1fr;justify-items:center;gap:26px}
  .line{width:100%;height:86px}.phone{width:190px}.copy h1{font-size:29px}}
</style>
</head>
<body>
<p class="note">样张说明（正式页面不会有）：第一眼就是这条「生产线」——左边你拖进来的压缩包，中间光点带着 <b>配音 · 画面 · 字幕 · 音效</b> 流过去，右边直接站着一部正在播的成片。页面载入时演一遍「进料 → 出片」，之后传送带和光点一直循环。看完点右下角「重播入场」可再看一遍开场动画。</p>

<div class="wrap">
  <section class="stage" id="stage">
    <div class="pack">
      <div class="pack-h"><span class="zipb">ZIP</span><b>素材包<small>你拖进来的</small></b></div>
      <ul>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>定稿口播文案<b>一篇</b></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 17.5 10 12l4 4 3-3 2.5 2.5"/></svg>相关图片<b>20 来张</b></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M8 4.5v15M16 4.5v15M3.5 9H8M3.5 15H8M16 9h4.5M16 15h4.5"/></svg>实拍视频片段<b>几段</b></li>
      </ul>
    </div>

    <div class="line" aria-hidden="true">
      <div class="steps"><span>配音</span><span>画面</span><span>字幕</span><span>音效</span></div>
      <div class="rail"></div>
      <i class="dot"></i><i class="dot"></i><i class="dot"></i>
    </div>

    <div class="out">
      <span class="tag">成品·自动播出</span>
      <div class="halo"></div>
      <div class="phone"><video id="film" muted loop playsinline autoplay preload="metadata"
        src="../../videogen/server_static/templates/sample-zhigu.mp4"
        poster="../../videogen/server_static/templates/tpl-zhigu.png"></video></div>
    </div>
  </section>

  <section class="copy">
    <h1>丢给它一个素材包，<em>还你一条能发的成片</em>。</h1>
    <p>配音、画面、字幕、音效全自动——放进来先检查内容，点确认才开始生成。</p>
  </section>

  <button class="drop">
    <span class="zip">ZIP</span>
    <b>把素材包拖到这里</b>
    <span>无需解压 · zip 最大 512 MB · 或点击选择文件</span>
  </button>
</div>

<button class="replay" onclick="location.reload()">↻ 重播入场</button>
</body>
</html>
