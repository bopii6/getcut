<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张B · 左动作 + 右竖屏出片位</title>
<style>
:root {
  --bg: #0e0e11; --surface: #17171b; --surface2: #1c1c21; --sunken: #121216;
  --ink: #f4f4f6; --ink-2: #b6b6c0; --ink-3: #85858d;
  --line: #232329; --line2: #2e2e36;
  --acc: #d8b36a; --acc-ink: #1c1508; --acc-soft: rgba(216,179,106,.12);
  --btn-bg: #f4f4f6; --btn-ink: #101014;
  --ok: #7fcb96; --media: #0a0a0d;
  --sh-pop: 0 16px 44px rgba(0,0,0,.45);
  --sans: "PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono: ui-monospace,"SF Mono",Consolas,monospace;
  --ease: cubic-bezier(.25,.6,.3,1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0 }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased }
a { color: inherit; text-decoration: none }
button { cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit }

.shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 22px; height: 58px;
  flex: none; background: var(--surface); border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: center; gap: 10px }
.brand .wm { font-size: 17px; font-weight: 800; letter-spacing: .02em }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 8px;
  border: 1px solid var(--line2); color: var(--ink-2); font-size: 13px; font-weight: 600 }
.chip:hover { color: var(--ink); border-color: var(--acc); background: var(--acc-soft) }
.account { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px;
  border-radius: 999px; border: 1px solid var(--line2) }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: #5b4a8a;
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff }
.account b { font-size: 13px; font-weight: 700 }
.tier { font-size: 11px; font-weight: 800; color: var(--acc); border: 1px solid rgba(216,179,106,.45);
  border-radius: 5px; padding: 1px 6px; background: var(--acc-soft) }

/* ── 主区:左动作 452px + 右出片位 ── */
.body { display: grid; grid-template-columns: minmax(400px, 452px) 1fr; flex: 1; min-height: 0;
  width: 100%; max-width: 1240px; margin: 0 auto }
.pane { overflow-y: auto; padding: 34px 30px 24px; display: flex; flex-direction: column; gap: 20px }
.lede { font-size: 19px; font-weight: 750; line-height: 1.7; letter-spacing: .01em }
.lede .gold { color: var(--acc) }
.btn { display: block; width: 100%; text-align: center; padding: 16px 22px; border-radius: 12px;
  background: var(--btn-bg); color: var(--btn-ink); font-size: 16.5px; font-weight: 800;
  letter-spacing: .02em; box-shadow: 0 12px 32px rgba(0,0,0,.35) }
.dim { font-size: 12.5px; color: var(--ink-3); line-height: 1.8 }
.dim a { color: var(--acc) }

.ministeps { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 18px;
  display: flex; flex-direction: column; gap: 13px }
.ms { display: flex; gap: 12px; align-items: baseline }
.ms .no { font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--acc); flex: none }
.ms .t { font-size: 14px; font-weight: 700; color: var(--ink-2) }
.ms .s { font-size: 12.5px; color: var(--ink-3) }

.env { margin-top: auto; padding-top: 16px; border-top: 1px dashed var(--line);
  display: flex; gap: 12px; align-items: center; font-size: 12.5px }
.env .ok { color: var(--ok); font-weight: 700 }
.env .re { color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px }

/* ── 右:竖屏出片位 ── */
.pane.right { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 24px; overflow: hidden; position: relative }
.slot { position: relative; height: min(70vh, 660px); aspect-ratio: 9 / 16; border-radius: 18px;
  background:
    radial-gradient(120% 90% at 18% 0%, rgba(216,179,106,.16), transparent 55%),
    radial-gradient(90% 70% at 85% 100%, rgba(216,179,106,.07), transparent 60%),
    linear-gradient(175deg, #1b1b21 0%, #101014 58%, #0a0a0d 100%);
  border: 1px solid var(--line2);
  box-shadow: 0 24px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.02) inset;
  overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  cursor: pointer;
  transition: border-color .15s var(--ease) }
.slot:hover { border-color: var(--acc) }
.slot::before { content: ''; position: absolute; inset: 14px; border-radius: 12px;
  border: 1.5px dashed rgba(255,255,255,.13); pointer-events: none }
.slot:hover::before { border-color: rgba(216,179,106,.55) }
.play { width: 74px; height: 74px; border-radius: 50%; background: var(--acc);
  display: grid; place-items: center; box-shadow: 0 14px 40px rgba(216,179,106,.28) }
.play svg { display: block }
.slot .t { font-size: 20px; font-weight: 800; color: #efece7 }
.slot .s { font-size: 13px; color: #8a857d }
.slot .strip { position: absolute; bottom: 30px; display: flex; flex-direction: column;
  gap: 8px; width: 62%; }
.slot .strip i { display: block; height: 8px; border-radius: 4px;
  background: rgba(255,255,255,.07) }
.slot .strip i:nth-child(2) { width: 84% }
.slot .strip i:nth-child(3) { width: 46%; background: rgba(216,179,106,.35) }
.cap { font-size: 12.5px; color: var(--ink-3); font-family: var(--mono) }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32"><path d="M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z" fill="#d8b36a"/><path d="M10.5 8.6 23.6 15.6 10.5 22.6Z" fill="#1c1508"/></svg>
      <span class="wm">GetCut</span>
    </div>
    <div class="top-right">
      <a class="chip" href="#">作品展示</a>
      <a class="chip" href="#">作品库</a>
      <span class="account"><span class="avatar">王</span><b>老王</b><span class="tier">高级版</span></span>
    </div>
  </header>

  <div class="body">
    <div class="pane left">
      <div class="lede">拖入素材包,<br>一条好片子在<span class="gold">你这台电脑</span>上完成。</div>

      <button class="btn">选择素材包 zip</button>
      <span class="dim">zip 不解压,文案与素材一起读入 · 还没有素材包?<a href="#">下载一条现成的</a> · 注册后每天免费出 2 条</span>

      <div class="ministeps">
        <div class="ms"><span class="no">01</span><span class="t">导入素材包</span><span class="s">—— 文案、图片、视频一起读入</span></div>
        <div class="ms"><span class="no">02</span><span class="t">核对与配音</span><span class="s">—— 口播、画面样式、音色,确认再生成</span></div>
        <div class="ms"><span class="no">03</span><span class="t">本机出片</span><span class="s">—— 浏览器渲染混音,成片直接下载</span></div>
      </div>

      <div class="env"><span class="ok">✓ 这台电脑可以正常出片</span><a class="re" href="#">重新检查</a></div>
    </div>

    <div class="pane right">
      <div class="slot">
        <div class="play"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5.5 18.5 12 8 18.5Z" fill="#1c1508"/></svg></div>
        <div class="t">成片在这里出现</div>
        <div class="s">把素材包拖到这张卡上,或点左边选择</div>
        <div class="strip" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <div class="cap">1080 × 1920 · 竖屏</div>
    </div>
  </div>
</div>
</body>
</html>
