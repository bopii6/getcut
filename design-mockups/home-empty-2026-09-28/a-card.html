<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张A · 居中纸卡</title>
<style>
:root {
  --bg: #0e0e11; --surface: #17171b; --surface2: #1c1c21; --sunken: #121216;
  --ink: #f4f4f6; --ink-2: #b6b6c0; --ink-3: #85858d;
  --line: #232329; --line2: #2e2e36;
  --acc: #d8b36a; --acc-ink: #1c1508; --acc-soft: rgba(216,179,106,.12);
  --btn-bg: #f4f4f6; --btn-ink: #101014;
  --ok: #7fcb96;
  --media: #0a0a0d;
  --sh-pop: 0 16px 44px rgba(0,0,0,.45);
  --sans: "PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono: ui-monospace,"SF Mono",Consolas,monospace;
  --ease: cubic-bezier(.25,.6,.3,1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0 }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased }
a { color: inherit; text-decoration: none }

.shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 22px; height: 58px;
  flex: none; background: var(--surface); border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: center; gap: 10px }
.brand .wm { font-size: 17px; font-weight: 800; letter-spacing: .02em }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 8px;
  border: 1px solid var(--line2); color: var(--ink-2); font-size: 13px; font-weight: 600 }
.chip:hover { color: var(--ink); border-color: var(--acc); background: var(--acc-soft) }
.account { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px;
  border-radius: 999px; border: 1px solid var(--line2) }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: #5b4a8a;
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff }
.account b { font-size: 13px; font-weight: 700 }
.tier { font-size: 11px; font-weight: 800; color: var(--acc); border: 1px solid rgba(216,179,106,.45);
  border-radius: 5px; padding: 1px 6px; background: var(--acc-soft) }

/* ── 主区:一柱居中 ── */
.main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 24px 90px; position: relative }
h1 { font-size: 33px; font-weight: 850; line-height: 1.55; letter-spacing: .015em;
  text-align: center; max-width: 640px }
h1 .gold { color: var(--acc) }

.card { width: 560px; max-width: 100%; margin-top: 34px; background: var(--surface);
  border: 1px solid var(--line2); border-radius: 16px; padding: 26px 28px 22px;
  box-shadow: var(--sh-pop); text-align: center; position: relative;
  transition: border-color .15s var(--ease) }
.card:hover { border-color: var(--acc) }
.card .hint { position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
  font-size: 12px; font-weight: 700; color: var(--acc); background: var(--bg);
  padding: 0 12px; letter-spacing: .08em; white-space: nowrap }
.btn { display: block; width: 100%; text-align: center; padding: 16px 22px; border-radius: 12px;
  background: var(--btn-bg); color: var(--btn-ink); font-size: 17px; font-weight: 800;
  letter-spacing: .02em; box-shadow: 0 12px 32px rgba(0,0,0,.35); cursor: pointer }
.dim { display: block; margin-top: 13px; font-size: 12.5px; color: var(--ink-3); line-height: 1.8 }
.dim a { color: var(--acc) }

.steps { display: flex; gap: 34px; margin-top: 36px; align-items: flex-start }
.st { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px }
.st .no { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(216,179,106,.5);
  color: var(--acc); font-size: 12.5px; font-weight: 800; display: grid; place-items: center;
  font-family: var(--mono); background: var(--acc-soft) }
.st .t { font-size: 13.5px; font-weight: 700; color: var(--ink-2) }
.st .s { font-size: 12px; color: var(--ink-3); line-height: 1.7 }
.steps .arrow { align-self: flex-start; margin-top: 6px; color: var(--line2); font-size: 15px }

.env { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; gap: 12px;
  align-items: center; justify-content: center; font-size: 12.5px }
.env .ok { color: var(--ok); font-weight: 700 }
.env .re { color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32"><path d="M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z" fill="#d8b36a"/><path d="M10.5 8.6 23.6 15.6 10.5 22.6Z" fill="#1c1508"/></svg>
      <span class="wm">GetCut</span>
    </div>
    <div class="top-right">
      <a class="chip" href="#">作品展示</a>
      <a class="chip" href="#">作品库</a>
      <span class="account"><span class="avatar">王</span><b>老王</b><span class="tier">高级版</span></span>
    </div>
  </header>

  <main class="main">
    <h1>拖入素材包,<br>一条好片子在<span class="gold">你这台电脑</span>上完成。</h1>

    <div class="card">
      <span class="hint">把 zip 拖到这张卡上也行</span>
      <button class="btn">选择素材包 zip</button>
      <span class="dim">zip 不解压,文案与素材一起读入 · 还没有素材包?<a href="#">下载一条现成的</a> · 注册后每天免费出 2 条</span>
    </div>

    <div class="steps">
      <div class="st"><span class="no">1</span><span class="t">导入素材包</span><span class="s">文案、图片、视频<br>一起读入</span></div>
      <span class="arrow">→</span>
      <div class="st"><span class="no">2</span><span class="t">核对与配音</span><span class="s">口播文案、画面样式、<br>音色,确认再生成</span></div>
      <span class="arrow">→</span>
      <div class="st"><span class="no">3</span><span class="t">本机出片</span><span class="s">浏览器渲染混音,<br>成片直接下载</span></div>
    </div>

    <div class="env"><span class="ok">✓ 这台电脑可以正常出片</span><a class="re" href="#">重新检查</a></div>
  </main>
</div>
</body>
</html>
