:root{
  --bg:#0e0e11; --ink:#f4f4f6; --ink-2:#b6b6c0; --ink-3:#85858d;
  --acc:#d8b36a; --acc-ink:#1c1508;
  --btn-bg:#f4f4f6; --btn-ink:#101014;
  --ok:#7fcb96;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --serif:"NotoSerifSCSub","Noto Serif SC","Source Han Serif SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
/* 顶部一抹极淡的金晕，给深底一点纵深，不当装饰看 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(1100px 480px at 50% -12%,rgba(216,179,106,.055),transparent 68%)}
button{cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.topbar{display:flex;align-items:center;gap:12px;padding:0 30px;height:64px;flex:none;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px}
.brand .wm{font-size:17px;font-weight:800;letter-spacing:.02em}
.top-right{margin-left:auto;display:flex;align-items:center;gap:26px}
.tlink{font-size:13.5px;color:var(--ink-2);transition:color .15s}
.tlink:hover{color:var(--acc)}
.me{display:flex;align-items:center;gap:8px;margin-left:2px}
.avatar{width:26px;height:26px;border-radius:50%;background:#2a2320;border:1.5px solid var(--acc);
  display:flex;align-items:center;justify-content:center;font-size:14px}
.me b{font-size:13.5px;font-weight:650}
.tier{font-size:10.5px;font-weight:700;color:var(--acc);border:1px solid rgba(216,179,106,.45);
  border-radius:5px;padding:1px 7px}

/* 一屏一柱：整页即拖放区，不再画框 */
.hero{flex:1;min-height:0;position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 40px;gap:0}
.ornament{width:38px;height:1px;background:var(--acc);opacity:.85;margin-bottom:34px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.66;
  letter-spacing:.055em;color:var(--ink)}
.hero .sub{font-size:15px;color:var(--ink-2);margin-top:26px;letter-spacing:.04em}
.pick{margin-top:40px;padding:17px 46px;border-radius:999px;background:var(--btn-bg);color:var(--btn-ink);
  font-size:16.5px;font-weight:800;letter-spacing:.06em;
  box-shadow:0 16px 44px rgba(0,0,0,.45);transition:filter .15s,transform .12s}
.pick:hover{filter:brightness(1.06)}
.pick:active{transform:translateY(1px)}
.micro{font-size:13px;color:#a9a9b4;margin-top:18px;letter-spacing:.03em}
.micro a{color:var(--acc)}

.envline{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:0 0 26px;font-size:12.5px;color:var(--ink-3);position:relative;z-index:2}
.envline .ok{color:var(--ok);font-weight:700}
.envline button{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 32 32"><path d="M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z" fill="var(--acc)"/><path d="M10.5 8.6 23.6 15.6 10.5 22.6Z" fill="var(--acc-ink)"/></svg>
      <span class="wm">GetCut</span>
    </div>
    <div class="top-right">
      <a class="tlink" href="#">作品展示</a>
      <a class="tlink" href="#">作品库</a>
      <span class="me"><span class="avatar">🦊</span><b>创作者2997</b><span class="tier">高级版</span></span>
    </div>
  </header>

  <main class="hero">
    <div class="ornament"></div>
    <h1>一包素材，<br>一条好片子。</h1>
    <div class="sub">文案、图片、视频一起读入，生成就在这台电脑上完成。</div>
    <button class="pick">选择素材包 zip</button>
    <div class="micro">把 zip 直接拖进这页任意位置 · 还没有素材包？<a href="#">下载一条现成的</a></div>
  </main>

  <div class="envline">
    <span class="ok">✓ 这台电脑可以正常出片</span>
    <button>重新检查</button>
  </div>
</body>
</html>
