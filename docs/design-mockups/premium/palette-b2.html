<!doctype html>
<!-- GetCut 贵重感 B2 稿：配色锁定 B（紫玉描金），形状语言重做——
     给 40~50 岁客户的「简洁中有贵重」：居中对齐、字号更大、矩形小圆角、
     金色只点在关键处、按钮厚实、留白足、无发光无渐变。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GetCut · B2 紫玉描金（大方版）</title>
<style>
@font-face{font-family:"Display";src:url("display-subset.woff2") format("woff2");font-weight:900;font-display:swap}
*{box-sizing:border-box;margin:0}
:root{
  --bg:#0D0B14; --surface:#171422; --surface2:#211D31;
  --ink:#EFECF6; --ink-2:#A79FBD;
  --line:#2E2942; --gold:#CBB88A; --gold-deep:#A6946C;
  --acc:#A493D6; --acc-ink:#17122B;
}
body{background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:56px 28px 80px;text-align:center}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:88px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px}
.logo{width:34px;height:34px;border-radius:8px;border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:15px}
.hdr-r{display:flex;gap:10px}
.hdr-r button{padding:9px 22px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2)}
.hdr-r button.solid{background:var(--surface2);color:var(--ink);border-color:var(--gold-deep)}
.kicker{font-size:15px;letter-spacing:.42em;text-indent:.42em;color:var(--gold);font-weight:600;margin-bottom:26px}
h1{font-family:"Display",serif;font-size:58px;line-height:1.3;font-weight:900;margin-bottom:22px}
h1 em{font-style:normal;color:var(--gold)}
.sub{font-size:18px;color:var(--ink-2);margin-bottom:64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:44px 44px 38px;text-align:left;position:relative}
.card::before{content:"";position:absolute;top:-1px;left:18%;right:18%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(203,184,138,.65),transparent)}
.row{display:flex;align-items:baseline;justify-content:space-between}
.row h3{font-size:22px;font-weight:750;letter-spacing:.02em}
.price{font-family:"Display",serif;font-size:52px;font-weight:900;color:var(--ink)}
.price small{font-size:16px;color:var(--ink-2);font-weight:500;margin-left:8px;font-family:"PingFang SC",sans-serif}
.fine{font-size:16px;color:var(--ink-2);margin-top:8px}
ul{list-style:none;margin:30px 0 34px;display:grid;gap:14px}
li{font-size:16.5px;line-height:1.6;padding-left:28px;position:relative;color:var(--ink)}
li::before{content:"";position:absolute;left:2px;top:11px;width:9px;height:9px;
  background:var(--gold);transform:rotate(45deg)}
li b{font-weight:700}
.btn{display:block;width:100%;padding:18px;border-radius:8px;border:1px solid var(--gold-deep);
  cursor:pointer;background:linear-gradient(180deg,#D6C296,#BFA672);color:#241D0C;
  font-size:18px;font-weight:800;letter-spacing:.12em;text-indent:.12em}
.voices{margin-top:36px;border-top:1px solid var(--line);padding-top:28px}
.vlabel{font-size:15px;color:var(--ink-2);margin-bottom:14px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:11px 22px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);
  font-size:16px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(203,184,138,.08)}
.foot{margin-top:56px;font-size:15px;color:var(--ink-2);letter-spacing:.08em}
.foot b{color:var(--gold);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand"><span class="logo">▶</span>GetCut <span style="color:var(--ink-2);font-weight:500;font-size:16px">视频工作台</span></span>
    <span class="hdr-r"><button>登录</button><button class="solid">注册</button></span>
  </header>
  <div class="kicker">买断制 · 不订阅 · 不涨价</div>
  <h1>一次付费，<em>永久是你的。</em></h1>
  <p class="sub">从一个压缩包，到一条能发的片子。</p>
  <div class="card">
    <div class="row"><h3>高级版</h3><span class="price">599<small>一次付费 · 永久有效</small></span></div>
    <p class="fine">把片子变成「你的」。</p>
    <ul>
      <li><b>基础版全部权益</b>，一条不少</li>
      <li><b>剪映草稿导出</b> —— 成片接着精剪，导进去就是分好镜的</li>
      <li><b>品牌套件</b>：你的 Logo、文字水印，每条片自动带上</li>
      <li><b>声音克隆</b>：录一分钟，以后都用你自己的声音配音</li>
      <li><b>优先出片</b>：高峰期渲染队列排在免费任务前面</li>
    </ul>
    <button class="btn">加微信，开通高级版</button>
    <div class="voices">
      <div class="vlabel">配音音色 · 沉稳播报</div>
      <div class="chips">
        <span class="chip on">云扬</span><span class="chip">云健</span>
        <span class="chip">云希</span><span class="chip">我的声音</span>
      </div>
    </div>
  </div>
  <p class="foot">付款由创始人<b>一对一</b>对接，转账后 5 分钟内发卡密</p>
</div>
</body>
</html>
