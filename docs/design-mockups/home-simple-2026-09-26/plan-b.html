<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 B · 居中大留白（首屏只有一个动作）</title>
<style>
:root{
  --bg:#0e0e11; --surface:#17171b; --surface2:#1c1c21; --sunken:#121216;
  --ink:#f4f4f6; --ink-2:#b6b6c0; --ink-3:#85858d;
  --line:#232329; --line2:#2e2e36;
  --acc:#d8b36a; --acc-ink:#1c1508; --acc-soft:rgba(216,179,106,.12);
  --btn-bg:#f4f4f6; --btn-ink:#101014;
  --ok:#5fa97a; --media:#0a0a0d;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:0 22px;height:58px;flex:none;
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .wm{font-size:17px;font-weight:800;letter-spacing:.02em}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--line2);color:var(--ink-2);font-size:13px;font-weight:600}
.me{display:flex;align-items:center;gap:8px}
.avatar{width:24px;height:24px;border-radius:50%;background:#2a2320;border:1.5px solid var(--acc);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.me b{font-size:13.5px;font-weight:650}
.tier{font-size:10.5px;font-weight:700;color:var(--acc);border:1px solid rgba(216,179,106,.45);
  border-radius:5px;padding:1px 7px}

/* 首屏（未导入）＝一柱居中：一句话 + 一个拖放区 + 一行状态 */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:20px 40px 14px}
.hero h1{font-size:31px;font-weight:800;line-height:1.4;letter-spacing:.015em;text-align:center}
.hero h1 .hl{background:linear-gradient(transparent 70%,rgba(216,179,106,.30) 0)}
.drop{width:min(640px,100%);border:1.5px dashed rgba(255,255,255,.18);border-radius:18px;
  padding:48px 44px 42px;display:flex;flex-direction:column;align-items:center;gap:9px;
  background:rgba(255,255,255,.015);text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--acc);background:rgba(216,179,106,.04)}
.drop .t{font-size:20px;font-weight:800;margin-top:2px}
.pick{margin-top:14px;padding:14px 34px;border-radius:11px;background:var(--btn-bg);color:var(--btn-ink);
  font-size:16.5px;font-weight:800;letter-spacing:.02em;display:inline-flex;align-items:center;
  box-shadow:0 12px 32px rgba(0,0,0,.35)}
.drop .s{font-size:13.5px;color:var(--ink-3);margin-top:10px;line-height:1.8}
.drop .s a{color:var(--acc)}
.envline{flex:none;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 0 22px;
  font-size:12.5px;color:var(--ink-3)}
.envline .ok{color:#7fcb96;font-weight:700;font-size:12.5px}
.envline button{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32"><path d="M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z" fill="var(--acc)"/><path d="M10.5 8.6 23.6 15.6 10.5 22.6Z" fill="var(--acc-ink)"/></svg>
      <span class="wm">GetCut</span>
    </div>
    <div class="top-right">
      <a class="chip" href="#">作品库</a>
      <span class="me"><span class="avatar">🦊</span><b>创作者2997</b><span class="tier">高级版</span></span>
    </div>
  </header>

  <main class="hero">
    <h1>拖入素材包，<span class="hl">一条好片子</span>在你这台电脑上完成。</h1>
    <div class="drop">
      <svg width="48" height="48" viewBox="0 0 32 32"><path d="M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z" fill="var(--acc)"/><path d="M10.5 8.6 23.6 15.6 10.5 22.6Z" fill="var(--acc-ink)"/></svg>
      <div class="t">素材包拖到这里</div>
      <button class="pick">选择素材包 zip</button>
      <div class="s">zip 不解压，文案与素材一起读入 · 还没有素材包？<a href="#">下载一条现成的</a></div>
    </div>
  </main>

  <div class="envline">
    <span class="ok">✓ 这台电脑可以正常出片</span>
    <button>重新检查</button>
  </div>
</div>
</body>
</html>
