# 渲染工人节点（小机器，如 4核4G）：只跑「Remotion 出画面」这一步。
#
# 与主站同一个镜像（代码目录走 bind-mount，镜像提供 node_modules/Chrome/ffmpeg/字体）：
#   镜像从主站传：  ssh 主站 'docker save videogen:latest | gzip' | gunzip | docker load
#   代码从本机同步： videogen/ 包 + renderer/src （与主站 code/ 目录同构）
#   启动：          docker compose -f docker-compose.node.yml up -d
#
# 安全：RENDERNODE_TOKEN 必填（.env），端口用 host 网络暴露 9700，
# 防火墙只放行主站 IP（见 _node_setup.sh 的 iptables 规则）。
services:
  rendernode:
    image: videogen:latest
    container_name: rendernode
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "9700"
      RENDERNODE_TOKEN: "${RENDERNODE_TOKEN:?RENDERNODE_TOKEN 必填}"
      # 节点渲染路数：4核4G 实测 2 路稳；每路 Chrome 并发由 VIDEOGEN_CONCURRENCY 推出（4核2路=各2）
      RENDERNODE_CONCURRENCY: "${RENDERNODE_CONCURRENCY:-2}"
      VIDEOGEN_CONCURRENCY: "2"
    volumes:
      - /opt/videogen-node/code/videogen:/app/videogen
      - /opt/videogen-node/code/renderer/src:/app/renderer/src
    command: ["python", "-m", "videogen.rendernode"]
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9700/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
