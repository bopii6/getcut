# 本地 / 云主机一键运行：docker compose up -d --build
# 密钥放同目录 .env（从 .env.example 复制后填写，切勿提交）
services:
  videogen:
    build: .
    image: videogen:latest
    container_name: videogen
    restart: unless-stopped
    ports:
      - "8600:8600"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8600"
      VIDEOGEN_WORKSPACE: /data
      # 出片通道路数：画面渲染不在服务器（在客户自己的浏览器里），一路占的是
      # 一个等成片台交片的线程 + 几十秒 ffmpeg 的轻活，不再按"每几核开一路"算。
      # 默认 2 是过去 CPU 时代留下的，放开多少取决于主机内存与磁盘，先按老值跑。
      VIDEOGEN_CONCURRENCY: "${VIDEOGEN_CONCURRENCY:-2}"
      VIDEOGEN_PREP_CONCURRENCY: "${VIDEOGEN_PREP_CONCURRENCY:-2}"
    volumes:
      - videogen-data:/data
      - videogen-outputs:/app/outputs

volumes:
  videogen-data:
  videogen-outputs:
