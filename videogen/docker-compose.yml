# 本地 / 云主机一键运行：docker compose up -d --build
# 密钥放同目录 .env（从 .env.example 复制后填写，切勿提交）
services:
  videogen:
    build: .
    image: videogen:latest
    container_name: videogen
    restart: unless-stopped
    ports:
      # 只绑回环：这台机上 Caddy 在同一进程外做反代（reverse_proxy 127.0.0.1:8600），
      # 应用端口没有理由对外开。绑 0.0.0.0 等于在公网多开一个没过反代的入口 ——
      # 没有 TLS、没有 Caddy 的限流与转发头，绕过它就能直接打到应用。
      - "127.0.0.1:8600:8600"
    # 日志轮转：应用把日志写 stdout（logx），归 docker 管。不加这段时 json-file
    # 驱动无限增长 —— 长期跑的机器上 docker.json.log 会长到几十 GB 把系统盘吃满，
    # 而且"日志盘满"的表现是整个容器起不来，不是"日志没了"，很难第一时间联想到。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8600"
      VIDEOGEN_WORKSPACE: /data
      # 出片通道路数：画面渲染不在服务器（在客户自己的浏览器里），一路占的是
      # 一个等成片台交片的线程 + 几十秒 ffmpeg 的轻活，不再按"每几核开一路"算。
      # 默认 2 是过去 CPU 时代留下的，放开多少取决于主机内存与磁盘，先按老值跑。
      VIDEOGEN_CONCURRENCY: "${VIDEOGEN_CONCURRENCY:-2}"
      VIDEOGEN_PREP_CONCURRENCY: "${VIDEOGEN_PREP_CONCURRENCY:-2}"
    volumes:
      - videogen-data:/data
      - videogen-outputs:/app/outputs

volumes:
  videogen-data:
  videogen-outputs:
