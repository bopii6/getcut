<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><title>GetCut 工作台</title>
<style>
body{margin:0;display:flex;height:100vh;background:#111;color:#eee;font-family:system-ui,sans-serif}
#L{flex:1;padding:24px;overflow:auto;display:flex;flex-direction:column;gap:14px}
#R{height:100vh;width:calc(100vh*9/16);background:#000;display:flex;align-items:center;justify-content:center;position:relative}
button{all:unset;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;padding:14px 26px;border-radius:12px;font:700 17px system-ui}
select,input[type=file]{background:#222;color:#eee;border:1px solid #444;padding:10px;border-radius:8px;font-size:14px;max-width:100%}
.step{display:flex;gap:10px;align-items:center;font-size:15px;opacity:.85}
.step.on{opacity:1;color:#ffd76a;font-weight:700}
.step.ok{opacity:1;color:#7de08a}
.bar{height:10px;background:#333;border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,#7c3aed,#db2777)}
#msg{font-size:15px;line-height:1.7;opacity:.9}
a.dl{background:#1db954;color:#fff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:700}
h3{margin:0 0 4px}
</style></head><body>
<div id="L">
  <h3>① 选择素材包</h3>
  <select id="bundle" style="padding:10px"></select>
  <h3>② 上传新压缩包（可选）</h3>
  <input type="file" id="zip" accept=".zip">
  <div id="upmsg" style="font-size:13px;opacity:.6"></div>
  <button id="gen" style="align-self:flex-start">③ 生成视频</button>
  <div id="st" style="font-size:15px;opacity:.8"></div>
  <div id="steps"></div>
  <div id="dn"></div>
  <div style="font-size:12px;opacity:.45;margin-top:auto">渲染在你的浏览器完成 · 请勿切换标签页</div>
</div>
<div id="R"><div style="opacity:.4">渲染结果将显示在这里</div></div>
<script>
const $=id=>document.getElementById(id);
const NAMES=[['prep','写稿 · 配音 · 备料'],['render','渲染画面（你的电脑）'],['audio','混音封装'],['done','完成']];
let job=null;
async function jget(u){return (await fetch(u,{credentials:'same-origin'})).json()}
async function boot(){
  const bs=await jget('/api/bundles');
  const s=$('bundle'); s.innerHTML=bs.map(b=>`<option>${b.name}</option>`).join('');
}
$('gen').onclick=async()=>{
  $('gen').disabled=true;
  const d=await jget('/api/projects/create',{title:($('bundle').value)+' 项目',bundle:$('bundle').value});
  const b=await fetch('/api/build',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({bundle:$('bundle').value,project_id:d.project_id,sfx:true,subtitles:true,sources:true})});
  const r=await b.json(); job=r.job; watch();
};
let last='';
function drawSteps(j){
  const order=[['tts','写稿 · 配音'],['props','素材 · 分镜'],['render','渲染画面（你的电脑）'],['audio','混音封装'],['done','完成']];
  const cur=j.stage, idx=order.findIndex(o=>o[0]===cur||cur==='done'&&o[0]==='done');
  $('steps').innerHTML=order.map((o,i)=>{
    const cls= i<idx?'step ok': i===idx?'step on':'step';
    return `<div class="${cls}">${i<idx?'✓':i===idx?'▶'} ${o[1]}</div>`;
  }).join('');
  $('st').textContent=`第 ${idx+1}/5 步 · ${j.progress}% · 已用 ${Math.round((Date.now()/1000-j.t0))}s`;
}
async function watch(){
  for(;;){
    const j=await jget('/api/job/'+job);
    drawSteps(j);
    const waiting = j.stage==='render' && /等待渲染台/.test(j.detail||'');
    if(waiting && !$('go')){
      const b=document.createElement('button'); b.id='go';
      b.textContent='▶ 开始渲染（用这台电脑，约'+Math.round((j.duration||200)/60)+'分钟）';
      b.onclick=()=>iframeGo(); $('steps').before(b);
    }
    if(j.stage==='done'){ $('dn').innerHTML=`<a class="dl" href="/video/${job}" download>⬇ 下载成片</a> <video src="/video/${job}" controls style="width:100%;margin-top:10px"></video>`; return; }
    if(j.stage==='failed'){ $('dn').innerHTML='<b style="color:#f66">失败：'+(j.error||'').slice(0,120)+'</b>'; return; }
    await new Promise(r=>setTimeout(r,3000));
  }
}
function iframeGo(){
  const f=document.createElement('iframe');
  f.src='/poc/?agent=1&device='+encodeURIComponent('网页浏览器');
  f.style.cssText='width:100%;height:70vh;border:1px solid #333;border-radius:10px;background:#111';
  $('R').innerHTML=''; $('R').appendChild(f);
  $('R').style.width='calc(100vh*9/16)';
}
boot();
</script></body></html>
