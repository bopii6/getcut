<!DOCTYPE html>
<!--
  videogen 工作台 · 深色工作台（对齐原版 niwo.studio 设计语言）
  设计立场：
    · 近黑底 #0B0D0B + 极淡点阵网格；一个荧光绿 #C7F464 强调色（选中 / CTA / 进度）
    · 左侧悬浮图标栏 + 顶栏中央项目切换胶囊 + 制作间 01→04 步骤条，均同原版
    · 模板选择器用 Remotion 真实渲染静帧（/templates/），CSS 小样兜底
    · 媒体坐黑色幕布底座；等宽字体标文件名/元数据
  字：数字/字母用思源黑体 Heavy 子集（36KB 自托管 woff2），正文系统黑体
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0D0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141714'/%3E%3Ctext x='30' y='44' font-family='sans-serif' font-size='34' font-weight='900' fill='%23C7F464' text-anchor='middle'%3EV%3C/text%3E%3Ccircle cx='49' cy='16' r='6' fill='%23C7F464'/%3E%3C/svg%3E">>
<title>videogen · 工作台</title>
<style>
@font-face{
  font-family:"Display";
  src:url("/fonts/display-subset.woff2") format("woff2");
  font-weight:900;font-display:swap;
}
:root{
  --bg:#0B0D0B; --surface:#141714; --surface2:#191D19; --sunken:#1C211C;
  --ink:#F1F4EE; --ink-2:#A6AFA3; --ink-3:#68706A;
  --line:#242923; --line2:#30362F;
  --acc:#C7F464; --acc-ink:#1A2405; --acc-soft:rgba(199,244,100,.10);
  --ok:#5BD08A; --ok-soft:rgba(91,208,138,.12);
  --err:#FF6B6B; --err-soft:rgba(255,107,107,.10);
  --media:#0A0C0A;
  --r-s:7px; --r-m:11px; --r-l:16px;
  --sh-1:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --sh-2:0 4px 14px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.5);
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  --ease:cubic-bezier(.25,.6,.3,1);
}
*{box-sizing:border-box;margin:0}
::selection{background:var(--acc);color:#fff}
html{scroll-behavior:smooth}
body{color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
             var(--bg);
  background-size:22px 22px,auto;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img,video{display:block}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.display{font-family:"Display",var(--sans);font-weight:900;letter-spacing:-.01em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ── 壳：左侧导航 + 主区 ── */
.shell{display:flex;min-height:100vh}
.side{width:76px;flex:none;margin:14px 0 14px 14px;border-radius:22px;
  background:rgba(20,23,20,.88);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:16px 0 18px;
  position:sticky;top:14px;height:calc(100vh - 28px);backdrop-filter:blur(8px)}
.side .brand{display:flex;align-items:center;padding:0 0 22px}
.side .mark{width:38px;height:38px;flex:none;border-radius:12px;background:var(--acc);color:var(--acc-ink);
  display:grid;place-items:center;font-family:"Display",var(--sans);font-size:19px;position:relative}


.nav{display:flex;flex-direction:column;gap:8px}
.nav a .lb{display:none}
.nav a{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;color:var(--ink-2);transition:background .15s,color .15s}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--acc);color:var(--acc-ink)}
.side .sp{flex:1}
.side .sfoot{display:none}
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(11,13,11,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;height:58px;padding:0 28px;
  display:flex;align-items:center;gap:16px}
.top h1{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top h1 b{font-family:"Display",var(--sans);font-weight:900;margin-right:2px}
.switcher{display:flex;align-items:center;gap:12px;margin:0 auto;padding:7px 8px 7px 16px;
  border-radius:999px;background:var(--surface);border:1px solid var(--line2);font-size:13px;
  max-width:520px;min-width:0}
.switcher .sw-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switcher .sw-t b{font-weight:700}
.switcher .sw-t small{display:block;color:var(--ink-3);font-size:11px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switcher a,.switcher button{color:var(--acc);font-weight:700;font-size:12.5px;flex:none;
  padding:6px 12px;border-radius:999px;white-space:nowrap}
.switcher a:hover,.switcher button:hover{background:var(--acc-soft)}
.switcher .sw-new{background:var(--acc);color:var(--acc-ink)}
.switcher .sw-new:hover{background:#D6FA7E}
.top .sp{flex:1}
.tact{display:flex;align-items:center;gap:10px}
.tact .who{font-size:13px;color:var(--ink-2);max-width:220px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

.mainwrap{max-width:1240px;margin:0 auto;width:100%;padding:24px 28px 96px}
.steps4{display:flex;align-items:center;gap:12px;margin:2px 0 20px}
.steps4 .st{display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:13.5px;
  font-weight:600;white-space:nowrap}
.steps4 .st i{font-style:normal;font-family:"Display",var(--sans);width:27px;height:27px;
  border-radius:50%;display:grid;place-items:center;font-size:12.5px;
  border:1px solid var(--line2);color:var(--ink-3)}
.steps4 .st.on{color:var(--ink)}
.steps4 .st.on i{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.steps4 .st.done{color:var(--ink-2)}
.steps4 .st.done i{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.steps4 em{flex:1;height:1px;background:var(--line2)}
.view{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── 按钮 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  border-radius:11px;min-height:44px;padding:0 22px;font-size:14.5px;font-weight:700;
  background:var(--acc);color:var(--acc-ink);box-shadow:0 4px 16px rgba(199,244,100,.18);
  transition:filter .2s,transform .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 6px 22px rgba(199,244,100,.26)}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--sunken);color:var(--ink-3);box-shadow:none;cursor:default}
.btn[disabled] .spin{border-color:rgba(255,255,255,.2);border-top-color:var(--ink-2)}
.btn.go{min-height:50px;font-size:15.5px;border-radius:12px;box-shadow:0 6px 22px rgba(199,244,100,.22)}
.btn.go:hover{box-shadow:0 10px 30px rgba(199,244,100,.32)}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.line:hover{background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:9px}
.ghost{color:var(--ink-2);font-size:14px;font-weight:600;border-radius:8px;
  padding:8px 12px;transition:background .2s,color .2s}
.ghost:hover{background:var(--sunken);color:var(--ink)}
.ghost.danger:hover{background:var(--err-soft);color:var(--err)}

/* ── 通用 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sec-h .n{color:var(--ink-3);font-size:12.5px}
.sub-h{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 0 8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.run{background:var(--acc-soft);color:var(--acc)}
.tag.err{background:var(--err-soft);color:var(--err)}

/* ── 首页 · 开放式刊头（不是盒子里的 hero） ── */
.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  flex-wrap:wrap;padding:26px 28px;margin:6px 0 18px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line)}
.homehead h2{font-size:31px;font-weight:900;letter-spacing:-.02em;line-height:1.12}
.homehead .hh-sub{color:var(--ink-2);font-size:13.5px;margin-top:7px}
.homehead .hh-sub b{color:var(--ink);font-weight:800}
.homehead .hh-r{display:flex;gap:10px}

.import{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;text-align:left;
  border-radius:var(--r-m);background:var(--surface);border:1.5px dashed var(--line2);cursor:pointer;
  transition:border-color .2s,background .2s}
.import:hover,.import.over{border-color:var(--acc);background:var(--acc-soft)}
.import .ico{width:38px;height:38px;flex:none;border-radius:10px;background:var(--sunken);
  display:grid;place-items:center;color:var(--ink-2)}
.import b{display:block;font-size:14px}
.import span{color:var(--ink-2);font-size:12.5px}
.import .pick{margin-left:auto}

.rail-sec{margin-top:32px}
.posters{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.posters::-webkit-scrollbar{height:8px}
.poster{flex:none;width:186px;scroll-snap-align:start;text-align:left;position:relative;
  animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.poster .frame{position:relative;display:block;background:var(--media);border-radius:14px;padding:6px;
  box-shadow:var(--sh-1);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.poster:hover .frame{transform:translateY(-4px);box-shadow:var(--sh-2)}
.poster video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:9px;background:#000}
.poster .pdur{position:absolute;right:13px;bottom:13px;background:rgba(0,0,0,.72);color:#fff;
  font-family:"Display",var(--sans);font-size:10.5px;padding:1px 7px;border-radius:6px;font-weight:700;z-index:2}
.poster .t{display:block;font-size:12.5px;font-weight:700;margin-top:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .d{display:block;color:var(--ink-3);font-size:11px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:30px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:700;
  color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface);
  transition:all .15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:18px;margin-top:14px}
.pcard{position:relative;text-align:left;border-radius:var(--r-m);overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.pcard .cover{aspect-ratio:3/4;background:var(--media);position:relative;overflow:hidden;cursor:pointer}
.pcard .cover img,.pcard .cover video{width:100%;height:100%;object-fit:cover}
.pcard .cover .letter{position:absolute;inset:0;display:grid;place-items:center;
  color:rgba(247,246,243,.5);font-family:"Display",var(--sans);font-size:44px}
.pcard .cover .cnt{position:absolute;left:10px;top:10px;z-index:3}
.pcard .cover .shade{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(7,9,13,0) 48%,rgba(7,9,13,.78))}
.pcard .cover .ct{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;color:#fff;
  font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 8px rgba(0,0,0,.5)}
.pcard .cover .pplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:grid;place-items:center;opacity:0;transition:opacity .2s}
.pcard:hover .cover .pplay{opacity:1}
.pcard .cover .pplay svg{margin-left:3px}
.pcard .body{padding:10px 13px;cursor:pointer}
.pcard .body .m{color:var(--ink-3);font-size:12px}
.pcard .del{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;
  background:rgba(7,9,13,.6);color:#fff;display:grid;place-items:center;
  opacity:0;transition:opacity .2s,background .2s;backdrop-filter:blur(4px);z-index:4}
.pcard:hover .del{opacity:1}
.pcard .del:hover{background:var(--err)}

/* 首次来访的引导卡（空态不稀疏） */
.firstcard{padding:40px 32px;text-align:center}
.firstcard .fc-art{display:flex;justify-content:center;gap:10px;margin-bottom:20px}
.firstcard .fc-art i{width:52px;border-radius:8px;background:var(--media);position:relative;
  box-shadow:var(--sh-1)}
.firstcard .fc-art i:nth-child(1){height:88px;transform:rotate(-5deg) translateY(6px)}
.firstcard .fc-art i:nth-child(2){height:100px}
.firstcard .fc-art i:nth-child(3){height:88px;transform:rotate(5deg) translateY(6px)}
.firstcard .fc-art i::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:0;height:0;border-left:7px solid rgba(247,246,243,.85);
  border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.firstcard b{display:block;font-size:17px;margin-bottom:6px}
.firstcard .fc-sub{color:var(--ink-2);font-size:13.5px}
.firstcard ol{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:22px 0 4px;text-align:left}
.firstcard ol li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);
  max-width:200px;line-height:1.6}
.firstcard ol li i{font-style:normal;font-family:"Display",var(--sans);flex:none;width:22px;height:22px;
  border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:12px;display:grid;place-items:center;margin-top:1px}
.firstcard ol li b{display:block;font-size:13.5px;color:var(--ink);margin:0}

/* ── 项目页（制作间） ── */
.pj{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.crumb h1{font-size:21px;font-weight:900;letter-spacing:-.01em;max-width:24em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colmain{min-width:0;display:flex;flex-direction:column;gap:18px}
.stage-card{padding:18px}
.player-row{display:flex;gap:22px;align-items:flex-start}
.media-frame{background:var(--media);border-radius:18px;padding:8px;flex:none;box-shadow:var(--sh-2)}
.media-frame video{width:376px;max-width:100%;aspect-ratio:9/16;border-radius:10px;background:#000}

/* 待放映的暗幕（空态有设计，不是死黑块） */
.theater{width:390px;max-width:100%;aspect-ratio:9/16;flex:none;border-radius:14px;
  background:var(--media);position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--ink-3);padding:24px;gap:9px}
.theater::before{content:"";position:absolute;inset:0;
  background:radial-gradient(85% 55% at 50% 28%,rgba(199,244,100,.09),transparent 72%)}
.theater::after{content:"";position:absolute;inset:10px;border:1px dashed rgba(199,244,100,.20);
  border-radius:9px}
.theater svg{position:relative;opacity:.75;margin-bottom:2px}
.theater b{position:relative;color:var(--ink);font-size:15px}
.theater span{position:relative;font-size:12px;line-height:1.8}

.stage-side{min-width:0;flex:1;display:flex;flex-direction:column;gap:14px}
.stage-side .stats{color:var(--ink-2);font-size:13px;line-height:1.9}
.hist{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hist .h-item{flex:none;width:58px;text-align:center}
.hist .h-item .frame{background:var(--media);border-radius:8px;padding:3px;
  transition:box-shadow .2s}
.hist .h-item.on .frame{box-shadow:0 0 0 2px var(--acc)}
.hist video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px}
.hist .h-item span{font-size:10px;color:var(--ink-3)}
.hookline{padding:20px 22px;display:flex;flex-direction:column;gap:9px}
.hookline .ln{font-size:20px;font-weight:900;line-height:1.55;letter-spacing:-.01em}
.hookline .hl{background:var(--acc);color:var(--acc-ink);padding:1px 8px;border-radius:5px}
.hookline .cap{color:var(--ink-3);font-size:12px;font-weight:700}
.script-box{max-height:240px;overflow:auto;padding:0 20px 16px;font-size:14.5px;
  line-height:1.95;white-space:pre-wrap;color:var(--ink)}
.assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.assetscard .assets-grid{padding:0 20px}
.assets-grid .a{border-radius:9px;overflow:hidden;background:var(--sunken)}
.assets-grid .a.more{aspect-ratio:4/3;display:grid;place-items:center;cursor:pointer;
  font-family:"Display",var(--sans);font-size:15px;color:var(--ink-2);
  background:var(--sunken);box-shadow:inset 0 0 0 1.5px var(--line2);
  transition:color .15s,box-shadow .15s}
.assets-grid .a.more:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--acc)}
.assets-grid img,.assets-grid video{width:100%;aspect-ratio:4/3;object-fit:cover}
.assets-grid .cap{padding:7px 9px;font-size:11.5px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.disc{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
details.disc>summary{cursor:pointer;padding:13px 18px;font-size:14px;font-weight:700;
  list-style:none;display:flex;align-items:center;justify-content:space-between}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary .n{color:var(--ink-3);font-weight:600;font-size:12px}
details.disc .disc-b{padding:0 18px 16px}

/* ── 右栏：编号步骤流 1 素材 → 2 画面 → 3 声音 → 渲染 ── */
.railcol{position:sticky;top:82px;display:flex;flex-direction:column;gap:16px}
.panel{padding:20px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel .ph h3{font-size:15px;font-weight:800}
.step{display:flex;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:10px}
.step-n{font-family:"Display",var(--sans);font-size:13px;width:23px;height:23px;flex:none;
  border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-top:1px}
.step-b{flex:1;min-width:0}
.gh{font-size:13px;font-weight:800;margin-bottom:9px}
.gh .hint{color:var(--ink-3);font-weight:600;font-size:11.5px}

.bundle-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  background:var(--sunken);font-size:13px}
.bundle-chip .b-ico{width:30px;height:30px;flex:none;border-radius:8px;background:var(--surface);
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.bundle-chip .b-name{min-width:0;flex:1}
.bundle-chip .b-name b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bundle-chip .b-name span{color:var(--ink-3);font-size:11.5px}
.bundle-chip button{color:var(--acc);font-weight:700;font-size:12.5px;flex:none;padding:4px 8px;border-radius:6px}
.bundle-chip button:hover{background:var(--acc-soft)}
.bundle-none{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px;border:1.5px dashed var(--line2);border-radius:10px;font-size:13px;color:var(--ink-2)}

/* 模板小样海报（纯 CSS 画出每个模板的样子） */
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;gap:7px;padding:7px 7px 8px;border-radius:11px;text-align:left;
  position:relative;transition:background .15s,box-shadow .15s;border:1px solid transparent;min-width:0}
.tpl:hover{background:var(--sunken)}
.tpl.on{background:var(--acc-soft);border-color:var(--acc)}
.tpl .mock{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:7px;
  overflow:hidden;box-shadow:var(--sh-1)}
.tpl .mock i{position:absolute;display:block}
.tpl .mock .tpl-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tpl b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:11px;line-height:1.35;min-height:30px;text-align:center}
.tpl .tick{position:absolute;right:5px;top:5px;width:17px;height:17px;border-radius:50%;
  background:var(--acc);color:var(--acc-ink);font-size:10.5px;font-weight:900;display:none;
  place-items:center;line-height:1}
.tpl.on .tick{display:grid}
/* 小样内部形状 */
.mk-v{left:7%;top:6%;width:86%;height:32%;border-radius:4px}
.mk-card{left:6%;right:6%;bottom:6%;height:46%;border-radius:5px}
.mk-band{top:47%;left:12%;width:48%;height:10%;border-radius:2px}
.mk-ln{left:12%;width:70%;height:5%;border-radius:2px}
.mk-ln.s{top:71%;width:52%}
.mk-ln.d{top:58%;width:66%}
.mk-grid{inset:0;border-radius:inherit}
.mk-num{top:12%;left:8%;width:56%;height:9%;border-radius:2px}
.mk-num2{top:26%;left:8%;width:40%;height:7%;border-radius:2px;opacity:.6}
.mk-heavy{top:18%;left:10%;width:62%;height:12%;border-radius:2px}
.mk-heavy.s{top:34%;width:44%}
.mk-chip{top:10%;left:10%;width:34%;height:8%;border-radius:2px}
.mk-cap{bottom:10%;left:10%;right:10%;height:6%;border-radius:2px}
.mk-band.b{top:46%;left:0;right:0;width:auto;height:12%;border-radius:0}
.mk-vig{inset:0;border-radius:inherit}
.mk-seal{top:10%;right:10%;width:26%;aspect-ratio:1;border-radius:50%}
.mk-vidfull{inset:0;border-radius:inherit}
.mk-play{left:50%;top:44%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:rgba(247,246,243,.16)}
.mk-play::after{content:"";position:absolute;left:55%;top:50%;transform:translate(-50%,-50%);
  width:0;height:0;border-left:9px solid rgba(247,246,243,.9);
  border-top:5.5px solid transparent;border-bottom:5.5px solid transparent}
.tpls .mk-ln{top:62%}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:34px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface);
  transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.pill .pv{font-style:normal;font-size:9.5px;opacity:.85;border:1px solid currentColor;
  border-radius:999px;padding:0 6px;line-height:1.5}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.field .t{font-size:13.5px;font-weight:600}
.field .d{color:var(--ink-3);font-size:11.5px;margin-top:1px}
.swt{width:42px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:none;
  transition:background .2s}
.swt i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.swt.on{background:var(--acc)}
.swt.on i{left:21px}
select{background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:8px 10px;font-size:13px;color:var(--ink);max-width:190px}
textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:10px 12px;font-size:13px;resize:vertical;min-height:60px;line-height:1.7;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--acc)}
.note-warn{background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.22);color:#FFD57A;
  font-size:12.5px;border-radius:9px;padding:10px 12px;line-height:1.6;margin-bottom:10px}
.render-cta{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:16px;
  border-top:1px solid var(--line)}
.render-cta .est{color:var(--ink-2);font-size:12px;line-height:1.6}
.render-cta .est b{color:var(--ink)}
.render-cta .btn{flex:1;min-height:50px;font-size:15.5px;border-radius:12px}

/* ── 任务卡 ── */
.task .th{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.task .th .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.task.running .th .dot{background:var(--acc);animation:blink 1.4s var(--ease) infinite}
.task.done .th .dot{background:var(--ok)}
.task.failed .th .dot{background:var(--err)}
@keyframes blink{50%{opacity:.25}}
.task .tpct{margin-left:auto;font-family:"Display",var(--sans);font-size:26px;letter-spacing:0}
.task .tpct.idle{font-size:13px;font-family:var(--sans);color:var(--ink-3);font-weight:700}
.task .pbar{height:5px;border-radius:3px;background:var(--sunken);margin:10px 0 8px;overflow:hidden}
.task .pbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--acc);
  box-shadow:0 0 12px rgba(199,244,100,.35);transition:width .5s var(--ease)}
.task .pdetail{font-size:12.5px;color:var(--ink-2);min-height:20px}
.task .pmeta{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11.5px;margin-top:4px}
.stages8{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.stages8 li{font-size:11px;font-weight:600;color:var(--ink-3);padding:3px 8px;border-radius:999px;
  background:var(--sunken)}
.stages8 li.on{background:var(--acc);color:var(--acc-ink)}
.stages8 li.done{background:var(--ok-soft);color:var(--ok)}
.stills{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.stills .shot{aspect-ratio:9/16;border-radius:8px;background:var(--sunken);overflow:hidden;
  display:grid;place-items:center;color:var(--ink-3);font-size:10px;cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--line)}
.stills img{width:100%;height:100%;object-fit:cover;animation:shotin .5s var(--ease)}
@keyframes shotin{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
.task .terr{margin-top:10px;background:var(--err-soft);color:var(--err);border-radius:8px;
  padding:10px 12px;font-size:12.5px;white-space:pre-wrap;max-height:130px;overflow:auto}
.task .tfoot{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink-3);font-size:11.5px}
.task .tfoot code{font-family:var(--mono)}

/* ── 登录 / 注册 ── */
.auth{min-height:calc(100vh - 220px);display:grid;place-items:center;padding:32px 0}
.auth .card{width:min(420px,100%);padding:36px 34px 30px;box-shadow:var(--sh-1)}
.auth .aw{display:flex;justify-content:center;margin-bottom:16px}
.auth .mark{width:48px;height:48px;border-radius:14px;background:var(--acc);color:var(--acc-ink);
  display:grid;place-items:center;font-family:"Display",var(--sans);font-size:24px;position:relative}
.auth .mark::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;
  border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(199,244,100,.15)}
.auth h1{font-size:20px;font-weight:900;text-align:center;letter-spacing:-.01em}
.auth .sub{text-align:center;color:var(--ink-2);font-size:13px;margin:6px 0 22px;line-height:1.7}
.atabs{display:flex;gap:4px;background:var(--sunken);border-radius:10px;padding:4px;margin-bottom:20px}
.atabs button{flex:1;min-height:36px;border-radius:8px;font-size:14px;font-weight:700;
  color:var(--ink-2);transition:background .15s,color .15s,box-shadow .15s}
.atabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.fld input{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:11px 12px;font-size:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.fld input::placeholder{color:var(--ink-3)}
.fld input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fld .d{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.55}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0}
.auth .row2 .btn{flex:none;width:auto;min-height:41px}
.aerr{background:var(--err-soft);color:var(--err);font-size:13px;border-radius:8px;
  padding:9px 12px;margin-bottom:14px;display:none}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);
  margin:2px 0 18px;cursor:pointer}
.remember input{accent-color:var(--acc);width:15px;height:15px}
.auth .btn{width:100%;min-height:46px}
.auth .row2 .btn.sm{width:auto}

/* ── 骨架屏 ── */
.skel{border-radius:12px;background:linear-gradient(90deg,var(--sunken) 25%,#242A24 45%,var(--sunken) 65%);
  background-size:240% 100%;animation:shimmer 1.5s infinite linear}
@keyframes shimmer{to{background-position:-140% 0}}

/* ── 浮层 ── */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);z-index:80;
  background:#1D2333;color:#F3F5FA;padding:11px 20px;font-size:14px;border-radius:10px;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(4,6,4,.62);z-index:70;
  backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;
  width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:var(--sh-2);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.modal .box h3{font-size:17px;font-weight:800}
.modal .box p{font-size:13.5px;color:var(--ink-2);margin:8px 0 16px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal input[type=text],.modal input[type=password]{width:100%;background:var(--surface);
  border:1px solid var(--line2);border-radius:9px;padding:11px 12px;font-size:14px;color:var(--ink)}
.modal input:focus{outline:none;border-color:var(--acc)}
.modal .play{background:var(--media);border-radius:12px;padding:7px;width:min(340px,80vw)}
.modal .play video{width:100%;border-radius:8px;background:#000}
.modal .play .cap{color:var(--ink-3);font-size:12px;padding:8px 3px 1px}
.mlist{max-height:280px;overflow:auto;margin-top:4px}
.mlist button{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;
  padding:11px 10px;border-radius:8px;font-size:13.5px;transition:background .15s}
.mlist button:hover{background:var(--sunken)}
.mlist .m{color:var(--ink-3);font-size:12px;white-space:nowrap}
.spin{width:13px;height:13px;border:2px solid rgba(26,36,5,.3);border-top-color:var(--acc-ink);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:14px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:99}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1020px){
  .side{width:64px;margin:10px 0 10px 10px}
  .nav a{justify-content:center}
  .pj{grid-template-columns:1fr}
  .railcol{position:static}
  .homehead h2{font-size:25px}
}
@media (max-width:640px){
  .mainwrap{padding:18px 14px 96px}
  .top .in{padding:0 14px}
  .player-row{flex-direction:column}
  .media-frame,.theater{align-self:flex-start}
  .theater{width:100%}
  .import .pick{display:none}
  .switcher{display:none}
  .steps4 .st span{display:none}
}
</style>

<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/" id="brand" title="videogen"><span class="mark">V</span></a>
    <nav class="nav">
      <a href="#/" data-nav="home" class="on" title="作品库">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span class="lb">作品库</span></a>
      <a href="#new" id="navNew" title="新建项目">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span class="lb">新建项目</span></a>

        <span class="sp"></span>
        <div class="tact">
          <span id="account" style="display:flex;align-items:center;gap:8px"></span>
          <button class="btn sm hide" id="newBtn">＋ 新建项目</button>
        </div>
      </div>
    </header>
    <main class="mainwrap" id="main" tabindex="-1"></main>
  </div>
</div>

<script>
/* ================= 基础 ================= */
const $ = (id) => document.getElementById(id);
const TOK = () => localStorage.getItem("vg.token") || "";
const qs = (u) => u + (u.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOK());
async function api(u, o) {
  o = o || {};
  o.headers = Object.assign({"x-auth-token": TOK()}, o.headers || {});
  const r = await fetch(u, o);
  let d = null;
  try { d = await r.json(); } catch (e) { d = {}; }
  if (r.status === 401) { const err = new Error("需要访问令牌"); err.auth = true; throw err; }
  if (!r.ok) { const err = new Error((d && d.error) || ("HTTP " + r.status)); err.data = d; throw err; }
  return d;
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss = (s) => { s = Math.max(0, Math.round(s || 0));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const num = (n) => { const v = Number(String(n == null ? 0 : n).replace(/,/g, ""));
  return isFinite(v) ? v.toLocaleString("en-US") : "0"; };
const vid = (id) => qs("/video/" + encodeURIComponent(id));
const mediaUrl = (bundle, file) =>
  qs("/media/" + encodeURIComponent(bundle) + "/" + file.split("/").map(encodeURIComponent).join("/"));

let CUR = null;                                    // 当前项目
let CURB = null;                                   // 当前项目的素材包详情
let CFG = null;                                    // 渲染配置（跨项目记忆）
const CFG_DEF = { voice:"zh-CN-YunxiNeural", rate:100, bgm:"", sfxMode:"hook",
                  subtitles:true, sources:true, format:"editorial" };
function loadCfg(){ try { CFG = Object.assign({}, CFG_DEF, JSON.parse(localStorage.getItem("vg.cfg") || "{}")); }
  catch (e) { CFG = Object.assign({}, CFG_DEF); } }
function saveCfg(){ localStorage.setItem("vg.cfg", JSON.stringify(CFG)); }
loadCfg();

/* 模板缩略与说明（模板清单以 /api/templates 为准） */
const TPL_VIS = {
  editorial:{bg:"#1c1a18", paper:"#e4e2e0", acc:"#a44231", hint:"纸卡 + 标题带 + 信息卡，信息量最足"},
  finance:  {bg:"#0b1622", paper:"#12202f", acc:"#2ea8d8", hint:"深蓝终端感 + 网格，适合行情、财报"},
  minimal:  {bg:"#f1f1ef", paper:"#ffffff", acc:"#111111", hint:"纯白极简大字，留白多"},
  bleed:    {bg:"#000000", paper:"#111111", acc:"#f0b429", hint:"素材铺满全屏，沉浸感强"},
  news:     {bg:"#07101f", paper:"#eef2f7", acc:"#c8102e", hint:"深蓝正红 + 信息条，适合时政、突发"},
  retro:    {bg:"#2a231a", paper:"#ece0c9", acc:"#b3542e", hint:"米黄纸 + 颗粒暗角，适合人物、历史"},
  portrait: {bg:"#000000", paper:"#1a1817", acc:"#a44231", hint:"9:16 满屏，素材直接铺满"},
};
/* 真实缩略图：Remotion 对每个模板渲染的静帧（server /templates/ 路由），CSS 小样作兜底 */
const TPL_IMG = (id) => "/templates/tpl-" + id + ".png";
/* 每个模板画一张 CSS 小样海报，选模板时一眼看懂长相 */
function tplMock(id, v){
  const ink = (a) => `rgba(26,23,18,${a})`;
  const pap = (a) => `rgba(247,246,243,${a})`;
  switch(id){
    case "editorial": return `
      <i class="mk-v" style="background:${pap(.12)}"></i>
      <i class="mk-card" style="background:${v.paper}"></i>
      <i class="mk-band" style="background:${v.acc}"></i>
      <i class="mk-ln" style="background:${ink(.35)}"></i>
      <i class="mk-ln s" style="background:${ink(.2)}"></i>`;
    case "finance": return `
      <i class="mk-grid" style="background-image:linear-gradient(${v.acc}2e 1px,transparent 1px),linear-gradient(90deg,${v.acc}2e 1px,transparent 1px);background-size:22% 14%"></i>
      <i class="mk-num" style="background:${v.acc}"></i>
      <i class="mk-num2" style="background:${pap(.5)}"></i>
      <i class="mk-ln" style="background:${pap(.4)}"></i>`;
    case "minimal": return `
      <i class="mk-heavy" style="background:${v.acc}"></i>
      <i class="mk-heavy s" style="background:${v.acc}"></i>
      <i class="mk-ln" style="background:${ink(.16)};top:56%;left:10%;width:58%;height:4%"></i>`;
    case "bleed": return `
      <i class="mk-vidfull" style="background:linear-gradient(160deg,${pap(.15)},${pap(.04)})"></i>
      <i class="mk-chip" style="background:${v.acc}"></i>
      <i class="mk-cap" style="background:${pap(.55)}"></i>`;
    case "news": return `
      <i class="mk-v" style="background:${pap(.13)};height:30%"></i>
      <i class="mk-band b" style="background:${v.acc}"></i>
      <i class="mk-ln" style="background:${pap(.45)};top:64%"></i>
      <i class="mk-ln s" style="background:${pap(.25)};left:8%"></i>`;
    case "retro": return `
      <i class="mk-vig" style="background:radial-gradient(120% 90% at 50% 35%,transparent 52%,${ink(.4)})"></i>
      <i class="mk-seal" style="background:${v.acc}"></i>
      <i class="mk-ln d" style="background:${ink(.55)}"></i>
      <i class="mk-ln s" style="background:${ink(.3)};left:10%"></i>`;
    case "portrait": return `
      <i class="mk-vidfull" style="background:linear-gradient(200deg,${pap(.17)},${pap(.03)})"></i>
      <i class="mk-play"></i>
      <i class="mk-ln" style="background:${pap(.35)};left:22%;width:56%;bottom:8%;top:auto"></i>`;

function renderEstimate(sec){
  const base = Math.max(.5, (sec||0)/60*4.4 + 1.2);
  const lo = Math.max(1, Math.round(base*.9)), hi = Math.round(base*1.25);
  return lo === hi ? "约 " + lo + " 分钟" : lo + "–" + hi + " 分钟";
}
function frameAt(v, t){
  if (!v) return;
  const seek = () => { try { if (v.currentTime < t) v.currentTime = t; } catch (e) {} };
  if (v.readyState >= 1) seek();
  else v.addEventListener("loadedmetadata", seek, {once:true});
}
/* 预览取帧：先快速落到 fallback，元数据就绪后再跳到正片 35% 处，避开片头黑场 */
function previewSeek(v, fallback){
  if (!v) return;
  frameAt(v, fallback);
  v.addEventListener("loadedmetadata", () => {
    frameAt(v, isFinite(v.duration) && v.duration > 4 ? v.duration * .35 : fallback);
  }, {once:true});
}
function kickPlay(v){
  if (!v) return;
  v.muted = true;
  const go = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
  go();
  v.addEventListener("canplay", go, {once:true});
  setTimeout(go, 800);
}

  input.onchange = (e) => onFile(e.target.files[0]);
  drop.onclick = () => input.click();
  drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); input.click(); } };
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) onFile(f);
  });
}
async function heroStart(file){
  if (!file) return;
  try {
    const r = await api("/api/projects/create", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:"{}"});
    if (!r || !r.project_id) return toast("创建失败");
    CUR = {project_id:r.project_id, title:file.name.replace(/\.zip$/i,""), bundle:null, renders:[]};
    const up = await uploadZip(file);
    CUR.bundle = up.name; CUR.title = up.name;
    await api(`/api/projects/${CUR.project_id}/mount`, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({bundle:up.name, title:up.name})});
    toast("已导入");
    setHash("#/project/" + CUR.project_id);
    renderProject();
  } catch (e) { if (e.auth) showAuth(); else toast("导入失败：" + e.message); }
}
async function uploadZip(file){
  toast("正在上传并解析…");

  return api("/api/upload", {method:"POST", body:fd});
}

  if (!b) { $("est2").textContent = "—"; $("render2").textContent = "—"; return; }
  const est = Math.round(b.estSeconds / (CFG.rate/100));
  $("estTxt").textContent = "成片约 " + mmss(est);
  $("est2").textContent = mmss(est);
  $("render2").textContent = renderEstimate(est);
}

/* —— 任务卡 —— */
function taskEl(){ return $("taskCard"); }
function enableRenderBtn(){
  const g = $("go"); if (!g) return;
  g.disabled = false; g.textContent = "开始渲染";
}
function paintTaskIdle(){
  const t = taskEl(); if (!t) return;
  t.className = "card panel task";
  t.innerHTML = `<div class="th"><span class="dot"></span>渲染器<span class="tpct idle">待机</span></div>
    <div class="pdetail" style="margin-top:8px">还没有在跑的任务。点上面的「开始渲染」开工，进度和剧照会出现在这里。</div>`;
  enableRenderBtn();
}
function paintTaskRunning(){
  const t = taskEl(); if (!t) return;
  t.className = "card panel task running";
  t.innerHTML = `<div class="th"><span class="dot"></span><span id="tstage">正在制作</span>
      <span class="tpct" id="tpct">0%</span></div>
    <div class="pbar"><i id="tbar"></i></div>
    <div class="pdetail" id="tdetail">连接中…</div>
    <div class="pmeta"><span id="teta"></span><span id="tstep"></span></div>
    <ul class="stages8" id="tstages">${STAGE8.map(s => `<li>${s}</li>`).join("")}</ul>
    <div class="stills" id="tstills">
      ${[1,2,3,4].map(() => `<div class="shot">取景中</div>`).join("")}
    </div>
    <div class="terr hide" id="terr"></div>
    <div class="tfoot"><span>任务</span><code id="taskId">—</code>
      <button class="ghost" id="copyId" style="margin-left:auto;padding:2px 8px">复制</button></div>`;
  const g = $("go");
  if (g){ g.disabled = true; g.innerHTML = `<span class="spin"></span>制作中`; }
  $("copyId").onclick = () => {
    const txt = $("taskId").textContent;
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(() => toast("已复制"), () => toast("复制失败"));
    else toast("当前环境不支持复制");
  };
}
function paintStills(stills){
  const strip = $("tstills"); if (!strip || !stills) return;
  const have = strip.querySelectorAll("img").length;
  if (stills.length <= have) return;
  stills.forEach((url, i) => {
    if (i < have) return;
    const cell = strip.children[i] || strip.appendChild(document.createElement("div"));
    cell.className = "shot";
    cell.innerHTML = `<img src="${qs(url)}" alt="分镜剧照 ${i+1}">`;
    cell.onclick = () => window.open(qs(url), "_blank");
  });
}
function markStages(idx){
  const lis = $("tstages"); if (!lis) return;
  [...lis.children].forEach((li, i) => {
    li.className = i + 1 < idx ? "done" : (i + 1 === idx ? "on" : "");
  });
}
function wireRenderPane(b){
  $("go").onclick = () => startRender(CURB);
  const again = $("againBtn");
  if (again) again.onclick = () => startRender(CURB);
  // 恢复未完成的任务
  const saved = localStorage.getItem("vg.job." + CUR.project_id);
  if (saved){ job = lastJob = saved; paintTaskRunning(); startPoll(); }
}
async function startRender(b){
  if (!CUR.bundle){ toast("先在第 1 步选一个素材包"); return openBundleModal(); }
  const btn = $("go");
  if (btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span>启动中`; }
  try {
    const r = await api("/api/build", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({project_id: CUR.project_id, bundle: CUR.bundle,
        voice: CFG.voice, rate: String(CFG.rate), bgm: CFG.bgm,
        sfx: CFG.sfxMode !== "off", sfxMode: CFG.sfxMode,
        subtitles: CFG.subtitles !== false, sources: CFG.sources !== false,
        format: CFG.format,
        disclaimer: (($("disclaimer") || {}).value || "").trim() || undefined, useLlm: true})});
    if (!r || !r.job) throw new Error((r && r.error) || "启动失败");
    job = lastJob = r.job;
    localStorage.setItem("vg.job." + CUR.project_id, job);
    paintTaskRunning();
    startPoll();
  } catch (e) {
    if (e.auth) return showAuth();
    if (btn){ btn.disabled = false; btn.textContent = "开始渲染"; }
    toast("启动失败：" + e.message);
  }
}
function startPoll(){
  stopPoll();
  JD = newJD();
  JD.lastChange = Date.now();
  pollJob(job);
  timer = setInterval(() => pollJob(job), 1500);
}
async function pollJob(jid){
  let j;
  try { j = await api("/api/job/" + jid); } catch (e) { if (e.auth) showAuth(); return; }
  const t = taskEl(); if (!t) return;
  if (j.stage === "unknown"){
    if (lastJob !== jid) return;
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    try {
      const l = await api("/api/latest");
      if (l && l.video){
        t.className = "card panel task done";
        t.querySelector(".tpct").textContent = "完成";
        t.querySelector("#tdetail").textContent = "服务重启过，已找回最近一次成片。";
        enableRenderBtn();
        refreshStageCard();
      } else paintTaskIdle();
    } catch (e) { paintTaskIdle(); }
    return;
  }
  const idx = Math.min(j.stage8 || 1, 8);
  const pct = Math.max(0, Math.min(100, j.progress || 0));
  const now = Date.now();
  if (pct !== JD.lastPct){ JD.lastPct = pct; JD.lastChange = now; }
  const el = j.elapsed != null ? j.elapsed : Math.round((now - JD.localT0)/1000);
  const firstPoll = JD.firstPoll !== false;
  JD.firstPoll = false;
  if (firstPoll && el > 5) JD.localT0 = now - el*1000;

  $("tpct").textContent = pct + "%";
  $("tbar").style.width = pct + "%";
  $("tstage").textContent = j.stage === "done" ? "全部完成" : STAGE8[idx-1];
  if (j.detail) $("tdetail").textContent = j.detail;
  $("tstep").textContent = j.stage === "done" ? "" : "第 " + idx + " / 8 步";
  $("taskId").textContent = jid;
  markStages(j.stage === "done" ? 9 : idx);
  paintStills(j.stills);

  JD.samples.push({t: now, p: pct});
  JD.samples = JD.samples.filter(s => now - s.t < 90000);
  const s0 = JD.samples[0], sN = JD.samples[JD.samples.length - 1];
  const dt = (sN.t - s0.t)/1000, dp = sN.p - s0.p;
  const rate = dt > 20 ? dp/dt : 0;
  const eta = $("teta");
  if (j.stage === "done") eta.textContent = "";
  else if (pct >= 85 && rate > .02)
    eta.textContent = "已用 " + mmss(el) + " · 还需约 " + mmss(Math.max(5, Math.round((100-pct)/rate)));
  else eta.textContent = "已用 " + mmss(el) + (QUOTE[j.stage] ? " · " + QUOTE[j.stage] : "");
  $("tdetail").textContent = (j.detail || "") + ((now - JD.lastChange)/1000 > 25 && j.stage !== "done"
    ? "（仍在处理中，没有卡住）" : "");
  if (j.stage === "done") $("tdetail").textContent = "成片已经生成，左侧可以直接预览。";

  if (j.stage === "failed"){
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    t.className = "card panel task failed";
    t.querySelector(".tpct").textContent = "失败";
    t.querySelector(".tpct").classList.add("idle");
    $("tstage").textContent = "没有生成成功";
    const er = $("terr");
    er.classList.remove("hide");
    er.textContent = (j.error || "未知错误").slice(0, 400);
    const foot = t.querySelector(".tfoot");
    const retry = document.createElement("button");
    retry.className = "btn sm"; retry.style.marginLeft = "auto";
    retry.textContent = "重试渲染";
    retry.onclick = () => startRender(CURB);
    enableRenderBtn();
    foot.appendChild(retry);
    return;
  }
  if (j.stage === "done"){
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    lastJob = jid;
    t.className = "card panel task done";
    t.querySelector(".tpct").textContent = "完成";
    t.querySelector(".tpct").classList.add("idle");
    $("tstage").textContent = "成片出炉";
    enableRenderBtn();
    refreshStageCard();
  }
}

/* ================= 启动 ================= */
const SKELETON_HOME = `<div class="view">
  <div class="skel" style="height:64px;width:70%;margin:16px 2px 8px"></div>
  <div class="skel" style="height:58px;margin-top:18px"></div>
  <div style="display:flex;gap:16px;margin-top:32px;overflow:hidden">
    ${'<div class="skel" style="flex:none;width:186px;height:330px;border-radius:14px"></div>'.repeat(6)}
  </div>
  <div class="skel" style="height:20px;width:12%;margin-top:32px"></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:18px;margin-top:14px">
    ${'<div class="skel" style="height:310px"></div>'.repeat(5)}
  </div>
</div>`;
async function boot(){
  $("main").innerHTML = SKELETON_HOME;
  try { ME = await api("/api/me"); } catch (e) { ME = null; }
  try { AUTHST = await api("/api/auth/status"); } catch (e) { AUTHST = {smtp:false, dev_email:false}; }
  paintAccount();
  // 开放模式（没账号、没令牌、没邮箱服务）= 本机自用，不拦；其余都要登录/注册
  const gated = AUTHST.locked || AUTHST.smtp || AUTHST.dev_email || AUTHST.token_auth;
  if (!ME && gated) return showAuth();
  $("newBtn").classList.remove("hide");
  await loadTemplates();
  route(true);
}
boot();
