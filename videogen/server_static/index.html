<!DOCTYPE html>
<!--
  GetCut 工作台 · 深色工作台（全站一套色，对齐 design-mockups/refined-flow/DESIGN.md）
  设计立场：
    · 页底 #0D0B14 + 一个金强调色 #CBB88A（选中 / CTA / 进度）；制作间与作品库同一套变量
    · 左侧悬浮图标栏 + 顶栏中央项目切换胶囊 + 制作间 01→04 步骤条
    · 模板选择器用 Remotion 真实渲染静帧（/templates/），CSS 小样兜底
    · 媒体坐黑色幕布底座；等宽字体标文件名/元数据
  字：数字/字母用思源黑体 Heavy 子集（36KB 自托管 woff2），正文系统黑体
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D0B14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z' fill='%23CBB88A'/%3E%3Cpath d='M10.5 8.6 23.6 15.6 10.5 22.6Z' fill='%230D0B14'/%3E%3C/svg%3E">
<title>GetCut · 工作台</title>
<style>
@font-face{
  font-family:"Display";
  src:url("/fonts/display-subset.woff2") format("woff2");
  font-weight:900;font-display:swap;
}
:root{
  --bg:#0E0E11; --surface:#17171B; --surface2:#1C1C21; --sunken:#121216;
  --ink:#F4F4F6; --ink-2:#B6B6C0; --ink-3:#85858D;
  --line:#232329; --line2:#2E2E36;
  --acc:#D8B36A; --acc-ink:#1C1508; --acc-soft:rgba(216,179,106,.12);
  --acc-hi:#EAD3A2; --jade:#8A6F45;
  --btn-bg:#F4F4F6; --btn-ink:#101014;
  --ok:#5FA97A; --ok-soft:rgba(95,169,122,.12);
  --err:#FF6B6B; --err-soft:rgba(255,107,107,.10);
  --media:#0A0A0D;
  --r-s:8px; --r-m:10px; --r-l:14px;
  --sh-1:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --sh-2:0 4px 14px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.5);
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  --ease:cubic-bezier(.25,.6,.3,1);
}
*{box-sizing:border-box;margin:0}
::selection{background:var(--acc);color:var(--acc-ink)}
html{scroll-behavior:smooth}
body{color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img,video{display:block}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.display{font-family:"Display",var(--sans);font-weight:900;letter-spacing:-.01em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ── 壳：左侧导航 + 主区 ── */
.shell{display:flex;min-height:100vh}

.nav{display:flex;flex-direction:column;gap:8px}
.nav a{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;color:var(--ink-2);transition:background .15s,color .15s}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--acc);color:var(--acc-ink)}
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 88.0%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;height:58px;padding:0 28px;
  display:flex;align-items:center;gap:16px}
.top h1{font-size:16.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top h1 b{font-family:"Display",var(--sans);font-weight:900;margin-right:2px}
.top h1 a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px}
.top h1 a:hover{color:var(--acc)}
.top h1 svg{width:22px;height:22px;flex:none}
/* 顶栏的"当前项目"：一行小字 + 切换入口。之前是两行大药丸，比旁边的按钮还高，抢视线 */
.switcher{display:flex;align-items:center;gap:8px;margin:0 auto;min-width:0;max-width:520px;font-size:13.5px}
.switcher .sw-t{display:flex;align-items:baseline;gap:7px;min-width:0;color:var(--ink-3)}
.switcher .sw-t b{font-weight:650;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.switcher .sw-t small{font-size:13.5px;white-space:nowrap;color:var(--ink-3)}
.switcher a,.switcher button{color:var(--acc);font-weight:650;font-size:13.5px;flex:none;
  padding:5px 9px;border-radius:7px;white-space:nowrap}
.switcher a:hover,.switcher button:hover{background:var(--acc-soft)}
.top .sp{flex:1}
.tact{display:flex;align-items:center;gap:10px}
.tact .who{font-size:14px;color:var(--ink-2);max-width:220px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ── 配色主题：与成片台 renderer/src/tool/ui.css 同一套名字与令牌 ── */
[data-theme='xuanqing']{
  --bg:#0A1014; --surface:#121B21; --surface2:#1A262D; --sunken:#0D1519;
  --ink:#E6EEF2; --ink-2:#93A8B3; --ink-3:#778E9A;
  --line:#1E2C34; --line2:#2B3D47;
  --acc:#9CC3D5; --acc-ink:#0B1A22; --acc-soft:rgba(156,195,213,.10);
  --ok:#6FD0A0; --ok-soft:rgba(111,208,160,.12);
  --err:#FF7D6B; --err-soft:rgba(255,125,107,.10); --media:#05090C;
  --acc-hi:#C6E0EC; --jade:#4E7A8C; --btn-bg:#9CC3D5; --btn-ink:#0B1A22;
}
[data-theme='shimo']{
  --bg:#121212; --surface:#1B1B1B; --surface2:#242424; --sunken:#161616;
  --ink:#F2F2F2; --ink-2:#A3A3A3; --ink-3:#8C8C8C;
  --line:#2E2E2E; --line2:#3D3D3D;
  --acc:#E8E4DC; --acc-ink:#17170F; --acc-soft:rgba(232,228,220,.10);
  --ok:#7FD6A0; --ok-soft:rgba(127,214,160,.12);
  --err:#FF8080; --err-soft:rgba(255,128,128,.10); --media:#000;
  --acc-hi:#F5F2EA; --jade:#8A8A8A; --btn-bg:#E8E4DC; --btn-ink:#17170F;
}
[data-theme='zhimu']{
  --bg:#F4F1EA; --surface:#FFF; --surface2:#ECE7DC; --sunken:#E7E2D6;
  --ink:#1A1817; --ink-2:#6B655C; --ink-3:#6C665E;
  --line:#DDD7CB; --line2:#C9C2B3;
  --acc:#A44231; --acc-ink:#FFF; --acc-soft:rgba(164,66,49,.09);
  --ok:#166534; --ok-soft:rgba(22,101,52,.10);
  --err:#A44231; --err-soft:rgba(164,66,49,.10); --media:#14120F;
  --acc-hi:#C9705C; --jade:#7A5C54; --btn-bg:#A44231; --btn-ink:#FFF;
}
[data-theme='daiqing']{
  --bg:#EEF2F0; --surface:#FFF; --surface2:#E2EAE6; --sunken:#DDE6E1;
  --ink:#16211E; --ink-2:#5C6B66; --ink-3:#5F6965;
  --line:#D3DDD8; --line2:#B9C8C1;
  --acc:#14655A; --acc-ink:#FFF; --acc-soft:rgba(20,101,90,.09);
  --ok:#14655A; --ok-soft:rgba(20,101,90,.10);
  --err:#A13C2C; --err-soft:rgba(161,60,44,.10); --media:#101614;
  --acc-hi:#4E9487; --jade:#3E7A6C; --btn-bg:#14655A; --btn-ink:#FFF;
}
.theme-sel{-webkit-appearance:none;appearance:none;background:transparent;color:var(--ink-2);
  border:1px solid var(--line2);border-radius:8px;padding:6px 26px 6px 11px;font-size:13px;
  font-weight:600;cursor:pointer}
.theme-sel:hover{color:var(--acc);border-color:var(--acc)}
.theme-sel option{background:var(--surface);color:var(--ink)}
.theme-w{position:relative;display:inline-flex;align-items:center}
.theme-w i{position:absolute;right:9px;font-size:9px;color:var(--ink-3);pointer-events:none;
  font-style:normal}


.mainwrap{max-width:1240px;margin:0 auto;width:100%;padding:24px 28px 96px}
.view{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── 按钮 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  border-radius:12px;min-height:46px;padding:0 24px;font-size:15px;font-weight:800;
  background:var(--btn-bg);color:var(--btn-ink);box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:filter .2s,transform .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.05);box-shadow:0 12px 36px rgba(0,0,0,.42)}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--sunken);color:var(--ink-3);box-shadow:none;cursor:default}
.btn[disabled] .spin{border-color:rgba(255,255,255,.2);border-top-color:var(--ink-2)}
.btn.go{min-height:54px;font-size:16.5px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.btn.go:hover{box-shadow:0 16px 46px rgba(0,0,0,.45)}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.line:hover{background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:9px}
.ghost{color:var(--ink-2);font-size:14px;font-weight:600;border-radius:8px;
  padding:8px 12px;transition:background .2s,color .2s}
.ghost:hover{background:var(--sunken);color:var(--ink)}

/* ── 通用 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--sh-1)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sec-h .n{color:var(--ink-3);font-size:13.5px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  padding:3px 9px;border-radius:8px;background:var(--sunken);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.err{background:var(--err-soft);color:var(--err)}

/* ── 顶栏任务入口 + 全局任务面板 ── */
.tbadge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:800;
  display:grid;place-items:center}
.tasks-panel{position:fixed;top:64px;right:20px;z-index:65;width:360px;max-width:calc(100vw - 24px);
  max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);
  border-radius:10px;box-shadow:var(--sh-2);padding:10px}
.tasks-panel .tk-h{font-size:13.5px;font-weight:800;color:var(--ink-3);padding:6px 8px 10px}
.tasks-panel .tk{display:block;width:100%;text-align:left;border-radius:10px;padding:9px 10px;
  transition:background .15s}
.tasks-panel .tk:hover{background:var(--sunken)}
.tasks-panel .tk-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tasks-panel .tk-t b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tasks-panel .tk-t small{color:var(--ink-3);font-size:13px;flex:none}
.tasks-panel .tk-p{display:block;font-family:"Display",var(--sans);font-size:14px;color:var(--acc);
  margin-top:2px}
.tasks-panel .tk-bar{display:block;height:3px;border-radius:2px;background:var(--sunken);
  margin-top:6px;overflow:hidden}
.tasks-panel .tk-bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.tasks-panel .tk-empty{color:var(--ink-3);font-size:14px;padding:8px}
.tasks-panel .tk-e{display:block;color:var(--err);font-size:13px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 首页 · 开放式刊头（不是盒子里的 hero） ── */
/* 落地页：第一屏就是"拖进去" */
.hero{text-align:center;padding:22px 0 30px}
.hero h1{font-size:42px;font-weight:800;line-height:1.28;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero h1 em{font-style:normal;color:inherit;
  background:linear-gradient(transparent 66%,color-mix(in srgb, var(--acc) 38%, transparent) 0)}
.hero .sub{font-size:16.5px;color:var(--ink-2);margin-top:12px;line-height:1.7}
/* 首页拖拽区=这一页的主角：D 方向的安静虚线框，hover/拖悬时边框点亮 */
.hero .vg-drop{max-width:720px;margin:28px auto 0;padding:48px 26px;
  border:1px dashed color-mix(in srgb, var(--ink) 22%, transparent);border-radius:16px;
  background:rgba(255,255,255,.015);
  box-shadow:none;
  transition:border-color .25s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease)}
.hero .vg-drop:hover,.hero .vg-drop.over{
  border-color:var(--acc);background:rgba(255,255,255,.035);
  box-shadow:0 24px 70px rgba(0,0,0,.35)}
.hero .hint{color:var(--ink-2);font-size:14px;margin-top:16px}
.hero-acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
/* 首页 · 前后对比：一根发丝线隔出「拖进来的 → 拿到的」，不再叠卡片 */
.ba{display:flex;align-items:center;justify-content:center;gap:24px;margin:38px auto 0;max-width:820px;
  border-top:1px solid var(--line);padding-top:30px}
.ba-col{display:flex;flex-direction:column;align-items:center;gap:12px}
.ba-tag{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.2em}
.ba-tag-out{color:var(--acc)}
.ba-pack{width:300px;padding:8px 0 2px;text-align:left;background:transparent;
  border:0;border-radius:0;box-shadow:none}
.ba-pack-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:0}
.ba-pack-h b{font-size:15px;font-weight:750}
.ba-zipb{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;flex:none;
  border:1px solid var(--line2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em}
.ba-f{display:flex;align-items:center;gap:9px;padding:8px 2px;font-size:14.5px;color:var(--ink-2)}
.ba-f + .ba-f{border-top:1px dashed var(--line)}
.ba-f svg{width:16px;height:16px;flex:none;color:var(--ink-3)}
.ba-f b{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-2)}
.ba-mid{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.ba-arrow{width:72px;height:22px;color:var(--acc);animation:baPulse 2.4s ease-in-out infinite}
@keyframes baPulse{0%,100%{opacity:.5}50%{opacity:1}}
.ba-how{font-size:12.5px;line-height:1.7;color:var(--ink-3);text-align:center}
.ba-vid{width:120px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;
  border:1px solid var(--line2);background:var(--media);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.ba-vid video{width:100%;height:100%;object-fit:cover}
@media(max-width:760px){
  .ba{flex-direction:column;gap:16px;margin-top:30px}
  .ba-mid{gap:4px}
  .ba-arrow{transform:rotate(90deg);width:52px;height:18px}
}
@media(max-width:760px){.hero h1{font-size:29px}.hero .sub{font-size:15px}.hero .vg-drop{padding:34px 18px}}

.import{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;text-align:left;
  border-radius:var(--r-m);background:var(--surface);border:1.5px dashed var(--line2);cursor:pointer;
  transition:border-color .2s,background .2s}
.import:hover,.import.over{border-color:var(--acc);background:var(--acc-soft)}
.import b{display:block;font-size:14px}
.import span{color:var(--ink-2);font-size:13.5px}
.import .pick{margin-left:auto}

.rail-sec{margin-top:32px}
.posters{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.posters::-webkit-scrollbar{height:8px}
.poster{flex:none;width:186px;scroll-snap-align:start;text-align:left;position:relative;
  animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.poster .frame{position:relative;display:block;background:var(--media);border-radius:10px;padding:6px;
  box-shadow:var(--sh-1);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.poster:hover .frame{transform:translateY(-4px);box-shadow:var(--sh-2)}
.poster video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:9px;background:#000}
.poster .pdur{position:absolute;right:13px;bottom:13px;background:rgba(0,0,0,.72);color:#fff;
  font-family:"Display",var(--sans);font-size:13px;padding:1px 7px;border-radius:6px;font-weight:700;z-index:2}
.poster .pver{position:absolute;left:13px;top:13px;background:var(--acc);color:var(--acc-ink);
  font-size:13px;padding:2px 8px;border-radius:6px;font-weight:700;z-index:2}
.poster .t{display:block;font-size:13.5px;font-weight:700;margin-top:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .d{display:block;color:var(--ink-3);font-size:13px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:30px;padding:0 13px;border-radius:8px;font-size:13.5px;font-weight:700;
  color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface);
  transition:all .15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:18px;margin-top:14px}
.pcard{position:relative;text-align:left;border-radius:var(--r-m);overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.pcard .cover{aspect-ratio:3/4;background:var(--media);position:relative;overflow:hidden;cursor:pointer}
.pcard .cover img,.pcard .cover video{width:100%;height:100%;object-fit:cover}
.pcard .cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;text-align:center;padding:18px;
  color:var(--ink-3);font-size:13px;line-height:1.6}
.pcard .cover .ph b{font-size:15px;font-weight:750;color:var(--ink-2)}
.pcard .cover .ph .dia{width:9px;height:9px;background:var(--acc);transform:rotate(45deg);opacity:.8}
.pcard .cover .cnt{position:absolute;left:10px;top:10px;z-index:3}
.pcard .cover .shade{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(8,10,15,0) 48%,rgba(8,10,15,.78))}
.pcard .cover .ct{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;color:#fff;
  font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 8px rgba(0,0,0,.5)}
.pcard .cover .pplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:grid;place-items:center;opacity:0;transition:opacity .2s}
.pcard:hover .cover .pplay{opacity:1}
.pcard .cover .pplay svg{margin-left:3px}
.pcard .body{padding:10px 13px;cursor:pointer}
.pcard .body>div{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard .pwatch{flex:none;background:var(--acc);color:var(--acc-ink);font-size:13.5px;font-weight:700;
  padding:7px 13px;border-radius:8px}
.pcard .pwatch:hover{filter:brightness(1.06)}
.pcard .ptodo{flex:none;color:var(--ink-3);font-size:13.5px}
.pcard .body .m{color:var(--ink-3);font-size:13.5px}
.pcard .del{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;
  background:rgba(8,10,15,.6);color:#fff;display:grid;place-items:center;
  opacity:0;transition:opacity .2s,background .2s;backdrop-filter:blur(4px);z-index:4}
.pcard .ren{position:absolute;right:44px;top:8px;width:30px;height:30px;border-radius:8px;
  background:rgba(8,10,15,.6);color:#fff;display:grid;place-items:center;
  opacity:0;transition:opacity .2s,background .2s;backdrop-filter:blur(4px);z-index:4}
.pcard:hover .ren,.pcard .ren:focus-visible,.pcard .del:focus-visible{opacity:1}
.pcard .ren:hover{background:var(--acc);color:var(--acc-ink)}
.pcard:hover .del{opacity:1}
.pcard .del:hover{background:var(--err)}
.hist{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hist video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px}
.panel{padding:20px}
.step{display:flex;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:10px}

/* 模板小样海报（纯 CSS 画出每个模板的样子） */
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;gap:7px;padding:7px 7px 8px;border-radius:11px;text-align:left;
  position:relative;transition:background .15s,box-shadow .15s;border:1px solid transparent;min-width:0}
.tpl:hover{background:var(--sunken)}
.tpl.on{background:var(--acc-soft);border-color:var(--acc)}
.tpl .mock{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:7px;
  overflow:hidden;box-shadow:var(--sh-1)}
.tpl .mock i{position:absolute;display:block}
.tpl .mock .tpl-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tpl b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:13px;line-height:1.35;min-height:30px;text-align:center}
.tpl .tick{position:absolute;right:5px;top:5px;width:17px;height:17px;border-radius:50%;
  background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:900;display:none;
  place-items:center;line-height:1}
.tpl.on .tick{display:grid}
/* 小样内部形状 */
.mk-v{left:7%;top:6%;width:86%;height:32%;border-radius:4px}
.mk-card{left:6%;right:6%;bottom:6%;height:46%;border-radius:5px}
.mk-band{top:47%;left:12%;width:48%;height:10%;border-radius:2px}
.mk-ln{left:12%;width:70%;height:5%;border-radius:2px}
.mk-ln.s{top:71%;width:52%}
.mk-ln.d{top:58%;width:66%}
.mk-grid{inset:0;border-radius:inherit}
.mk-num{top:12%;left:8%;width:56%;height:9%;border-radius:2px}
.mk-num2{top:26%;left:8%;width:40%;height:7%;border-radius:2px;opacity:.6}
.mk-heavy{top:18%;left:10%;width:62%;height:12%;border-radius:2px}
.mk-heavy.s{top:34%;width:44%}
.mk-chip{top:10%;left:10%;width:34%;height:8%;border-radius:2px}
.mk-cap{bottom:10%;left:10%;right:10%;height:6%;border-radius:2px}
.mk-band.b{top:46%;left:0;right:0;width:auto;height:12%;border-radius:0}
.mk-vig{inset:0;border-radius:inherit}
.mk-seal{top:10%;right:10%;width:26%;aspect-ratio:1;border-radius:50%}
.mk-vidfull{inset:0;border-radius:inherit}
.mk-play{left:50%;top:44%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:rgba(247,246,243,.16)}
.mk-play::after{content:"";position:absolute;left:55%;top:50%;transform:translate(-50%,-50%);
  width:0;height:0;border-left:9px solid rgba(247,246,243,.9);
  border-top:5.5px solid transparent;border-bottom:5.5px solid transparent}
.tpls .mk-ln{top:62%}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:34px;padding:0 13px;border-radius:8px;font-size:14px;font-weight:600;
  color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface);
  transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.vgrp{display:flex;align-items:flex-start;gap:12px;width:100%}
.vgrp+.vgrp{margin-top:8px}
.vgrp-t{flex:none;font-size:14px;color:var(--ink-2);font-weight:600;padding-top:7px;min-width:4.5em}
.vgrp-pills{display:flex;gap:6px;flex-wrap:wrap}
.adv-caret{font-style:normal;display:inline-block;transition:transform .18s}
#advSum{color:var(--ink-2)}
.vpill{display:inline-flex;align-items:center;gap:4px}
.pv{font-size:13px;border:1px solid var(--line2);border-radius:8px;padding:2px 8px;
  background:transparent;color:var(--ink-2);cursor:pointer;font-family:inherit}
.pv:hover{color:var(--ink);border-color:var(--ink-3)}
.pv:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.swt{width:42px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:none;
  transition:background .2s}
.swt i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.swt.on{background:var(--acc)}
.swt.on i{left:21px}
select{background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:8px 10px;font-size:14px;color:var(--ink);max-width:190px}
textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:10px 12px;font-size:14px;resize:vertical;min-height:60px;line-height:1.7;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--acc)}
.note-warn{background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.22);color:#FFD57A;
  font-size:13.5px;border-radius:9px;padding:10px 12px;line-height:1.6;margin-bottom:10px}
@keyframes blink{50%{opacity:.25}}
@keyframes shotin{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}

/* ── 登录 / 注册 ── */
.auth{min-height:calc(100vh - 220px);display:grid;place-items:center;padding:32px 0}
/* 登录卡：定价页主角卡同款渐变描边——进门的第一个物件就要有分量 */
.auth .card{width:min(420px,100%);padding:36px 34px 30px;border:1px solid transparent;
  background:linear-gradient(180deg,var(--surface),var(--sunken)) padding-box,
             linear-gradient(160deg,var(--jade) 0%,color-mix(in srgb, var(--acc) 22.0%, transparent) 45%,var(--line) 100%) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 50px rgba(0,0,0,.45),0 0 70px color-mix(in srgb, var(--acc) 10.0%, transparent);
  animation:rise .5s var(--ease) both}
.auth .mark svg{filter:drop-shadow(0 0 26px color-mix(in srgb, var(--acc) 35.0%, transparent))}
/* Agent 直投落地页（/i/<code>）：送达卡片 + 手机接力二维码 */
.in-wrap{max-width:640px;margin:0 auto}
.in-wrap .card{width:min(640px,100%)}
.in-badge{display:inline-block;padding:5px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--sunken);color:var(--acc);font-size:13.5px;font-weight:600;letter-spacing:.02em}
.in-stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 0 4px;font-size:13.5px;color:var(--ink-2)}
.in-stats b{color:var(--ink)}
.in-script{margin:14px 0 4px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--sunken);font-size:13.5px;line-height:1.9;color:var(--ink-2);max-height:180px;overflow:auto;text-align:left;
  -webkit-mask-image:linear-gradient(180deg,#000 80%,transparent 99%);mask-image:linear-gradient(180deg,#000 80%,transparent 99%)}
.in-qr{margin-top:18px;text-align:center}
.in-qr svg{display:inline-block;width:132px;height:132px;border-radius:8px;background:#fff;padding:8px}
.in-qr p{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}
@media(max-width:760px){.in-qr{display:none}}
.auth .aw{display:flex;justify-content:center;margin-bottom:16px}
.auth .mark{width:48px;height:48px;display:grid;place-items:center}
.auth .mark svg{width:48px;height:48px}
.auth h1{font-size:20px;font-weight:900;text-align:center;letter-spacing:-.01em}
.auth .sub{text-align:center;color:var(--ink-2);font-size:14px;margin:6px 0 22px;line-height:1.7}
.atabs{display:flex;gap:4px;background:var(--sunken);border-radius:10px;padding:4px;margin-bottom:20px}
.atabs button{flex:1;min-height:36px;border-radius:8px;font-size:14px;font-weight:700;
  color:var(--ink-2);transition:background .15s,color .15s,box-shadow .15s}
.atabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.fld input{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:11px 12px;font-size:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.fld input::placeholder{color:var(--ink-3)}
.fld input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fld .d{font-size:13.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0}
.auth .row2 .btn{flex:none;width:auto;min-height:41px}
.aerr{background:var(--err-soft);color:var(--err);font-size:14px;border-radius:8px;
  padding:9px 12px;margin-bottom:14px;display:none}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);
  margin:2px 0 18px;cursor:pointer}
.remember input{accent-color:var(--acc);width:15px;height:15px}
.auth .btn{width:100%;min-height:46px}
.auth .row2 .btn.sm{width:auto}

/* ── 骨架屏 ── */
.skel{border-radius:12px;background:linear-gradient(90deg,var(--sunken) 25%,var(--surface2) 45%,var(--sunken) 65%);
  background-size:240% 100%;animation:shimmer 1.5s infinite linear}
@keyframes shimmer{to{background-position:-140% 0}}

/* ── 浮层 ── */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);z-index:80;
  background:var(--surface2);color:var(--ink);padding:11px 20px;font-size:14px;border-radius:10px;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(8,10,15,.66);z-index:70;
  backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;
  width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:var(--sh-2);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.tier-chip{border:1px solid var(--line2);border-radius:8px;font-size:13px;padding:4px 10px;color:var(--ink-2);cursor:pointer;background:none}
/* ── 顶栏「我的」入口 + 下拉菜单 + 账号设置 ── */
.me-btn{display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:0 12px 0 5px;
  border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);
  cursor:pointer;color:var(--ink);font-size:14px;font-weight:600;transition:box-shadow .15s}
.me-btn:hover{box-shadow:inset 0 0 0 1px var(--acc)}
.me-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:15px;background:var(--acc-soft);flex:none;line-height:1}
.me-btn .who{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-btn .tier-chip{cursor:inherit}
.me-menu{position:fixed;top:62px;right:20px;z-index:70;width:308px;max-width:calc(100vw - 24px);
  background:var(--surface);border:1px solid var(--line2);border-radius:10px;
  box-shadow:var(--sh-2);overflow:hidden;animation:rise .18s var(--ease) both}
.me-head{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}
.me-head .me-av{width:44px;height:44px;font-size:22px}
.me-head b{display:block;font-size:15px}
.me-head small{display:block;color:var(--ink-3);font-size:13.5px;max-width:210px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.me-benefit{margin:12px 14px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface2)}
.me-benefit .mb-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:13.5px;color:var(--ink-2)}
.me-benefit .mb-row+.mb-row{margin-top:8px}
.me-benefit .mb-note{font-size:13.5px;color:var(--ink-3);line-height:1.65;margin-top:9px;
  padding-top:9px;border-top:1px dashed var(--line)}
.me-item{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:11px 16px;
  font-size:13.5px;font-weight:600;color:var(--ink-2);border-top:1px solid var(--line)}
.me-item:hover{background:var(--sunken);color:var(--ink)}
.me-item .mi{font-style:normal;width:20px;text-align:center;flex:none}
.me-item .mr{margin-left:auto;color:var(--ink-3);font-size:13px;font-weight:400}
.me-item.go{color:var(--acc)}
.me-item.warn{color:var(--err)}
.me-avbig{width:64px;height:64px;font-size:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--acc-soft);margin:0 auto;cursor:pointer;line-height:1}
.av-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.av-grid button{width:44px;height:44px;border-radius:12px;font-size:22px;display:grid;place-items:center;
  background:var(--surface2);border:1.5px solid transparent;cursor:pointer;transition:border-color .12s}
.av-grid button:hover{border-color:var(--line2)}
.av-grid button[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}
.acct-sec{border-top:1px dashed var(--line2);margin-top:16px;padding-top:14px}
.acct-sec h4{font-size:14px;margin:0 0 10px;color:var(--ink-2)}
.acct-sec h4 small{font-weight:400;color:var(--ink-3);margin-left:8px;font-size:13px}
.acct-meta{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-2);
  padding:6px 2px}
.acct-meta b{color:var(--ink);font-weight:600;text-align:right;overflow-wrap:anywhere}
@media(max-width:640px){.me-btn .who{display:none}.me-menu{right:12px}}
/* ── 权益与定价整页（原弹窗已废）── */
/* 贵感版：高级版是主角，开场立主张，微信转账说成一对一服务 */
.pp-wrap{max-width:760px;margin:0 auto;padding-top:6px}
.pp-pill{display:inline-flex;align-items:center;gap:8px;margin-top:34px;padding:5px 13px;border-radius:8px;
  border:1px solid var(--line2);color:var(--ink-2);font-size:13.5px;font-weight:600}
.pp-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.pp-wrap h1{font-size:32px;font-weight:900;letter-spacing:-.02em;margin-top:16px}
.pp-wrap h1 em{font-style:normal;color:var(--acc)}
.pp .pp-sub{color:var(--ink-2);font-size:14.5px;margin-top:10px;max-width:560px;line-height:1.85}
.pp-now{margin:18px 0 0;padding:11px 14px;border-radius:11px;background:var(--acc-soft);
  border:1px solid color-mix(in srgb, var(--acc) 22.0%, transparent);font-size:13.5px;color:var(--ink-2);display:inline-block}
.pp-now b{color:var(--acc)}
/* 入场：整页块依次落座，一页只动一件事的节奏 */
.pp-wrap>*{animation:rise .45s var(--ease) both}
.pp-wrap>*:nth-child(2){animation-delay:.06s}.pp-wrap>*:nth-child(3){animation-delay:.12s}
.pp-wrap>*:nth-child(4){animation-delay:.18s}.pp-wrap>*:nth-child(5){animation-delay:.24s}
.pp-wrap>*:nth-child(n+6){animation-delay:.3s}
.pp-tiers{display:grid;grid-template-columns:1fr;gap:16px;margin-top:30px;align-items:stretch}
.pp-tier.hi{max-width:100%}
.pp-tier{position:relative;border-radius:10px;padding:24px 24px 20px;background:var(--surface);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.3);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.pp-tier:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 40px rgba(0,0,0,.4)}
/* 主角卡：渐变只描在边框上，不糊进内容；顶部一道大报式双金线 */
.pp-tier.hi{border-color:transparent;
  background:linear-gradient(180deg,#1F1B2C,#181425) padding-box,
             linear-gradient(160deg,var(--jade) 0%,color-mix(in srgb, var(--acc) 25.0%, transparent) 45%,var(--line) 100%) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 40px color-mix(in srgb, var(--acc) 10.0%, transparent),0 4px 16px rgba(0,0,0,.35)}
.pp-tier.hi::before{content:"";position:absolute;top:-1px;left:12%;right:12%;
  border-top:3px double color-mix(in srgb, var(--acc) 75.0%, transparent)}
/* 朱红印章：整页唯一的一点红，落在主角卡右上 */
.pp-seal{position:absolute;right:18px;top:64px;width:74px;height:74px;border:2px solid #B4433A;
  border-radius:8px;color:#C25A4E;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;letter-spacing:.1em;line-height:1.45;transform:rotate(8deg);opacity:.92;
  pointer-events:none}
.pp-seal span{font-size:11.5px;font-weight:600;letter-spacing:.24em}
.pp-tier.hi:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 52px color-mix(in srgb, var(--acc) 14.000000000000002%, transparent),0 6px 20px rgba(0,0,0,.4)}
.pp-th{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pp-th h3{font-size:17px;font-weight:800}
.pp-reco,.pp-minechip{font-size:13px;font-weight:700;color:var(--acc);background:var(--acc-soft);
  border:1px solid color-mix(in srgb, var(--acc) 28.000000000000004%, transparent);border-radius:8px;padding:3px 10px;letter-spacing:.04em;flex:none}
.pp-amt{margin-top:14px;display:flex;align-items:baseline;gap:6px}
.pp-amt .cur{font-size:16px;font-weight:700;color:var(--ink-2)}
.pp-amt .num{font-family:"Display",var(--sans);font-weight:900;font-size:50px;letter-spacing:-.01em;line-height:1;
  color:var(--ink)}
.pp-amt .per{font-size:13.5px;color:var(--ink-3)}
.pp-one{margin-top:9px;color:var(--ink-2);font-size:15px}
.pp-feats{margin:14px 0 18px;padding:0;list-style:none}
.pp-feats li{position:relative;padding:5.5px 0 5.5px 26px;font-size:15px;color:var(--ink-2);line-height:1.6}
.pp-feats li::before{content:"";position:absolute;left:2px;top:13px;width:8px;height:8px;
  background:var(--acc);transform:rotate(45deg)}
.pp-feats li b{color:var(--ink);font-weight:650}
.pp-tier .btn{width:100%}
.pp-tier .btn[disabled]{cursor:default;filter:none}
.pp-under{margin-top:9px;font-size:13.5px;color:var(--ink-3);text-align:center;line-height:1.6}
.pp-free{margin-top:14px;text-align:center;color:var(--ink-3);font-size:14px}
.pp-how{margin-top:36px}
.pp-redeem{margin-top:34px}
.pp-how>h2,.pp-redeem>h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.pp-howsub{margin-top:5px;color:var(--ink-3);font-size:14px}
.pp-steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:16px}
.pp-step{padding:17px;border-radius:10px;border:1px solid var(--line);background:var(--surface);

// 每个浏览器限一次、每个 IP 每天两次，服务端记账）。
async function paintLandingTry(){
  const host = $("landTopics"), tplHost = $("landTpls"), go = $("tryGo"), note = $("tryNote");
  let topics = [], tpls = [];
  try {
    const d = await (await fetch("/api/try/topics")).json();
    topics = d.topics || []; tpls = d.templates || [];
  } catch (e) {}
  if (!topics.length){ note.textContent = "试玩选题准备中，稍后再来。"; return; }
  host.innerHTML = topics.map(t => `<button class="topic" data-id="${esc(t.id)}" data-tpl="${esc(t.template)}">
    <b>${esc(t.title)}</b><small>${esc(t.subtitle || "")}</small></button>`).join("");
  tplHost.innerHTML = tpls.map(t => `<button class="pill" data-v="${esc(t.id)}">${esc(t.name)}</button>`).join("");
  host.querySelectorAll(".topic").forEach(el => el.onclick = () => {
    host.querySelectorAll(".topic").forEach(x => x.classList.toggle("on", x === el));
    LAND.topic = el.dataset.id;
    if (!LAND.template){                       // 选题自带推荐模板，先替用户选上
      LAND.template = el.dataset.tpl;
      tplHost.querySelectorAll(".pill").forEach(x => x.classList.toggle("on", x.dataset.v === LAND.template));
    }
    go.disabled = false;
  });
  tplHost.querySelectorAll(".pill").forEach(el => el.onclick = () => {
    tplHost.querySelectorAll(".pill").forEach(x => x.classList.toggle("on", x === el));
    LAND.template = el.dataset.v;
  });
  go.onclick = async () => {
    go.disabled = true;
    try {
      if (!LAND.job){
        const r = await fetch("/api/try", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic: LAND.topic, template: LAND.template }) });
        const d = await r.json();
        if (!r.ok){ note.textContent = d.error || "提交失败，稍后再试"; return; }
        LAND.job = d.job;
      }
    } catch (e) { note.textContent = "网络异常，稍后再试"; return; }
    note.textContent = "已提交，正在出片（约 1–3 分钟）……";
    clearInterval(LAND.timer);
    LAND.timer = setInterval(async () => {
      let st;
      try { st = await (await fetch("/api/try/" + LAND.job)).json(); } catch (e) { return; }
      if (st.stage === "done" && st.video){
        clearInterval(LAND.timer);
        note.textContent = "出炉了！带水印的 720p 样片；注册后做你自己的正片不带水印。";
        const done = $("tryDone");
        done.classList.remove("hide"); done.style.display = "flex";
        done.innerHTML = `<video controls playsinline src="${esc(st.video)}"></video>
          <div class="s"><h3>${esc(st.title || "样片出炉")}</h3>
          <p>这是一条 15 秒左右的带水印样片。注册 GetCut，用你自己的文案和素材出正片——
          不带水印、配音音色随便挑，还能一键导出剪映草稿精剪。</p>
          <button class="go" id="tryReg">用我的文案做一条 ▸</button></div>`;
        $("tryReg").onclick = () => { AUTHMODE = "register"; showAuth(); };
        done.scrollIntoView({ behavior: "smooth", block: "center" });
      } else if (st.error){
        clearInterval(LAND.timer);
        note.textContent = "这次没做成：" + (st.error || "") + "，稍后再试一次。";
      } else if (st.queued_pos){
        note.textContent = "排队中，前面还有 " + st.queued_pos + " 个……";
      } else if (st.stage !== "done"){
        note.textContent = "正在出片 · " + (st.progress || 0) + "%（约 1–3 分钟）";
      }
    }, 4000);
  };
}

let lastSentAt = 0;
async function sendCode(emailId = "auEmail", buttonId = "auSend", endpoint = "/api/auth/send-code"){
  const email = $(emailId).value.trim();
  const err = (m) => { const el = $("aerr"); el.style.display = "block"; el.textContent = m; };
  const ok = (m) => { const el = $("aerr"); el.style.display = "block"; el.style.color = "var(--ok)";
    el.style.background = "var(--ok-soft)"; el.textContent = m; };
  const reset = () => { const el = $("aerr"); el.style.color = ""; el.style.background = ""; };
  if (!email) return err("请先输入邮箱");
  const btn = $(buttonId);
  btn.disabled = true;
  try {
    const r = await api(endpoint, { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email }) });
    reset(); ok(r.message || "验证码已发送");
    lastSentAt = Date.now();
    let left = 60;
    btn.textContent = left + " 秒后重发";
    clearInterval(codeTimer);
    codeTimer = setInterval(() => {
      left -= 1;
      if (left <= 0){ clearInterval(codeTimer); btn.disabled = false; btn.textContent = "获取验证码"; }
      else btn.textContent = left + " 秒后重发";
    }, 1000);
  } catch (e) {
    btn.disabled = false;
    err(e.message || "发送失败");
  }
}
async function submitRegister(){

/* ── 登录设备与注销 ──
   隐私政策里承诺了"可随时注销""可撤回某台设备的登录"，这两句必须有入口，
   否则政策就是空话；被投诉时"我们支持注销"却找不到按钮，比不写更糟。 */
function openDevices(){
  api("/api/auth/sessions").then(rs => {
    if (rs && rs.error){ dialog("登录设备与注销", "读取失败：" + rs.error, null, "", true); return; }
    const rows = (rs && rs.sessions) || [];
    const list = rows.length
      ? `<div class="dv-h">当前登录中的设备（${rows.length} 台）</div>` + rows.map(x =>
          `<div class="dv-row"><span>${esc(x.device)}<small>${esc(x.ip || "")} · 最近活跃 ${
            x.last_seen ? new Date(x.last_seen * 1000).toLocaleString("zh-CN") : "—"}</small></span>
            <button type="button" class="btn sm line" data-sid="${esc(x.sid)}">踢掉</button></div>`).join("")
      : `<div class="dv-h">当前登录中的设备：只有这一台。</div>`;
    dialog("登录设备与注销", "", null, "", true, list + `
      <div class="dv-sep"></div>
      <div class="dv-t">注销这个账号</div>
      <div class="dv-p">注销会删除你的素材包、成片、品牌套装与克隆音色登记，<b>无法恢复</b>。
        卡密与购买记录会保留但去掉你的邮箱（财务对账需要）。
        详见<a href="/privacy" target="_blank" rel="noopener">隐私政策</a> ·
        <a href="/terms" target="_blank" rel="noopener">用户协议</a>。</div>
      <label class="dv-chk"><input type="checkbox" id="dvYes">我确认删除以上全部内容</label>
      <input class="dv-in" id="dvPwd" type="password" placeholder="再输一次密码确认" autocomplete="current-password">
      <div class="dv-err" id="dvErr" role="status" aria-live="polite"></div>
      <div class="row"><button class="btn sm line" data-c>关闭</button>
        <button class="btn sm" id="dvGo" style="background:var(--err,#ff6b6b)">确认注销</button></div>`);
    const box = [...document.querySelectorAll(".modal")].pop();
    if (!box) return;
    box.querySelectorAll("[data-sid]").forEach(b => b.onclick = async (e) => {
      e.preventDefault(); e.stopPropagation();
      const r = await api("/api/auth/session/revoke", {method:"POST", body:{sid:b.dataset.sid}});
      if (r && r.error) b.textContent = "没踢掉"; else b.closest(".dv-row").remove();
    });
    const go = box.querySelector("#dvGo"), err = box.querySelector("#dvErr");
    if (go) go.onclick = async () => {
      const yes = box.querySelector("#dvYes"), pw = box.querySelector("#dvPwd");
      if (!yes.checked || !pw.value){ err.textContent = "请先勾选确认并输入密码"; pw.focus(); return; }
      go.disabled = true; go.textContent = "正在删除…";
      const r = await api("/api/auth/delete-account", {method:"POST", body:{confirm:true, password:pw.value}});
      go.disabled = false; go.textContent = "确认注销";
      if (r && r.error){ err.textContent = r.error; return; }
      location.href = "/";
    };
  });
}

  const close = () => { m.remove(); document.removeEventListener("keydown", onKey); };
  m.querySelector("#acClose").onclick = close;

  document.addEventListener("keydown", onKey);
  let picked = ME.avatar || avs[0];

function wireImport(drop, input, onFile){
  if (!drop) return;
  input.onchange = (e) => onFile(e.target.files[0]);
  drop.onclick = () => input.click();
  drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); input.click(); } };
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) onFile(f);
  });
}
async function heroStart(file){
  if (!file) return;
  const epoch = viewEpoch;
  const strip = $("heroDrop"); if (strip && strip.disabled) return;
  if (strip) strip.disabled = true;
  try {
    const r = await api("/api/projects/create", {method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    if (!r || !r.project_id) throw new Error("创建失败");
    if (strip) strip.disabled = true;
    dropBar(strip, 0, "正在上传… 0%");
    const up = await uploadZip(file, pct => dropBar(strip, pct, "正在上传… " + pct + "%"));
    dropBar(strip, 100, "正在解压并读取内容…");
    await api(`/api/projects/${r.project_id}/mount`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bundle:up.name,title:up.name})});
    if (epoch !== viewEpoch) return;
    CUR = {project_id:r.project_id,title:up.name,bundle:up.name,renders:[]};
    toast("已导入"); setHash("#/project/" + r.project_id); renderProject();
  } catch(e){ if (epoch === viewEpoch){ if (e.auth) showAuth(); else toast("导入失败：" + e.message); } }
  finally {
    if (strip && strip.isConnected) {
      strip.disabled = false;
      dropReset(strip, "把素材包拖到这里");
    }
  }
}
function uploadZip(file, onProgress){
  // 用 XHR 才能拿到上传进度；fetch 没有进度事件，用户会以为卡死了
  const fd = new FormData(); fd.append("file", file);
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.setRequestHeader("x-auth-token", TOK());
    xhr.upload.onprogress = (e) => {
      if (onProgress && e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100));
    };
    xhr.onload = () => {
      let d = {}; try { d = JSON.parse(xhr.responseText || "{}"); } catch (err) { d = {}; }
      if (xhr.status >= 200 && xhr.status < 300 && d && d.name) resolve(d);
      else { const err = new Error((d && d.error) || ("HTTP " + xhr.status)); err.data = d; reject(err); }
    };
    xhr.onerror = () => reject(new Error("网络中断，上传失败"));
    xhr.send(fd);
  });
}
/* 拖拽区里的上传进度：一条动着的条 + 百分比 */
function dropBar(drop, pct, label){
  if (!drop) return;
  let bar = drop.querySelector(".dropbar");
  if (!bar){ bar = document.createElement("span"); bar.className = "dropbar"; bar.innerHTML = "<i></i>"; drop.appendChild(bar); }
  bar.querySelector("i").style.width = Math.max(6, Math.min(100, pct)) + "%";
  const b = drop.querySelector("b"); if (b && label) b.textContent = label;
}
function dropReset(drop, text){
  if (!drop) return;
  const bar = drop.querySelector(".dropbar"); if (bar) bar.remove();
  const b = drop.querySelector("b"); if (b) b.textContent = text;
}

function updateFlowJobView(force){
  if (!FLOW || FLOW.view !== "generate" || !$("vg-bigbar")) return;
  const j = FLOW.status || {};
  const cancelled = j.stage === "cancelled";
  const terminal = ["failed","unknown","cancelled"].includes(j.stage);
  const done = j.stage === "done";
  if (terminal || done) FLOW.stopSent = false;
  const queued = j.stage === "queued";
  const pct = done ? 100 : Math.max(0, Math.min(99, Number(j.progress) || 0));
  const s8 = Math.max(1, Math.min(8, Number(j.stage8) || 1));
  // 一句话说清"现在在干嘛"；环进度本身在条上写清"第几步、哪一环"
  const line = queued ? (j.queued_pos ? `排队中 · 前面还有 ${j.queued_pos} 个任务` : "排队中，马上轮到它")
    : done ? "可以看了，也可以下载或导出剪映草稿。"
    : cancelled ? "已按你的要求停止。返回确认可随时重来。"
    : terminal ? humanError(j.error)
    : (j.detail || "正在连接任务状态…");
  const bar = $("vg-bigbar"), fill = $("vg-fill");
  if (fill) fill.style.width = (queued ? 4 : cancelled ? 0 : pct) + "%";
  bar.setAttribute("aria-valuenow", String(pct));
  $("vg-pct").textContent = queued ? "排队中" : cancelled ? "已停止" : pct + "%";
  const label = queued ? "排队中" : done ? "全片完成" : terminal ? "" : (STAGE8[s8-1] || "处理中");
  $("vg-step").innerHTML = `${queued || terminal ? "" : `<span class="vg-stepn">第 ${s8}/8 步 · </span>`}${esc(label)}`;
  $("vg-elapsed").textContent = j.elapsed != null && !done ? "已用 " + mmss(j.elapsed) : "";
  $("vg-bigstage").textContent = done ? "成片好了。" : cancelled ? "已停止。" : terminal ? "这一版没做成" : "正在生成你的视频";
  const h1 = document.querySelector(".vg-context h1");
  if (h1 && FLOW.view === "generate") h1.textContent = done ? "这一版做好了" : cancelled ? "这次生成已停止" : terminal ? "这一版没做成" : "正在生成你的视频";
  $("vg-bigline").textContent = line;
  $("vg-bigline").className = (j.stage === "failed" || j.stage === "unknown") ? "vg-bigline vg-error" : "vg-bigline";
  bar.classList.toggle("vg-donebar", done);

  // 结果区：完成后就地给出成片（用户不用再找入口）
  const key = JSON.stringify([done, FLOW.jobId, j.stage]);
  if (!force && FLOW.artifactKey === key) return;
  FLOW.artifactKey = key;
  const rs = flowRenders();
  const last = rs.length ? rs[rs.length - 1] : null;
  if (done && last){
    $("vg-result").innerHTML = `<div class="vg-done">
      <div class="vg-donewrap"><video class="vg-export-player" id="mainPlayer" controls playsinline src="${esc(vid(last.id))}"></video></div>
      <div class="vg-doneactions"><a class="btn go" id="dlBtn" href="${esc(vid(last.id))}" download>下载 MP4</a>
      <button class="btn line" id="vg-to-export">历史版本与剪映草稿</button></div>
      <p class="vg-notes" style="margin-top:14px">想再改一版？返回上一步调整后重新生成，旧版本不会被覆盖。</p></div>`;
    $("vg-to-export").onclick = () => setFlowView("export");
  } else if (terminal && !done){
    $("vg-result").innerHTML = ""; // 清掉"停止"按钮；返回确认走底栏出口，不重复放
  } else {
    // 还在跑：给一个明确的"停止"出口——排队中秒停，渲染中约 1 秒内中断
    $("vg-result").innerHTML = `<p class="vg-stoprow"><button class="btn line sm" id="vg-stop" ${FLOW.stopSent ? "disabled" : ""}>${FLOW.stopSent ? "正在停止…" : "停止这次生成"}</button></p>`;
    $("vg-stop").onclick = askStop;
  }
}
function askStop(){
  if (!FLOW || !FLOW.jobId) return;
  dialog("停止这次生成？", "排队中的会立刻退出队列；正在渲染的会马上中断，不再出片。返回确认后可以随时重来。", async () => {
    FLOW.stopSent = true;
    try {
      const r = await api(`/api/job/${encodeURIComponent(FLOW.jobId)}/cancel`, {method:"POST"});
      toast(r && r.stage === "cancelled" ? "已停止" : "停止指令已发出，正在中断…");
      const b = $("vg-stop"); if (b) { b.disabled = true; b.textContent = "正在停止…"; }

}

    if (mediaRec && mediaRec.state === "recording"){ mediaRec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder){ recMsg.textContent = "这个浏览器不支持录音，换 Chrome/Edge 试试"; return; }
    navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
      mediaRec = new MediaRecorder(stream);
      recChunks = [];
      mediaRec.ondataavailable = e => recChunks.push(e.data);
      mediaRec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        clearInterval(recTimer);
        recBtn.textContent = "● 重新录";
        recBlob = new Blob(recChunks, {type: mediaRec.mimeType || "audio/webm"});
        recPlay.src = URL.createObjectURL(recBlob);
        recPlay.classList.remove("hide");
        recUp.disabled = !consent.checked;
        recMsg.textContent = "录好了，先听一听，满意就点右边的按钮";
      };
      mediaRec.start();
      const t0 = Date.now();
      recTime.textContent = "0:00";
      recTimer = setInterval(() => {
        const sec = Math.floor((Date.now() - t0) / 1000);
        recTime.textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
        if (sec >= 45) mediaRec.stop();   // 45 秒封顶，30 秒左右效果最好
      }, 250);
      recBtn.textContent = "■ 停止";
      recMsg.textContent = "在安静的地方，用平时说话的语气读一段稿子，30 秒左右";
    }).catch(() => { recMsg.textContent = "麦克风没权限，到浏览器地址栏允许一下"; });
  };
  recUp.onclick = async () => {
    if (!recBlob) return;
    recUp.disabled = true; recMsg.textContent = "上传并克隆中，约十几秒…";
    const fd = new FormData();
    fd.append("file", recBlob, "recording.webm");
    try {
      await api("/api/voice-clone", {method: "POST", body: fd});
      recMsg.style.color = "var(--acc)";
      recMsg.textContent = "克隆成功！音色列表里选「我的声音」就能用你的声音配音";
      toast("我的声音已就绪");
    } catch (e) {
      recUp.disabled = !consent.checked; recMsg.style.color = "";
      recMsg.textContent = e.message || "克隆失败";
    }
  };
  document.body.appendChild(m);
  document.addEventListener("keydown", onKey);
}

/* Task lifecycle: no overlapping timer polls; every response belongs to a project/job epoch. */
let JD = null;
function newJD(){ return {lastPct:-1,lastChange:Date.now(),localT0:Date.now(),samples:[],firstPoll:true}; }
async function startRender(b){
  if (!CUR || BUILD_PENDING.has(CUR.project_id) || flowBusy()) return;
  if (!CUR.bundle || !b || !String(b.script || "").trim()){ toast("请先导入并确认完整文案"); return; }
  if (!FLOW || FLOW.view !== "confirm" || b !== CURB) return;
  const pid = CUR.project_id, epoch = viewEpoch, bundle = CUR.bundle;
  const payload = {project_id:pid,bundle,voice:CFG.voice,bgm:CFG.bgm,
    sfx:CFG.sfxMode !== "off",sfxMode:CFG.sfxMode,subtitles:true,
    sources:CFG.sources !== false, watermark:CFG.watermark !== false, format:CFG.format,
    useLlm:true};
  BUILD_PENDING.add(pid); paintFlowFooter();
  try {
    const r = await api("/api/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if (!r || !r.job) throw new Error((r && r.error) || "启动失败");
    // Even after navigation, remember the job under its originating project, never the new one.
    localStorage.setItem("vg.job." + pid,r.job);
    if (!flowHere(epoch,pid) || !FLOW) return;
    job = lastJob = r.job; FLOW.jobId = r.job;
    FLOW.status = {stage:"queued",stage8:1,progress:0,detail:"已提交，等待后台开始"};
    FLOW.selectedStage = null; FLOW.view = "generate"; FLOW.artifactKey = null;
    setHash("#/project/" + pid + "/generate"); paintFlow(); startPoll(); toast("已在后台开始生成，你可以继续做别的项目");
  } catch(e){
    if (!flowHere(epoch,pid)) return;
    if (e.auth) return showAuth();
    toast("启动失败：" + humanError(e.message));
    // A different browser may have submitted this project; restore its real job on conflict.
    if (e.data && /已有任务/.test(e.message)) renderProject();
  } finally { BUILD_PENDING.delete(pid); if (flowHere(epoch,pid)) paintFlowFooter(); }
}
function startPoll(){
  stopPoll(); JD = newJD();
  const token = pollEpoch, jid = job, pid = CUR && CUR.project_id;
  const tick = async () => {
    await pollJob(jid);
    if (token === pollEpoch && CUR && CUR.project_id === pid && job === jid)
      timer = setTimeout(tick,1500);
  };
  tick();
}
async function pollJob(jid){
  const epoch = viewEpoch, token = pollEpoch, pid = CUR && CUR.project_id;
  if (!pid || !jid || job !== jid || !FLOW || FLOW.jobId !== jid) return;
  const current = () => flowHere(epoch,pid) && pollEpoch === token && job === jid && FLOW && FLOW.jobId === jid;
  let j;
  try { j = await api("/api/job/" + encodeURIComponent(jid)); }
  catch(e){
    if (!current()) return;
    if (e.auth) return showAuth();
    FLOW.pollError = "状态连接暂时中断，将继续重试。不能据此判断任务已停止。";
    updateFlowJobView(); return;
  }
  if (!current() || j.project_id && j.project_id !== pid) return;
  FLOW.pollError = ""; FLOW.status = j;
  if (!JD) JD = newJD();
  if (j.progress !== JD.lastPct){ JD.lastPct = j.progress; JD.lastChange = Date.now(); }
  updateFlowJobView();
  if (["done","failed","cancelled","unknown"].includes(j.stage)){
    stopPoll();
    if (localStorage.getItem("vg.job." + pid) === jid) localStorage.removeItem("vg.job." + pid);
    if (j.stage === "unknown") FLOW.status.detail = "服务重启或任务记录已清理。请查看本项目历史成片，或返回确认重新生成。";
    updateFlowJobView(true);
    if (j.stage === "done" || j.stage === "unknown") await refreshStageCard();
    if (!flowHere(epoch,pid) || job !== jid) return;
    // Keep the selected review stage. Completion exposes export, never inserts a player here.
    paintFlowFooter();
    if ($("vg-change")) $("vg-change").disabled = false;
    if ($("vg-drop")) $("vg-drop").disabled = false;
    if ($("vg-bundles")) $("vg-bundles").disabled = false;
    document.querySelectorAll('[data-flow="export"]').forEach(el => { el.disabled = !flowRenders().length && j.stage !== "done"; });
  }
}

}

/* 唤起本地导入助手。装了的机器浏览器会失焦弹"打开 GetCut 助手？"；
   没装的机器唤起没任何反应，2.6 秒页面还在前台 → 弹首次安装引导。 */
function wakeGetCutAssistant(pullPath, rid) {
  const src = location.origin + pullPath;
  let woke = false;
  const off = () => { woke = true; };
  window.addEventListener("blur", off);
  document.addEventListener("visibilitychange", off);
  location.href = "getcut://import?src=" + encodeURIComponent(src);
  setTimeout(() => {
    window.removeEventListener("blur", off);
    document.removeEventListener("visibilitychange", off);
    if (!woke) openJyAssist(rid);
  }, 2600);
}

/* 首次安装引导层：装一次小助手，之后「一键导入到剪映」点一下直达 */
function openJyAssist(rid) {
  closeJyAssist();
  const mobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const d = document.createElement("dialog");
  d.id = "jyAssist"; d.className = "vg-dialog";
  d.innerHTML = `<div class="vg-dialog-head"><h2>还差最后一步：装一次「导入小助手」</h2><button class="ghost" data-close aria-label="关闭">×</button></div>
  <div class="vg-dialog-body jy-assist">
    <p class="jy-assist-why">浏览器不允许网页直接改你电脑上的剪映草稿库，所以要装一个 <b>约 10 KB</b> 的小助手到你本机（不需要管理员权限）。<b>装这一次，以后点「一键导入到剪映」就是一键直达</b>——草稿直接进剪映、剪映自动打开，不再下载压缩包、不再跑脚本。</p>
    ${mobile ? '<p class="jy-assist-warn">⚠ 你现在用的是手机：导入剪映需要 <b>Windows 电脑 + 剪映专业版</b>，请在电脑上打开本页再操作。</p>' : ""}
    <a class="btn go jy-assist-dl" id="jyAssistDl" href="${esc(qs("/assistant/GetCut-Setup.bat"))}" download>① 下载小助手（GetCut-Setup.bat）</a>
    <ol class="jy-assist-steps">
      <li>双击下载的 <b>GetCut-Setup.bat</b>。Windows 可能弹一枚「无法验证发布者」的蓝色提示——这是没买代码签名证书的软件都会有的系统提示，不是病毒。点「更多信息」→「仍要运行」即可。</li>
      <li>黑窗口里看到 <b>[OK] 安装完成</b> 就是装好了（只需这一次，以后不会再弹）。</li>
      <li>点下面的按钮，重新导入。</li>
    </ol>
    <div class="jy-assist-actions">
      <button class="btn go" id="jyAssistRetry" type="button">装好了，重新导入</button>
    </div>
    <p class="jy-assist-alt">不想装助手？也可以用老办法：<button class="ghost" id="jyAssistManual" type="button">下载草稿压缩包</button>，解压后双击里面的「一键导入剪映.bat」。</p>
  </div>
  <div class="vg-dialog-foot"><button class="btn line sm" data-close>下次再说</button></div>`;
  document.body.appendChild(d);
  d.showModal();
  d.addEventListener("close", () => d.remove());
  const ridCur = rid || (FLOW && FLOW.exportId);
  d.querySelector("#jyAssistRetry").onclick = () => { d.close(); if (ridCur) importDraft(ridCur); };
  d.querySelector("#jyAssistManual").onclick = async (e) => {
    e.target.disabled = true;
    try { await downloadDraft(FLOW && FLOW.pid, ridCur); toast("导入包已下载：解压后双击「一键导入剪映.bat」"); }
    catch (err) { toast("下载失败：" + ((err && err.message) || "稍后再试")); }
    e.target.disabled = false;
  };
}
function closeJyAssist(){ const d = $("jyAssist"); if (d){ d.close(); d.remove(); } }

/* 下载导入包（不想装助手的退路）：带转圈，避免点链接干等 */
async function downloadDraft(pid, rid) {
  const res = await fetch(qs(`/api/projects/${pid}/renders/${rid}/jianying-draft`));
  if (!res.ok) throw new Error("打包失败");
  const blob = await res.blob();
  const cd = res.headers.get("Content-Disposition") || "";
  const m = /filename\*=UTF-8''([^;]+)/.exec(cd);
  const name = m ? decodeURIComponent(m[1]) : "jianying-draft.zip";
  const url = URL.createObjectURL(blob);
  const t = document.createElement("a");
  t.href = url; t.download = name;
  document.body.appendChild(t); t.click(); t.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* 导出页打开时问一次草稿状态，把按钮下面的提示写准 */
async function paintJianyingNote(pid, rid) {
  const n = $("jyNote");
  if (!n) return;
  try {
    const st = await api(`/api/projects/${pid}/renders/${rid}/jianying-status`);
    if (!st) return;
    n.textContent = st.ready
      ? (st.jianying ? "草稿已备好，点一下就直接进剪映。" : "草稿已备好：点一下，助手直接把草稿装进剪映并打开它（首次使用会引导你装一次小助手）。")
      : (st.building ? "草稿正在后台打包（约 1 分钟），先下载 MP4 也行。" : "点一下开始打包草稿（约 1–2 分钟）。");
  } catch (e) { /* 状态拿不到就不提示 */ }
}

boot();
