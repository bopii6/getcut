<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>videogen 视频工作台</title>
<style>
:root{
  /* 色板（品牌方向来自原版：暗底 + 荧光绿） */
  --bg:#0d0d0d; --bg-elev:#141414; --panel:#191919; --panel-2:#202020; --panel-3:#282828;
  --line:#2b2b2b; --line-strong:#3a3a3a;
  --txt:#eaeae8; --txt-dim:#a5a5a0; --txt-faint:#6f6f6a;
  --lime:#d5e75f; --lime-dim:#aab93f; --lime-ink:#101010;
  --warn:#d08b3f; --danger:#e06a50; --info:#7fd4c9;
  /* 字号阶梯 */
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px;
  --fs-20:20px; --fs-24:24px; --fs-30:30px;
  /* 间距节奏（4 的倍数） */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  /* 圆角 */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  /* 动效（仅交互反馈） */
  --ease:cubic-bezier(.2,.8,.3,1); --t-fast:150ms; --t:200ms;
}
*{box-sizing:border-box;margin:0}
::selection{background:var(--lime);color:var(--lime-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2e2e2e;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3d3d3d}
::-webkit-scrollbar-track{background:transparent}
body{background:var(--bg);color:var(--txt);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  font-size:var(--fs-14);line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:var(--lime-dim);text-decoration:none}
a:hover{color:var(--lime)}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s5);
  border-bottom:1px solid var(--line);background:rgba(20,20,20,.92);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.top .logo{font-weight:900;font-size:var(--fs-16);letter-spacing:.5px;margin-right:var(--s3);
  display:flex;align-items:center;gap:var(--s2);color:var(--lime)}
.top .logo::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--lime);
  box-shadow:0 0 12px rgba(213,231,95,.55)}
.top button{background:transparent;color:var(--txt-dim);border:1px solid transparent;
  border-radius:var(--r-sm);padding:7px 14px;font-size:var(--fs-13);
  transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.top button:hover{color:var(--txt);background:var(--panel-2)}
.top button.on{background:var(--panel-2);border-color:var(--line-strong);color:var(--txt)}
.top .sp{flex:1}
.top .cred{font-size:var(--fs-12);color:var(--lime);border:1px solid #37401c;background:#171c0e;
  border-radius:var(--r-pill);padding:5px 14px;white-space:nowrap}

/* ---------- 布局 ---------- */
.wrap{display:flex;min-height:calc(100vh - 50px);align-items:flex-start}
.main{flex:1;min-width:0;padding:var(--s8) var(--s10) var(--s10);max-width:1080px}
.sidebar{width:300px;flex:none;padding:var(--s8) var(--s5);border-left:1px solid var(--line);
  min-height:calc(100vh - 50px);background:var(--bg-elev)}

/* ---------- 标题体系 ---------- */
h1{font-size:var(--fs-30);line-height:1.25;letter-spacing:-.4px;font-weight:800}
h2{font-size:var(--fs-24);line-height:1.3;letter-spacing:-.2px;font-weight:800}
h3{font-size:var(--fs-16);line-height:1.4;font-weight:700;display:flex;align-items:center;gap:var(--s2)}
h4{font-size:var(--fs-16);line-height:1.4;font-weight:700;margin:var(--s6) 0 var(--s3)}
h5{font-size:var(--fs-12);color:var(--txt-dim);font-weight:600;letter-spacing:.4px;
  margin:var(--s5) 0 var(--s2)}
p.sub{color:var(--txt-dim);font-size:var(--fs-13);margin:var(--s2) 0 var(--s5);max-width:70ch}
h3 .count{font-size:var(--fs-12);color:var(--txt-faint);font-weight:500;
  background:var(--panel-2);border-radius:var(--r-pill);padding:2px 10px}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;gap:var(--s2);background:var(--lime);color:var(--lime-ink);
  border:0;border-radius:var(--r-sm);padding:11px 22px;font-size:var(--fs-14);font-weight:700;
  transition:filter var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--panel-3);color:var(--txt-faint);cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--txt)}
.btn.ghost:hover{border-color:#4d4d4d;background:var(--panel-2)}
.btn.small{padding:7px 14px;font-size:var(--fs-13);font-weight:600}
.btn.pill{border-radius:var(--r-pill);padding:6px 16px;font-size:var(--fs-13);font-weight:600}
.btn.pill.on{background:var(--lime);color:var(--lime-ink)}

/* ---------- 面板 / 卡片 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s6);margin-bottom:var(--s5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:var(--s4)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;position:relative;transition:border-color var(--t) var(--ease),transform var(--t) var(--ease)}
.card:has(.card-main:hover){border-color:var(--line-strong);transform:translateY(-2px)}
.card-main{display:block;width:100%;padding:0;background:none;border:0;color:inherit;text-align:left}
.card .cover{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:center 22%;display:block;background:var(--panel-2)}
.card .cover-empty{display:flex;align-items:center;justify-content:center;color:#3d3d3d;
  font-size:44px;font-weight:900}
.card .pad{display:block;padding:var(--s3) var(--s4) var(--s4)}
.card .chipmeta{display:inline-block;background:#171c0e;color:var(--lime);border-radius:var(--r-pill);
  padding:2px 10px;font-size:var(--fs-11);font-weight:600;margin-bottom:var(--s2)}
.card strong{display:block;font-size:var(--fs-14);line-height:1.45;font-weight:700;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-main:hover strong{color:var(--lime)}
.card .meta{display:block;color:var(--txt-faint);font-size:var(--fs-12);margin-top:var(--s1)}
.card .del{position:absolute;top:var(--s2);right:var(--s2);background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.08);color:#bbb;border-radius:var(--r-sm);
  padding:4px 10px;font-size:var(--fs-11);opacity:0;transition:opacity var(--t-fast) var(--ease)}
.card:hover .del{opacity:1}
.card .del:hover{color:var(--danger);border-color:var(--danger)}

/* ---------- 右侧栏 ---------- */
.sidebar h3{margin-bottom:var(--s3)}
.ren{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);margin-bottom:var(--s3);font-size:var(--fs-13);line-height:1.5}
.ren .t{color:var(--lime);font-size:var(--fs-11);font-weight:700;letter-spacing:.3px;
  display:block;margin-bottom:var(--s1)}

/* ---------- 向导导轨 ---------- */
.rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s3);display:flex;gap:var(--s1);margin:var(--s4) 0 var(--s5);overflow:hidden}
.rail button{display:flex;align-items:center;gap:var(--s3);background:transparent;border:0;
  color:var(--txt-faint);padding:10px 14px;border-radius:var(--r-sm);font-size:var(--fs-13);
  text-align:left;flex:1;min-width:0;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.rail button .n{width:24px;height:24px;border-radius:50%;background:var(--panel-3);color:var(--txt-faint);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-11);font-weight:700;flex:none}
.rail button.on{background:var(--panel-2);color:var(--txt)}
.rail button.on .n{background:var(--lime);color:var(--lime-ink)}
.rail button.done{color:var(--txt-dim)}
.rail button.done .n{background:#171c0e;color:var(--lime)}
.rail button:not(:disabled):not(.on):hover{background:var(--panel-2)}
.rail button:disabled{cursor:default}

/* ---------- 配置项 ---------- */
.optrow{display:flex;gap:var(--s3);flex-wrap:wrap}
.opt{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s3) var(--s5);color:var(--txt-dim);font-size:var(--fs-14);min-width:120px;
  transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.opt:hover{border-color:var(--line-strong)}
.opt b{display:block;color:var(--txt);font-size:var(--fs-14);font-weight:700}
.opt small{color:var(--txt-faint);font-size:var(--fs-11)}
.opt.on{border-color:var(--lime);background:#161a0e}
.opt.on b{color:var(--lime)}
.cfgbox{background:var(--panel-2);border-radius:var(--r-md);padding:var(--s3) var(--s5);margin:var(--s3) 0}
.cfgline{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  padding:10px 0;border-bottom:1px solid #242424}
.cfgline:last-child{border-bottom:0}
.cfgline .t{font-size:var(--fs-14)}
.cfgline .d{color:var(--txt-faint);font-size:var(--fs-12);margin-top:2px;max-width:56ch}
.seg{display:flex;gap:var(--s2);flex-wrap:wrap}
.seg .pill{background:var(--panel-3);border:1px solid var(--line);color:var(--txt-dim);
  border-radius:var(--r-sm);padding:9px 18px;font-size:var(--fs-13);font-weight:600;
  transition:all var(--t-fast) var(--ease)}
.seg .pill:hover{border-color:var(--line-strong);color:var(--txt)}
.seg .pill.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
input[type=text],textarea,select,input[type=file]{width:100%;background:var(--bg-elev);color:var(--txt);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-13)}
textarea{min-height:64px;resize:vertical}
select{cursor:pointer}
.switch{position:relative;width:38px;height:20px;background:var(--panel-3);border-radius:var(--r-pill);
  display:inline-block;vertical-align:middle;flex:none;transition:background var(--t-fast) var(--ease)}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8a8a8a;
  transition:left var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.switch.on{background:var(--lime)}
.switch.on i{left:20px;background:var(--lime-ink)}

/* ---------- 素材/内容 ---------- */
.script{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s5);line-height:2;font-size:var(--fs-14);margin:var(--s3) 0;max-height:340px;overflow:auto}
.aitem{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;margin-bottom:var(--s3)}
.aitem img,.aitem video{width:100%;height:104px;object-fit:cover;display:block;background:#101010}
.aitem .pad{padding:var(--s3)}
.aitem .f{font-family:Consolas,monospace;font-size:var(--fs-11);color:var(--txt-faint);word-break:break-all}
.aitem .k{display:inline-block;background:var(--panel-3);border-radius:4px;padding:1px 8px;
  font-size:var(--fs-11);margin:var(--s2) 0;color:var(--txt-dim)}
.aitem .anc{font-size:var(--fs-12);color:var(--txt-dim);margin-top:var(--s1);line-height:1.5}

/* ---------- 渲染进度 ---------- */
.bar{height:10px;background:var(--panel-3);border-radius:var(--r-pill);overflow:hidden;margin:var(--s5) 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime-dim),var(--lime));
  width:0%;transition:width .6s var(--ease);border-radius:var(--r-pill)}
.stagelist{display:flex;flex-direction:column;gap:2px;margin:var(--s4) 0}
.stagelist .st{display:flex;gap:var(--s3);align-items:center;color:var(--txt-faint);
  padding:7px 0;font-size:var(--fs-13)}
.stagelist .st .n{width:22px;height:22px;border-radius:50%;background:var(--panel-3);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-11);font-weight:700}
.stagelist .st.on{color:var(--txt)}
.stagelist .st.on .n{background:var(--lime);color:var(--lime-ink)}
.stagelist .st.done{color:var(--txt-dim)}
.stagelist .st.done .n{background:#171c0e;color:var(--lime)}

/* ---------- 上传区 / 引导 ---------- */
.hero-actions{display:flex;gap:var(--s3);margin:var(--s5) 0 var(--s2)}
.onboard{background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--r-lg);
  padding:var(--s5) var(--s6);margin:var(--s5) 0}
.onboard strong{font-size:var(--fs-16);font-weight:700}
.onboard p{color:var(--txt-dim);font-size:var(--fs-13);margin-top:var(--s2);max-width:64ch}
.onboard .hint{font-family:Consolas,monospace;font-size:var(--fs-12);color:var(--txt-faint)}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);padding:var(--s10) var(--s5);
  text-align:center;color:var(--txt-dim);background:var(--panel);cursor:pointer;display:block;width:100%;
  transition:border-color var(--t) var(--ease),background var(--t) var(--ease)}
.drop:hover,.drop:focus-visible{border-color:var(--lime);background:#141811}
.drop.dragover{border-color:var(--lime);background:#161a0e}
.drop strong{color:var(--txt);font-size:var(--fs-16);display:block;margin-bottom:var(--s4);font-weight:700}
.chips{display:flex;gap:var(--s2);justify-content:center;margin-bottom:var(--s4);flex-wrap:wrap}
.chip{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:5px 12px;font-size:var(--fs-11);color:var(--txt-dim);font-family:Consolas,monospace}

/* ---------- 版面预览 / 提示 ---------- */
.mediapreview{display:flex;gap:var(--s5);align-items:flex-end;margin:var(--s4) 0 var(--s2)}
.ph{background:var(--panel-3);border:1.5px solid var(--line);border-radius:var(--r-sm)}
.ph.v{width:54px;height:96px}
.ph.h{width:114px;height:64px}
.ph.emb{width:114px;height:64px;display:flex;align-items:center;justify-content:center}
.ph.emb i{display:block;width:72px;height:40px;background:var(--panel-2);border-radius:3px;
  border:1px solid var(--line-strong)}
.ph.on{border-color:var(--lime)}
.phcap{color:var(--txt-faint);font-size:var(--fs-11);text-align:center;margin-top:6px}
.warn{margin:var(--s3) 0;padding:12px 16px;border-radius:var(--r-md);font-size:var(--fs-13);
  background:#1f1810;border:1px solid #3a2c18;border-left:4px solid var(--warn);color:#e8c79a;line-height:1.6}
.finetune{display:flex;gap:var(--s3);align-items:center;margin-top:var(--s3)}
.footver{color:var(--txt-faint);font-size:var(--fs-12);margin-top:var(--s10);
  padding-top:var(--s4);border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px var(--s4);font-size:var(--fs-13);margin:var(--s3) 0}
.kv .k{color:var(--txt-faint)}
code.id{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:4px 12px;font-size:var(--fs-12);color:var(--info);font-family:Consolas,monospace}

/* ---------- 浮层 ---------- */
.toast{position:fixed;left:50%;bottom:var(--s8);transform:translateX(-50%) translateY(6px);
  background:var(--panel-2);color:var(--txt);border:1px solid var(--line-strong);
  border-left:4px solid var(--lime);border-radius:var(--r-md);padding:11px 22px;
  font-size:var(--fs-13);opacity:0;pointer-events:none;z-index:60;
  transition:opacity var(--t) var(--ease),transform var(--t) var(--ease)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:center;
  justify-content:center;z-index:58;backdrop-filter:blur(2px)}
.modal .box{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-lg);
  padding:var(--s6);width:min(440px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.modal .box p{margin:var(--s2) 0 var(--s5);color:var(--txt-dim);font-size:var(--fs-13);line-height:1.7}
.modal .row{display:flex;gap:var(--s3);justify-content:flex-end}
video.res{display:block;width:100%;max-width:540px;border-radius:var(--r-md);margin:var(--s5) 0;
  background:#000;border:1px solid var(--line)}
.skip{position:absolute;left:-9999px;top:10px;background:var(--lime);color:var(--lime-ink);
  padding:8px 16px;border-radius:var(--r-sm);font-weight:700;z-index:99}
.skip:focus{left:16px}
.hide{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){.sidebar{display:none}.main{padding:var(--s5)}}
</style>
</head>
<body>
<div class="top">
  <span class="logo" style="color:var(--lime)">▶ videogen</span>
  <button class="on" onclick="goHome()">视频工作台</button>
  <span class="sp"></span>
  <span class="cred">本地 · 不限积分</span>
</div>
<a class="skip" href="#main">跳到主内容</a>
<div class="wrap">
  <div class="main" id="main" role="main" tabindex="-1"></div>
  <div class="sidebar hide" id="sidebar"><h3>渲染记录</h3><div id="renList"><p class="sub">暂无渲染记录</p></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const api = (u, o) => fetch(u, o).then(r => r.json());
let CUR = null;      // 当前项目 {project_id,title,bundle}
let CFG = { voice:"zh-CN-YunxiNeural", rate:100, bgm:"assets/bgm_upbeat.mp3",
            sfx:true, sfxMode:"hook", subtitles:true, sources:true,
            theme:"auto", format:"portrait_editorial" };
let poll = null;
let job = null, timer = null, lastJob = null, lastVideoJob = null;

const STAGE8 = ["素材准备","分镜规划","TTS 配音","画面设计","画面校验","预览帧","最终合成","上传成片"];

function voiceLabel(){
  const m = {"zh-CN-YunxiNeural":"云希 · 清爽男声","zh-CN-YunjianNeural":"云健 · 浑厚男声",
             "zh-CN-YunyangNeural":"云扬 · 新闻男声","zh-CN-XiaoxiaoNeural":"晓晓 · 女声"};
  return m[CFG.voice] || CFG.voice;
}

function toast(msg){
  let t = document.getElementById("__toast");
  if (!t) { t = document.createElement("div"); t.id = "__toast"; t.className = "toast";
            t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t.__h); t.__h = setTimeout(() => t.classList.remove("on"), 2600);
}

function confirmBox(title, desc, onOk, okText, readonly){
  const m = document.createElement("div");
  m.className = "modal";
  const box = document.createElement("div");
  box.className = "box"; box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
  const h = document.createElement("h3"); h.textContent = title;
  const p = document.createElement("p"); p.textContent = desc;
  const row = document.createElement("div"); row.className = "row";
  const c = document.createElement("button"); c.className = "btn ghost"; c.textContent = "取消";
  if (readonly) c.textContent = "关闭";
  const k = document.createElement("button"); k.className = "btn"; k.textContent = okText || "确认删除";
  if (readonly) k.classList.add("hide");
  c.onclick = () => m.remove();
  k.onclick = () => { m.remove(); onOk(); };
  m.onclick = (e) => { if (e.target === m) m.remove(); };
  row.append(c, k); box.append(h, p, row); m.appendChild(box);
  document.body.appendChild(m); (readonly ? c : k).focus();
}

let __hashLock = "";
function setHash(h){ __hashLock = h; if (location.hash !== h) location.hash = h; }

async function route(){
  if (location.hash === __hashLock) return;   // 自己刚设置的，不重复渲染
  __hashLock = location.hash;
  const m = location.hash.match(/#\/project\/([a-f0-9]+)(?:\/(\d))?/);
  if (m){
    const projs = await api("/api/projects");
    const p = projs.find(x => x.project_id === m[1]);
    if (p){ CUR = p; await renderStudio(parseInt(m[2] || "1", 10), true); return; }
  }
  renderHome();
}

function goHome(){ CUR = null; setHash("#/"); renderHome(); }

});

  const main = document.createElement("button");

async function renderStudio(step, fromHash){
  if (CUR && CUR.project_id) setHash(`#/project/${CUR.project_id}/${step}`);
  $("sidebar").classList.remove("hide");
  if (step === 1 && CUR.bundle) step = 2;   // 已挂载素材包：与原版一致，直接落在内容确认
  if (step === 4) {
    try {
      const rs = (CUR.renders || []).filter(r => r.file);
      if (rs.length) {
        const lr = rs[rs.length - 1];
        CUR.hasRender = true;
        if (!lastJob) {
          const jid = lr.file.split("-").pop().replace(".mp4", "");
          lastVideoJob = jid;
          lastJob = jid;   // 任务 ID 与展示的成片保持一致
        }
      }
    } catch (e) {}
  }
  const b = CUR.bundle ? await api("/api/bundle/" + CUR.bundle) : null;
  const railStep = {1:"01 选择素材",2:"02 内容确认",3:"03 渲染配置",4:"04 生成与成片"};
  let rail = `<div class="rail">`;
  ["01 选择素材","02 内容确认","03 渲染配置","04 生成与成片"].forEach((t,i) => {
    const n = i+1, on = n === step, done = n < step;
    const label = t.replace(/^0\d /,"");
    const can = n === 1 ? true : (n <= 3 ? !!CUR.bundle : (!!lastJob || (CUR.renders || []).length > 0));
    const dis = can ? "" : "disabled";
    const click = can ? ` onclick="renderStudio(${n})"` : "";
    rail += `<button class="${on?"on":done?"done":""}" ${dis}${click} data-n="${n}">
      <span class="n">${done?"✓":`0${n}`}</span><span>${label}</span></button>`;
  });
  rail += `</div>`;
  const head = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <button class="btn ghost small" onclick="goHome()">← 切换项目</button>
      <strong style="font-size:16px">${CUR.title}</strong>
      ${b?`<span style="color:var(--gray);font-size:13px">${b.assets.length} 个素材</span>`:""}
    </div>` + rail;
  let body = "";
  if (step === 1) body = stepChoose();
  else if (step === 2) body = stepConfirm(b);
  else if (step === 3) body = stepConfig(b);
  else body = stepRender();
  $("main").innerHTML = head + `<div id="stepBody">${body}</div>`;
  wireStep(step, b);
  const lazies = document.querySelectorAll("[data-lazy-video]");
  if (lazies.length && "IntersectionObserver" in window){
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting){ en.target.preload = "metadata"; io.unobserve(en.target); }
      });
    }, { rootMargin: "200px" });
    lazies.forEach(v => io.observe(v));
  }
}

function sw(el){ el.classList.toggle("on"); if(el.dataset.k) CFG[el.dataset.k] = el.classList.contains("on"); }

function wireStep(step, b){
  if (step === 1){
    const doUpload = async (f) => {
      if (!f) return;
      const fd = new FormData(); fd.append("file", f);
      const r = await api("/api/upload", {method:"POST", body: fd});
      if (r.error) { alert(r.error); return; }
      CUR.bundle = r.name; CUR.title = r.name;
      await api(`/api/projects/${CUR.project_id}/mount`, {method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify({bundle:r.name, title:r.name})});
      toast("素材包已导入：" + r.name);
      renderStudio(2);
    };
    $("zipIn").onchange = (e) => doUpload(e.target.files[0]);
    const dz = $("drop");
    dz.onclick = (e) => { if (e.target.tagName !== "BUTTON") $("zipIn").click(); };
    dz.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("zipIn").click(); } };
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("dragover"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
    dz.addEventListener("drop", (e) => {
      e.preventDefault(); dz.classList.remove("dragover");
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) doUpload(f);
    });
    api("/api/bundles").then(list => {
      const g = $("bundlePick"); g.innerHTML = "";
      list.forEach(x => {
        const d = document.createElement("div");
        d.className = "card";
        d.innerHTML = `<div class="pad"><strong>${x.name}</strong><div class="m">${x.assets} 个素材 · ${x.updated}</div></div>`;
        d.onclick = async () => {
          CUR.bundle = x.name; CUR.title = x.name;
          await api(`/api/projects/${CUR.project_id}/mount`, {method:"POST",
            headers:{"Content-Type":"application/json"}, body: JSON.stringify({bundle:x.name, title:x.name})});
          renderStudio(2);
        };
        g.appendChild(d);
      });
    });
  }
  if (step === 2){
    $("next2").onclick = () => renderStudio(3);
  }
  if (step === 3){
    document.querySelectorAll("#fmt .opt").forEach(o => o.onclick = () => {
      if (o.dataset.v === "landscape") { alert("横屏即将支持；当前支持竖屏信息版与竖屏满版"); return; }
      document.querySelectorAll("#fmt .opt").forEach(x => x.classList.remove("on"));
      o.classList.add("on"); CFG.format = o.dataset.v;
    });
    document.querySelectorAll("#theme .opt").forEach(o => o.onclick = () => {
      if (o.dataset.v !== "auto") { alert("浅色/深色基调即将支持；当前由模型按选题气质自动配色"); return; }
      document.querySelectorAll("#theme .opt").forEach(x => x.classList.remove("on"));
      o.classList.add("on"); CFG.theme = o.dataset.v;
    });
    const setRate = (r, syncPills) => {
      r = Math.max(60, Math.min(200, r));
      CFG.rate = r;
      $("rateTxt").textContent = (r/100).toFixed(2) + "×";
      if (syncPills) document.querySelectorAll("#rateSeg .pill").forEach(x =>
        x.classList.toggle("on", +x.dataset.r === r));
      const base = window.__baseEst || 0;
      const e = Math.round(base / (r/100));
      if (e > 0) {
        const mm = Math.floor(e/60), ss = e%60;
        const e2 = $("est2"); if (e2) e2.textContent = `${mm}分${ss}秒`;
        const ei = $("estInline"); if (ei) ei.textContent = `${mm}:${String(ss).padStart(2,"0")}`;
      }
    };
    document.querySelectorAll("#durSeg .pill").forEach(p => p.onclick = () => {
      document.querySelectorAll("#durSeg .pill").forEach(x => x.classList.remove("on"));
      p.classList.add("on");
      const target = +p.dataset.d;
      const need = Math.round(target * 6 * (CFG.rate/100));
      const cur = b.script.length;
      const diff = cur - need;
      const hint = $("durHint");
      if (Math.abs(diff) <= need * 0.12) {
        hint.textContent = `当前文案 ${cur} 字 ≈ ${Math.round(cur/6)} 秒，与 ${target} 秒目标匹配 — 直接渲染即可`;
        hint.style.color = "var(--lime)";
      } else {
        hint.textContent = `${target} 秒目标需要约 ${need} 字（当前 ${cur} 字，${diff > 0 ? "多" + diff : "少" + (-diff)} 字）。`
          + `让 Agent 按 ${target} 秒档改一版文案后再渲染，或直接用当前文案出片（约 ${Math.round(cur/6)} 秒）`;
        hint.style.color = "#d08b3f";
      }
    });
    $("rateDown").onclick = () => setRate(CFG.rate - 5, true);
    $("rateUp").onclick = () => setRate(CFG.rate + 5, true);
    document.querySelectorAll("#rateSeg .pill").forEach(p => p.onclick = () => {
      document.querySelectorAll("#rateSeg .pill").forEach(x => x.classList.remove("on"));
      p.classList.add("on");
      setRate(+p.dataset.r, false);
    });
    document.querySelectorAll("#sfxSeg .pill").forEach(p => p.onclick = () => {
      document.querySelectorAll("#sfxSeg .pill").forEach(x => x.classList.remove("on"));
      p.classList.add("on"); CFG.sfxMode = p.dataset.v;
    });
    $("go").onclick = startRender;
  }
}

async function startRender(){
  try {
    const r = await api(`/api/build`, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({project_id: CUR.project_id, bundle: CUR.bundle,
        voice: CFG.voice, rate: String(CFG.rate), bgm: CFG.bgm,
        sfx: CFG.sfxMode !== "off", sfxMode: CFG.sfxMode,
        subtitles: CFG.subtitles !== false, sources: CFG.sources !== false,
        theme: CFG.theme, format: CFG.format,
        disclaimer: ($("disclaimer") && $("disclaimer").value.trim()) || undefined,
        useLlm: true})});
    if (!r || !r.job) throw new Error((r && r.error) || "启动渲染失败");
    job = r.job; lastJob = r.job;
    await renderStudio(4);
    if (timer) clearInterval(timer);
    timer = setInterval(() => pollJob(job), 1500);
    pollJob(job);
  } catch (e) {
    alert("启动渲染失败：" + e.message);
  }
}

function stepRender(){
  const hasOld = !!lastVideoJob;
  const oldBlock = hasOld ? `
    <div id="pdone">
      <video class="res" id="player" controls style="max-width:100%" src="/video/${lastVideoJob}"></video>
      <a class="btn" id="dl" download href="/video/${lastVideoJob}" style="text-decoration:none">下载成片</a>
      <p class="sub" style="margin-top:8px">最近一次成片 · 任务 ${lastVideoJob} · 点「开始渲染」可生成新版本</p>
    </div>` : "";
  return `<div class="panel">
    <h2>${hasOld ? "生成与成片" : "视频生成中"}</h2>
    <p class="sub">第 ${hasOld ? (((CUR.renders||[]).length) || 1) : 1} 次渲染 · ${CUR.title}</p>
    <div class="bar" role="progressbar" aria-label="渲染进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${hasOld ? 100 : 0}" id="pbarBox"><i id="pbar" style="width:${hasOld ? 100 : 0}%"></i></div>
    <h3 id="pstage">${hasOld ? "渲染完成" : "准备中"}</h3>
    <p class="sub" id="ppct">${hasOld ? "100% · 成片已生成" : ""}</p>
    <div class="stagelist" id="stages">${STAGE8.map((t,i)=>`
      <div class="st" data-i="${i+1}"><span class="n">${i+1}</span><span>${t}</span></div>`).join("")}</div>
    <p class="sub">进度按处理阶段更新，各阶段耗时不同</p>
    <div style="margin:14px 0;display:flex;align-items:center;gap:10px">
      <span style="color:var(--gray)">任务 ID</span>
      <code class="id" id="taskId">${lastJob || CUR.project_id}</code>
      <button class="btn ghost small" onclick="copyTaskId()">复制</button>
    </div>
    <h4>这一次的创作</h4>
    <div class="kv" style="max-width:440px">
      <span class="k">画面</span><span>竖屏信息版 · 自动基调</span>
      <span class="k">声音</span><span>${voiceLabel()} · ${(CFG.rate/100).toFixed(2)}×</span>
      <span class="k">音乐</span><span>${CFG.bgm ? "已启用" : "未启用"} · 音效 ${CFG.sfxMode === "off" ? "关闭" : "开场档"}</span>
      <span class="k">导演</span><span>DeepSeek 分镜导演</span>
    </div>
    <div class="err hide" id="perr"></div>
    <div class="hide" id="pdoneNew">
      <video class="res" id="player2" controls style="max-width:100%"></video>
      <a class="btn" id="dl2" download style="text-decoration:none">下载成片</a>
    </div>
    ${oldBlock}
  </div>`;
}

async function pollJob(job){
  let j;
  try {
    j = await api("/api/job/" + job);
  } catch (e) { return; }
  if (j.stage === "unknown") {
    // 服务重启后内存任务丢失：尝试恢复最近成片
    if (lastJob !== job) return;
    const l = await api("/api/latest");
    if (l && l.video) {
      clearInterval(timer);
      $("pbar").style.width = "100%";
      $("pstage").textContent = "渲染完成";
      $("ppct").textContent = "100% · 成片已生成";
      lastVideoJob = l.job;
      const box2 = $("pdoneNew") || $("pdone");
      if (box2) box2.classList.remove("hide");
      const pl2 = $("player2") || $("player");
      if (pl2) pl2.src = "/video/" + l.job;
      const dl2 = $("dl2") || $("dl");
      if (dl2) dl2.href = "/video/" + l.job;
      return;
    }
    $("pstage").textContent = "任务已丢失（服务重启），请重新渲染";
    $("ppct").textContent = "";
    return;
  }
  const idx = Math.min(j.stage8 || 1, 8);
  const pct = j.progress || 0;
  $("pbar").style.width = pct + "%";
  const pb = $("pbarBox"); if (pb) pb.setAttribute("aria-valuenow", pct);
  $("pstage").textContent = STAGE8[idx-1] || "";
  $("ppct").textContent = pct + "% · 第 " + idx + " / 8 步";
  document.querySelectorAll("#stages .st").forEach(el => {
    const i = +el.dataset.i;
    el.className = "st" + (i < idx ? " done" : i === idx ? " on" : "");
  });
  if (j.stage === "failed"){
    clearInterval(timer);
    $("pstage").textContent = "渲染失败";
    const box = $("perr");
    box.classList.remove("hide");
    box.innerHTML = `<div>渲染没有完成。常见原因：素材包路径失效、配音接口网络异常、模型额度不足。</div>` +
      `<div style="margin-top:8px;color:#b8b3ac;font-family:Consolas,monospace;font-size:12px">` +
      `${(j.error || "未知错误").slice(0, 300)}</div>` +
      `<button class="btn ghost small" style="margin-top:12px" onclick="startRender()">重试渲染</button>`;
    return;
  }
  if (j.stage === "done"){
    clearInterval(timer);
    lastVideoJob = job;
    $("pbar").style.width = "100%"; $("pstage").textContent = "渲染完成";
    $("ppct").textContent = "100% · 成片已生成";
    const box = $("pdoneNew") || $("pdone");
    if (box) box.classList.remove("hide");
    const pl = $("player2") || $("player");
    if (pl) pl.src = "/video/" + job;
    const dl = $("dl2") || $("dl");
    if (dl) dl.href = "/video/" + job;
    addRender(job);
  }
}

function copyTaskId(){
  const t = (document.getElementById("taskId") || {}).textContent || "";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => toast("任务 ID 已复制"), () => toast("复制失败，请手动选择"));
  } else { toast("当前环境不支持自动复制"); }
}

function addRender(job){
  const box = $("renList");
  if (box.querySelector(".sub")) box.innerHTML = "";
  const d = document.createElement("div");
  d.className = "ren";
  d.innerHTML = `<div class="t">最新 · 渲染完成</div><div>${CUR.title || "成片"} · <a href="/video/${job}" download style="color:var(--lime)">下载</a></div>`;
  box.prepend(d);
}

if (location.hash && location.hash !== "#/") route(); else renderHome();
</script>
