<!DOCTYPE html>
<!--
  GetCut 工作台 · 深色工作台（全站一套色，对齐 design-mockups/refined-flow/DESIGN.md）
  设计立场：
    · 页底 #14161B + 一个紫强调色 #B7AAFF（选中 / CTA / 进度）；制作间与作品库同一套变量
    · 左侧悬浮图标栏 + 顶栏中央项目切换胶囊 + 制作间 01→04 步骤条
    · 模板选择器用 Remotion 真实渲染静帧（/templates/），CSS 小样兜底
    · 媒体坐黑色幕布底座；等宽字体标文件名/元数据
  字：数字/字母用思源黑体 Heavy 子集（36KB 自托管 woff2），正文系统黑体
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 0H23A9 9 0 0 1 32 9v9.5L18.5 32H9A9 9 0 0 1 0 23V9a9 9 0 0 1 9-9Z' fill='%23B7AAFF'/%3E%3Cpath d='M10.5 8.6 23.6 15.6 10.5 22.6Z' fill='%2314161B'/%3E%3C/svg%3E">
<title>GetCut · 工作台</title>
<style>
@font-face{
  font-family:"Display";
  src:url("/fonts/display-subset.woff2") format("woff2");
  font-weight:900;font-display:swap;
}
:root{
  --bg:#14161B; --surface:#1C1F26; --surface2:#262B35; --sunken:#242933;
  --ink:#EEF0F5; --ink-2:#AAB3C1; --ink-3:#8F9AAC;
  --line:#333945; --line2:#424957;
  --acc:#B7AAFF; --acc-ink:#191725; --acc-soft:rgba(183,170,255,.10);
  --ok:#5BD08A; --ok-soft:rgba(91,208,138,.12);
  --err:#FF6B6B; --err-soft:rgba(255,107,107,.10);
  --media:#080A0F;
  --r-s:7px; --r-m:11px; --r-l:16px;
  --sh-1:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --sh-2:0 4px 14px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.5);
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  --ease:cubic-bezier(.25,.6,.3,1);
}
*{box-sizing:border-box;margin:0}
::selection{background:var(--acc);color:#fff}
html{scroll-behavior:smooth}
body{color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
             var(--bg);
  background-size:22px 22px,auto;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img,video{display:block}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.display{font-family:"Display",var(--sans);font-weight:900;letter-spacing:-.01em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ── 壳：左侧导航 + 主区 ── */
.shell{display:flex;min-height:100vh}
.side{width:76px;flex:none;margin:14px 0 14px 14px;border-radius:22px;
  background:rgba(28,31,38,.88);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:16px 0 18px;
  position:sticky;top:14px;height:calc(100vh - 28px);backdrop-filter:blur(8px)}
.side .brand{display:flex;align-items:center;padding:0 0 22px}
.side .mark{width:38px;height:38px;flex:none;border-radius:12px;background:var(--acc);color:var(--acc-ink);
  display:grid;place-items:center;font-family:"Display",var(--sans);font-size:19px;position:relative}


.nav{display:flex;flex-direction:column;gap:8px}
.nav a .lb{display:none}
.nav a{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;color:var(--ink-2);transition:background .15s,color .15s}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--acc);color:var(--acc-ink)}
.side .sp{flex:1}
.side .sfoot{display:none}
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(20,22,27,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;height:58px;padding:0 28px;
  display:flex;align-items:center;gap:16px}
.top h1{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top h1 b{font-family:"Display",var(--sans);font-weight:900;margin-right:2px}
.top h1 a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px}
.top h1 a:hover{color:var(--acc)}
.top h1 svg{width:22px;height:22px;flex:none}
/* 顶栏的"当前项目"：一行小字 + 切换入口。之前是两行大药丸，比旁边的按钮还高，抢视线 */
.switcher{display:flex;align-items:center;gap:8px;margin:0 auto;min-width:0;max-width:520px;font-size:12.5px}
.switcher .sw-t{display:flex;align-items:baseline;gap:7px;min-width:0;color:var(--ink-3)}
.switcher .sw-t b{font-weight:650;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.switcher .sw-t small{font-size:12px;white-space:nowrap;color:var(--ink-3)}
.switcher a,.switcher button{color:var(--acc);font-weight:650;font-size:12.5px;flex:none;
  padding:5px 9px;border-radius:7px;white-space:nowrap}
.switcher a:hover,.switcher button:hover{background:var(--acc-soft)}
.switcher .sw-new{background:var(--acc);color:var(--acc-ink)}
.switcher .sw-new:hover{background:#D6FA7E}
.top .sp{flex:1}
.tact{display:flex;align-items:center;gap:10px}
.tact .who{font-size:13px;color:var(--ink-2);max-width:220px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

.mainwrap{max-width:1240px;margin:0 auto;width:100%;padding:24px 28px 96px}
.steps4{display:flex;align-items:center;gap:12px;margin:2px 0 20px}
.steps4 .st{display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:13.5px;
  font-weight:600;white-space:nowrap}
.steps4 .st i{font-style:normal;font-family:"Display",var(--sans);width:27px;height:27px;
  border-radius:50%;display:grid;place-items:center;font-size:12.5px;
  border:1px solid var(--line2);color:var(--ink-3)}
.steps4 .st.on{color:var(--ink)}
.steps4 .st.on i{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.steps4 .st.done{color:var(--ink-2)}
.steps4 .st.done i{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.steps4 em{flex:1;height:1px;background:var(--line2)}
.view{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── 按钮 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  border-radius:11px;min-height:44px;padding:0 22px;font-size:14.5px;font-weight:700;
  background:var(--acc);color:var(--acc-ink);box-shadow:0 4px 16px rgba(183,170,255,.18);
  transition:filter .2s,transform .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 6px 22px rgba(183,170,255,.26)}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--sunken);color:var(--ink-3);box-shadow:none;cursor:default}
.btn[disabled] .spin{border-color:rgba(255,255,255,.2);border-top-color:var(--ink-2)}
.btn.go{min-height:50px;font-size:15.5px;border-radius:12px;box-shadow:0 6px 22px rgba(183,170,255,.22)}
.btn.go:hover{box-shadow:0 10px 30px rgba(183,170,255,.32)}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.line:hover{background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:9px}
.ghost{color:var(--ink-2);font-size:14px;font-weight:600;border-radius:8px;
  padding:8px 12px;transition:background .2s,color .2s}
.ghost:hover{background:var(--sunken);color:var(--ink)}
.ghost.danger:hover{background:var(--err-soft);color:var(--err)}

/* ── 通用 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sec-h .n{color:var(--ink-3);font-size:12.5px}
.sub-h{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 0 8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.run{background:var(--acc-soft);color:var(--acc)}
.tag.err{background:var(--err-soft);color:var(--err)}

/* ── 顶栏任务入口 + 全局任务面板 ── */
.tasks-btn{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:36px;
  padding:0 13px;border-radius:999px;color:var(--ink-2);font-size:13px;font-weight:700;
  box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface)}
.tasks-btn:hover{color:var(--ink)}
.tasks-btn .tbadge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:800;
  display:grid;place-items:center}
.tasks-panel{position:fixed;top:64px;right:20px;z-index:65;width:360px;max-width:calc(100vw - 24px);
  max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);
  border-radius:14px;box-shadow:var(--sh-2);padding:10px}
.tasks-panel .tk-h{font-size:12px;font-weight:800;color:var(--ink-3);padding:6px 8px 10px}
.tasks-panel .tk{display:block;width:100%;text-align:left;border-radius:10px;padding:9px 10px;
  transition:background .15s}
.tasks-panel .tk:hover{background:var(--sunken)}
.tasks-panel .tk-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tasks-panel .tk-t b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tasks-panel .tk-t small{color:var(--ink-3);font-size:11.5px;flex:none}
.tasks-panel .tk-p{display:block;font-family:"Display",var(--sans);font-size:13px;color:var(--acc);
  margin-top:2px}
.tasks-panel .tk-bar{display:block;height:3px;border-radius:2px;background:var(--sunken);
  margin-top:6px;overflow:hidden}
.tasks-panel .tk-bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.tasks-panel .tk-empty{color:var(--ink-3);font-size:13px;padding:8px}
.tasks-panel .tk-e{display:block;color:var(--err);font-size:11.5px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 首页 · 开放式刊头（不是盒子里的 hero） ── */
/* 落地页：第一屏就是"拖进去" */
.hero{text-align:center;padding:22px 0 30px}
.hero h1{font-size:42px;font-weight:750;line-height:1.28;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero .sub{font-size:16.5px;color:var(--ink-2);margin-top:12px;line-height:1.7}
.hero .vg-drop{max-width:720px;margin:28px auto 0;padding:52px 26px;border-color:#5b5390;background:linear-gradient(180deg,#1e2130,#1a1d27)}
.hero .vg-drop:hover{border-color:var(--acc);background:linear-gradient(180deg,#242739,#1c1f2b)}
.hero .hint{color:var(--ink-2);font-size:14px;margin-top:16px}
@media(max-width:760px){.hero h1{font-size:29px}.hero .sub{font-size:15px}.hero .vg-drop{padding:34px 18px}}
.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  flex-wrap:wrap;padding:26px 28px;margin:6px 0 18px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line)}
.homehead h2{font-size:31px;font-weight:900;letter-spacing:-.02em;line-height:1.12}
.homehead .hh-sub{color:var(--ink-2);font-size:13.5px;margin-top:7px}
.homehead .hh-sub b{color:var(--ink);font-weight:800}
.homehead .hh-r{display:flex;gap:10px}

.import{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;text-align:left;
  border-radius:var(--r-m);background:var(--surface);border:1.5px dashed var(--line2);cursor:pointer;
  transition:border-color .2s,background .2s}
.import:hover,.import.over{border-color:var(--acc);background:var(--acc-soft)}
.import .ico{width:38px;height:38px;flex:none;border-radius:10px;background:var(--sunken);
  display:grid;place-items:center;color:var(--ink-2)}
.import b{display:block;font-size:14px}
.import span{color:var(--ink-2);font-size:12.5px}
.import .pick{margin-left:auto}

.rail-sec{margin-top:32px}
.posters{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.posters::-webkit-scrollbar{height:8px}
.poster{flex:none;width:186px;scroll-snap-align:start;text-align:left;position:relative;
  animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.poster .frame{position:relative;display:block;background:var(--media);border-radius:14px;padding:6px;
  box-shadow:var(--sh-1);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.poster:hover .frame{transform:translateY(-4px);box-shadow:var(--sh-2)}
.poster video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:9px;background:#000}
.poster .pdur{position:absolute;right:13px;bottom:13px;background:rgba(0,0,0,.72);color:#fff;
  font-family:"Display",var(--sans);font-size:10.5px;padding:1px 7px;border-radius:6px;font-weight:700;z-index:2}
.poster .pver{position:absolute;left:13px;top:13px;background:var(--acc);color:var(--acc-ink);
  font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:700;z-index:2}
.poster .t{display:block;font-size:12.5px;font-weight:700;margin-top:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .d{display:block;color:var(--ink-3);font-size:11px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:30px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:700;
  color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface);
  transition:all .15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:18px;margin-top:14px}
.pcard{position:relative;text-align:left;border-radius:var(--r-m);overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.pcard .cover{aspect-ratio:3/4;background:var(--media);position:relative;overflow:hidden;cursor:pointer}
.pcard .cover img,.pcard .cover video{width:100%;height:100%;object-fit:cover}
.pcard .cover .letter{position:absolute;inset:0;display:grid;place-items:center;
  color:rgba(247,246,243,.5);font-family:"Display",var(--sans);font-size:44px}
.pcard .cover .cnt{position:absolute;left:10px;top:10px;z-index:3}
.pcard .cover .shade{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(8,10,15,0) 48%,rgba(8,10,15,.78))}
.pcard .cover .ct{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;color:#fff;
  font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 8px rgba(0,0,0,.5)}
.pcard .cover .pplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:grid;place-items:center;opacity:0;transition:opacity .2s}
.pcard:hover .cover .pplay{opacity:1}
.pcard .cover .pplay svg{margin-left:3px}
.pcard .body{padding:10px 13px;cursor:pointer}
.pcard .body>div{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard .pwatch{flex:none;background:var(--acc);color:var(--acc-ink);font-size:12.5px;font-weight:700;
  padding:7px 13px;border-radius:8px}
.pcard .pwatch:hover{filter:brightness(1.06)}
.pcard .ptodo{flex:none;color:var(--ink-3);font-size:12.5px}
.pcard .body .m{color:var(--ink-3);font-size:12px}
.pcard .del{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;
  background:rgba(8,10,15,.6);color:#fff;display:grid;place-items:center;
  opacity:0;transition:opacity .2s,background .2s;backdrop-filter:blur(4px);z-index:4}
.pcard .ren{position:absolute;right:44px;top:8px;width:30px;height:30px;border-radius:8px;
  background:rgba(8,10,15,.6);color:#fff;display:grid;place-items:center;
  opacity:0;transition:opacity .2s,background .2s;backdrop-filter:blur(4px);z-index:4}
.pcard:hover .ren,.pcard .ren:focus-visible,.pcard .del:focus-visible{opacity:1}
.pcard .ren:hover{background:var(--acc);color:var(--acc-ink)}
.pcard:hover .del{opacity:1}
.pcard .del:hover{background:var(--err)}

/* 首次来访的引导卡（空态不稀疏） */
.firstcard{padding:40px 32px;text-align:center}
.firstcard .fc-art{display:flex;justify-content:center;gap:10px;margin-bottom:20px}
.firstcard .fc-art i{width:52px;border-radius:8px;background:var(--media);position:relative;
  box-shadow:var(--sh-1)}
.firstcard .fc-art i:nth-child(1){height:88px;transform:rotate(-5deg) translateY(6px)}
.firstcard .fc-art i:nth-child(2){height:100px}
.firstcard .fc-art i:nth-child(3){height:88px;transform:rotate(5deg) translateY(6px)}
.firstcard .fc-art i::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:0;height:0;border-left:7px solid rgba(247,246,243,.85);
  border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.firstcard b{display:block;font-size:17px;margin-bottom:6px}
.firstcard .fc-sub{color:var(--ink-2);font-size:13.5px}
.firstcard ol{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:22px 0 4px;text-align:left}
.firstcard ol li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);
  max-width:200px;line-height:1.6}
.firstcard ol li i{font-style:normal;font-family:"Display",var(--sans);flex:none;width:22px;height:22px;
  border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:12px;display:grid;place-items:center;margin-top:1px}
.firstcard ol li b{display:block;font-size:13.5px;color:var(--ink);margin:0}

/* ── 项目页（制作间） ── */
.pj{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.crumb h1{font-size:21px;font-weight:900;letter-spacing:-.01em;max-width:24em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colmain{min-width:0;display:flex;flex-direction:column;gap:18px}
.stage-card{padding:18px}
.player-row{display:flex;gap:22px;align-items:flex-start}
.media-frame{background:var(--media);border-radius:18px;padding:8px;flex:none;box-shadow:var(--sh-2)}
.media-frame video{width:376px;max-width:100%;aspect-ratio:9/16;border-radius:10px;background:#000}

/* 待放映的暗幕（空态有设计，不是死黑块） */
.theater{width:390px;max-width:100%;aspect-ratio:9/16;flex:none;border-radius:14px;
  background:var(--media);position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--ink-3);padding:24px;gap:9px}
.theater::before{content:"";position:absolute;inset:0;
  background:radial-gradient(85% 55% at 50% 28%,rgba(183,170,255,.09),transparent 72%)}
.theater::after{content:"";position:absolute;inset:10px;border:1px dashed rgba(183,170,255,.20);
  border-radius:9px}
.theater svg{position:relative;opacity:.75;margin-bottom:2px}
.theater b{position:relative;color:var(--ink);font-size:15px}
.theater span{position:relative;font-size:12px;line-height:1.8}

.stage-side{min-width:0;flex:1;display:flex;flex-direction:column;gap:14px}
.stage-side .stats{color:var(--ink-2);font-size:13px;line-height:1.9}
.hist{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hist .h-item{flex:none;width:58px;text-align:center}
.hist .h-item .frame{background:var(--media);border-radius:8px;padding:3px;
  transition:box-shadow .2s}
.hist .h-item.on .frame{box-shadow:0 0 0 2px var(--acc)}
.hist video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px}
.hist .h-item span{font-size:10px;color:var(--ink-3)}
.hookline{padding:20px 22px;display:flex;flex-direction:column;gap:9px}
.hookline .ln{font-size:20px;font-weight:900;line-height:1.55;letter-spacing:-.01em}
.hookline .hl{background:var(--acc);color:var(--acc-ink);padding:1px 8px;border-radius:5px}
.hookline .cap{color:var(--ink-3);font-size:12px;font-weight:700}
.script-box{max-height:240px;overflow:auto;padding:0 20px 16px;font-size:14.5px;
  line-height:1.95;white-space:pre-wrap;color:var(--ink)}
.assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.assetscard .assets-grid{padding:0 20px}
.assets-grid .a{border-radius:9px;overflow:hidden;background:var(--sunken)}
.assets-grid .a.more{aspect-ratio:4/3;display:grid;place-items:center;cursor:pointer;
  font-family:"Display",var(--sans);font-size:15px;color:var(--ink-2);
  background:var(--sunken);box-shadow:inset 0 0 0 1.5px var(--line2);
  transition:color .15s,box-shadow .15s}
.assets-grid .a.more:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--acc)}
.assets-grid img,.assets-grid video{width:100%;aspect-ratio:4/3;object-fit:cover}
.assets-grid .cap{padding:7px 9px;font-size:11.5px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.disc{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
details.disc>summary{cursor:pointer;padding:13px 18px;font-size:14px;font-weight:700;
  list-style:none;display:flex;align-items:center;justify-content:space-between}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary .n{color:var(--ink-3);font-weight:600;font-size:12px}
details.disc .disc-b{padding:0 18px 16px}

/* ── 右栏：编号步骤流 1 素材 → 2 画面 → 3 声音 → 渲染 ── */
.railcol{position:sticky;top:82px;display:flex;flex-direction:column;gap:16px}
.panel{padding:20px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel .ph h3{font-size:15px;font-weight:800}
.step{display:flex;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:10px}
.step-n{font-family:"Display",var(--sans);font-size:13px;width:23px;height:23px;flex:none;
  border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-top:1px}
.step-b{flex:1;min-width:0}
.gh{font-size:13px;font-weight:800;margin-bottom:9px}
.gh .hint{color:var(--ink-3);font-weight:600;font-size:11.5px}

.bundle-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  background:var(--sunken);font-size:13px}
.bundle-chip .b-ico{width:30px;height:30px;flex:none;border-radius:8px;background:var(--surface);
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.bundle-chip .b-name{min-width:0;flex:1}
.bundle-chip .b-name b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bundle-chip .b-name span{color:var(--ink-3);font-size:11.5px}
.bundle-chip button{color:var(--acc);font-weight:700;font-size:12.5px;flex:none;padding:4px 8px;border-radius:6px}
.bundle-chip button:hover{background:var(--acc-soft)}
.bundle-none{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px;border:1.5px dashed var(--line2);border-radius:10px;font-size:13px;color:var(--ink-2)}

/* 模板小样海报（纯 CSS 画出每个模板的样子） */
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;gap:7px;padding:7px 7px 8px;border-radius:11px;text-align:left;
  position:relative;transition:background .15s,box-shadow .15s;border:1px solid transparent;min-width:0}
.tpl:hover{background:var(--sunken)}
.tpl.on{background:var(--acc-soft);border-color:var(--acc)}
.tpl .mock{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:7px;
  overflow:hidden;box-shadow:var(--sh-1)}
.tpl .mock i{position:absolute;display:block}
.tpl .mock .tpl-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tpl b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:11px;line-height:1.35;min-height:30px;text-align:center}
.tpl .tick{position:absolute;right:5px;top:5px;width:17px;height:17px;border-radius:50%;
  background:var(--acc);color:var(--acc-ink);font-size:10.5px;font-weight:900;display:none;
  place-items:center;line-height:1}
.tpl.on .tick{display:grid}
/* 小样内部形状 */
.mk-v{left:7%;top:6%;width:86%;height:32%;border-radius:4px}
.mk-card{left:6%;right:6%;bottom:6%;height:46%;border-radius:5px}
.mk-band{top:47%;left:12%;width:48%;height:10%;border-radius:2px}
.mk-ln{left:12%;width:70%;height:5%;border-radius:2px}
.mk-ln.s{top:71%;width:52%}
.mk-ln.d{top:58%;width:66%}
.mk-grid{inset:0;border-radius:inherit}
.mk-num{top:12%;left:8%;width:56%;height:9%;border-radius:2px}
.mk-num2{top:26%;left:8%;width:40%;height:7%;border-radius:2px;opacity:.6}
.mk-heavy{top:18%;left:10%;width:62%;height:12%;border-radius:2px}
.mk-heavy.s{top:34%;width:44%}
.mk-chip{top:10%;left:10%;width:34%;height:8%;border-radius:2px}
.mk-cap{bottom:10%;left:10%;right:10%;height:6%;border-radius:2px}
.mk-band.b{top:46%;left:0;right:0;width:auto;height:12%;border-radius:0}
.mk-vig{inset:0;border-radius:inherit}
.mk-seal{top:10%;right:10%;width:26%;aspect-ratio:1;border-radius:50%}
.mk-vidfull{inset:0;border-radius:inherit}
.mk-play{left:50%;top:44%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:rgba(247,246,243,.16)}
.mk-play::after{content:"";position:absolute;left:55%;top:50%;transform:translate(-50%,-50%);
  width:0;height:0;border-left:9px solid rgba(247,246,243,.9);
  border-top:5.5px solid transparent;border-bottom:5.5px solid transparent}
.tpls .mk-ln{top:62%}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:34px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line2);background:var(--surface);
  transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.pill .pv{font-style:normal;font-size:9.5px;opacity:.85;border:1px solid currentColor;
  border-radius:999px;padding:0 6px;line-height:1.5}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.field .t{font-size:13.5px;font-weight:600}
.field .d{color:var(--ink-3);font-size:11.5px;margin-top:1px}
.swt{width:42px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:none;
  transition:background .2s}
.swt i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.swt.on{background:var(--acc)}
.swt.on i{left:21px}
select{background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:8px 10px;font-size:13px;color:var(--ink);max-width:190px}
textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:10px 12px;font-size:13px;resize:vertical;min-height:60px;line-height:1.7;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--acc)}
.note-warn{background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.22);color:#FFD57A;
  font-size:12.5px;border-radius:9px;padding:10px 12px;line-height:1.6;margin-bottom:10px}
.render-cta{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:16px;
  border-top:1px solid var(--line)}
.render-cta .est{color:var(--ink-2);font-size:12px;line-height:1.6}
.render-cta .est b{color:var(--ink)}
.render-cta .btn{flex:1;min-height:50px;font-size:15.5px;border-radius:12px}

/* ── 任务卡 ── */
.task .th{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.task .th .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.task.running .th .dot{background:var(--acc);animation:blink 1.4s var(--ease) infinite}
.task.done .th .dot{background:var(--ok)}
.task.failed .th .dot{background:var(--err)}
@keyframes blink{50%{opacity:.25}}
.task .tpct{margin-left:auto;font-family:"Display",var(--sans);font-size:26px;letter-spacing:0}
.task .tpct.idle{font-size:13px;font-family:var(--sans);color:var(--ink-3);font-weight:700}
.task .pbar{height:5px;border-radius:3px;background:var(--sunken);margin:10px 0 8px;overflow:hidden}
.task .pbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--acc);
  box-shadow:0 0 12px rgba(183,170,255,.35);transition:width .5s var(--ease)}
.task .pdetail{font-size:12.5px;color:var(--ink-2);min-height:20px}
.task .pmeta{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11.5px;margin-top:4px}
.stages8{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.stages8 li{font-size:11px;font-weight:600;color:var(--ink-3);padding:3px 8px;border-radius:999px;
  background:var(--sunken)}
.stages8 li.on{background:var(--acc);color:var(--acc-ink)}
.stages8 li.done{background:var(--ok-soft);color:var(--ok)}
.stills{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.stills .shot{aspect-ratio:9/16;border-radius:8px;background:var(--sunken);overflow:hidden;
  display:grid;place-items:center;color:var(--ink-3);font-size:10px;cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--line)}
.stills img{width:100%;height:100%;object-fit:cover;animation:shotin .5s var(--ease)}
@keyframes shotin{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
.task .terr{margin-top:10px;background:var(--err-soft);color:var(--err);border-radius:8px;
  padding:10px 12px;font-size:12.5px;white-space:pre-wrap;max-height:130px;overflow:auto}
.task .tfoot{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink-3);font-size:11.5px}
.task .tfoot code{font-family:var(--mono)}

/* ── 登录 / 注册 ── */
.auth{min-height:calc(100vh - 220px);display:grid;place-items:center;padding:32px 0}
.auth .card{width:min(420px,100%);padding:36px 34px 30px;box-shadow:var(--sh-1)}
.auth .aw{display:flex;justify-content:center;margin-bottom:16px}
.auth .mark{width:48px;height:48px;display:grid;place-items:center}
.auth .mark svg{width:48px;height:48px}
.auth h1{font-size:20px;font-weight:900;text-align:center;letter-spacing:-.01em}
.auth .sub{text-align:center;color:var(--ink-2);font-size:13px;margin:6px 0 22px;line-height:1.7}
.atabs{display:flex;gap:4px;background:var(--sunken);border-radius:10px;padding:4px;margin-bottom:20px}
.atabs button{flex:1;min-height:36px;border-radius:8px;font-size:14px;font-weight:700;
  color:var(--ink-2);transition:background .15s,color .15s,box-shadow .15s}
.atabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.fld input{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;
  padding:11px 12px;font-size:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.fld input::placeholder{color:var(--ink-3)}
.fld input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fld .d{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.55}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0}
.auth .row2 .btn{flex:none;width:auto;min-height:41px}
.aerr{background:var(--err-soft);color:var(--err);font-size:13px;border-radius:8px;
  padding:9px 12px;margin-bottom:14px;display:none}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);
  margin:2px 0 18px;cursor:pointer}
.remember input{accent-color:var(--acc);width:15px;height:15px}
.auth .btn{width:100%;min-height:46px}
.auth .row2 .btn.sm{width:auto}

/* ── 骨架屏 ── */
.skel{border-radius:12px;background:linear-gradient(90deg,var(--sunken) 25%,#242A24 45%,var(--sunken) 65%);
  background-size:240% 100%;animation:shimmer 1.5s infinite linear}
@keyframes shimmer{to{background-position:-140% 0}}

/* ── 浮层 ── */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);z-index:80;
  background:#1D2333;color:#F3F5FA;padding:11px 20px;font-size:14px;border-radius:10px;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(8,10,15,.66);z-index:70;
  backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;
  width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:var(--sh-2);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
/* ── 定价 / 卡密 ── */
.price-box{width:min(720px,100%)}
.price-tiers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.price-tier{border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;background:var(--surface2)}
.price-tier.hi{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.price-tier .cur{position:absolute;top:12px;right:12px;font-size:11px;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:3px 9px;font-weight:700}
.price-tier h4{font-size:14px;color:var(--ink-2);font-weight:600}
.price-tier .amt{font-size:28px;font-weight:900;letter-spacing:-.02em;margin:2px 0 2px}
.price-tier .amt small{font-size:13px;font-weight:600;color:var(--ink-3)}
.price-tier ul{list-style:none;padding:0;margin:10px 0 0;font-size:12.8px;color:var(--ink-2);line-height:1.9}
.price-tier ul li::before{content:"✓ ";color:var(--acc);font-weight:800}
.price-tier ul li.no{color:var(--ink-3)}
.price-tier ul li.no::before{content:"— ";color:var(--ink-3)}
.price-steps{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.price-steps span{flex:1;min-width:150px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.price-steps b{color:var(--ink)}
.redeem-row{display:flex;gap:8px;margin-top:6px}
.redeem-row input{flex:1}
.tier-chip{border:1px solid var(--line2);border-radius:999px;font-size:11.5px;padding:4px 10px;color:var(--ink-2);cursor:pointer;background:none}
.tier-chip.tier-premium{border-color:var(--acc);color:var(--acc)}
/* ── 顶栏「我的」入口 + 下拉菜单 + 账号设置 ── */
.me-btn{display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:0 12px 0 5px;
  border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);
  cursor:pointer;color:var(--ink);font-size:13px;font-weight:600;transition:box-shadow .15s}
.me-btn:hover{box-shadow:inset 0 0 0 1px #6c62a8}
.me-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:15px;background:var(--acc-soft);flex:none;line-height:1}
.me-btn .who{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-btn .tier-chip{cursor:inherit}
.me-menu{position:fixed;top:62px;right:20px;z-index:70;width:308px;max-width:calc(100vw - 24px);
  background:var(--surface);border:1px solid var(--line2);border-radius:14px;
  box-shadow:var(--sh-2);overflow:hidden;animation:rise .18s var(--ease) both}
.me-head{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}
.me-head .me-av{width:44px;height:44px;font-size:22px}
.me-head b{display:block;font-size:15px}
.me-head small{display:block;color:var(--ink-3);font-size:12px;max-width:210px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.me-benefit{margin:12px 14px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface2)}
.me-benefit .mb-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:12.5px;color:var(--ink-2)}
.me-benefit .mb-row+.mb-row{margin-top:8px}
.me-benefit .mb-note{font-size:12px;color:var(--ink-3);line-height:1.65;margin-top:9px;
  padding-top:9px;border-top:1px dashed var(--line)}
.me-item{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:11px 16px;
  font-size:13.5px;font-weight:600;color:var(--ink-2);border-top:1px solid var(--line)}
.me-item:hover{background:var(--sunken);color:var(--ink)}
.me-item .mi{font-style:normal;width:20px;text-align:center;flex:none}
.me-item .mr{margin-left:auto;color:var(--ink-3);font-size:11.5px;font-weight:400}
.me-item.go{color:var(--acc)}
.me-item.warn{color:var(--err)}
.me-avbig{width:64px;height:64px;font-size:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--acc-soft);margin:0 auto;cursor:pointer;line-height:1}
.av-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.av-grid button{width:44px;height:44px;border-radius:12px;font-size:22px;display:grid;place-items:center;
  background:var(--surface2);border:1.5px solid transparent;cursor:pointer;transition:border-color .12s}
.av-grid button:hover{border-color:var(--line2)}
.av-grid button[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}
.acct-sec{border-top:1px dashed var(--line2);margin-top:16px;padding-top:14px}
.acct-sec h4{font-size:13px;margin:0 0 10px;color:var(--ink-2)}
.acct-sec h4 small{font-weight:400;color:var(--ink-3);margin-left:8px;font-size:11.5px}
.acct-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);
  padding:6px 2px}
.acct-meta b{color:var(--ink);font-weight:600;text-align:right;overflow-wrap:anywhere}
@media(max-width:640px){.me-btn .who{display:none}.me-menu{right:12px}}
/* ── 权益与定价整页（原弹窗已废）── */
.pp-wrap{max-width:760px;margin:0 auto;padding-top:34px}
.pp-wrap h1{font-size:30px;font-weight:900;letter-spacing:-.02em}
.pp .pp-sub{color:var(--ink-2);font-size:14px;margin-top:8px}

/* Production flow: all new selectors are scoped; existing library/auth styles stay intact. */
body.vg-production{background:#14161b;--bg:#14161b;--surface:#1c1f26;--surface2:#262b35;--sunken:#242933;--line:#333945;--line2:#424957;--acc:#b7aaff;--acc-ink:#191725;--acc-soft:#b7aaff16}
body.vg-production .top{background:#14161be8}
.vg-flow,.vg-dialog{--bg:#14161b;--surface:#1c1f26;--surface2:#262b35;--sunken:#242933;--line:#333945;--line2:#424957;--ink:#eef0f5;--ink-2:#aab3c1;--ink-3:#8F9AAC;--acc:#b7aaff;--acc-ink:#191725;--acc-soft:#b7aaff16;color:var(--ink);color-scheme:dark}
.vg-flow{background:var(--bg);padding:0 10px 112px;min-height:calc(100vh - 180px)}

  const s = String(msg == null ? "" : msg).trim();
  const hit = [
    [/not found|不存在或路径不合法|素材包不存在|素材读取失败/i, "这个项目的素材包已经不在服务器上了（可能被清理），重新导入素材包就能再生成。"],
    [/模板.*不存在|不存在，可选/i, "选的画面样式不存在了，去底栏「画面样式」里重新选一个。"],
    [/Failed to fetch|NetworkError|网络|timeout|超时/i, "连不上服务器或请求超时，检查网络后再试一次。"],
  ].find(([re]) => re.test(s));
  if (hit) return hit[1];
  return s || "生成失败，服务端没有给出更多信息。";
}

function renderEstimate(sec){
  const base = Math.max(.5, (sec||0)/60*4.4 + 1.2);
  const lo = Math.max(1, Math.round(base*.9)), hi = Math.round(base*1.25);
  return lo === hi ? "约 " + lo + " 分钟" : lo + "–" + hi + " 分钟";
}
function frameAt(v, t){
  if (!v) return;
  const seek = () => { try { if (v.currentTime < t) v.currentTime = t; } catch (e) {} };
  if (v.readyState >= 1) seek();
  else v.addEventListener("loadedmetadata", seek, {once:true});
}
/* 预览取帧：先快速落到 fallback，元数据就绪后再跳到正片 35% 处，避开片头黑场 */
function previewSeek(v, fallback){
  if (!v) return;
  frameAt(v, fallback);
  v.addEventListener("loadedmetadata", () => {
    frameAt(v, isFinite(v.duration) && v.duration > 4 ? v.duration * .35 : fallback);
  }, {once:true});
}
function kickPlay(v){
  if (!v) return;
  v.muted = true;
  const go = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
  go();
  v.addEventListener("canplay", go, {once:true});
  setTimeout(go, 800);
}
function toast(m){
  let t = $("__t");
  if (!t){ t = document.createElement("div"); t.id = "__t"; t.className = "toast";
    t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = m; t.classList.add("on");
  clearTimeout(t.__h); t.__h = setTimeout(() => t.classList.remove("on"), 2400);
}
function dialog(title, desc, onOk, okText, readonly, extraHTML){

  m.innerHTML = `<div class="box" role="dialog" aria-modal="true">
    <h3>${esc(title)}</h3>${desc ? `<p>${esc(desc)}</p>` : ""}${extraHTML || ""}
    <div class="row">${readonly ? `<button class="btn sm line" data-c>关闭</button>`
      : `<button class="btn sm line" data-c>取消</button>
         <button class="btn sm" data-k style="background:var(--err)">${esc(okText||"删除")}</button>`}</div></div>`;
  m.querySelectorAll("[data-c]").forEach(b => b.onclick = () => m.remove());
  const k = m.querySelector("[data-k]");
  if (k) k.onclick = () => { m.remove(); onOk && onOk(); };
  m.onclick = (e) => { if (e.target === m) m.remove(); };
  document.body.appendChild(m); (k || m.querySelector("[data-c]")).focus();
}

async function paintLandingTry(){
  const host = $("landTopics"), tplHost = $("landTpls"), go = $("tryGo"), note = $("tryNote");
  let topics = [], tpls = [];
  try {
    const d = await (await fetch("/api/try/topics")).json();
    topics = d.topics || []; tpls = d.templates || [];
  } catch (e) {}
  if (!topics.length){ note.textContent = "试玩选题准备中，稍后再来。"; return; }
  host.innerHTML = topics.map(t => `<button class="topic" data-id="${esc(t.id)}" data-tpl="${esc(t.template)}">
    <b>${esc(t.title)}</b><small>${esc(t.subtitle || "")}</small></button>`).join("");
  tplHost.innerHTML = tpls.map(t => `<button class="pill" data-v="${esc(t.id)}">${esc(t.name)}</button>`).join("");
  host.querySelectorAll(".topic").forEach(el => el.onclick = () => {
    host.querySelectorAll(".topic").forEach(x => x.classList.toggle("on", x === el));
    LAND.topic = el.dataset.id;
    if (!LAND.template){                       // 选题自带推荐模板，先替用户选上
      LAND.template = el.dataset.tpl;
      tplHost.querySelectorAll(".pill").forEach(x => x.classList.toggle("on", x.dataset.v === LAND.template));
    }
    go.disabled = false;
  });
  tplHost.querySelectorAll(".pill").forEach(el => el.onclick = () => {
    tplHost.querySelectorAll(".pill").forEach(x => x.classList.toggle("on", x === el));
    LAND.template = el.dataset.v;
  });
  go.onclick = async () => {
    go.disabled = true;
    try {
      if (!LAND.job){
        const r = await fetch("/api/try", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic: LAND.topic, template: LAND.template }) });
        const d = await r.json();
        if (!r.ok){ note.textContent = d.error || "提交失败，稍后再试"; return; }
        LAND.job = d.job;
      }
    } catch (e) { note.textContent = "网络异常，稍后再试"; return; }
    note.textContent = "已提交，正在出片（约 1–3 分钟）……";
    clearInterval(LAND.timer);
    LAND.timer = setInterval(async () => {
      let st;
      try { st = await (await fetch("/api/try/" + LAND.job)).json(); } catch (e) { return; }
      if (st.stage === "done" && st.video){
        clearInterval(LAND.timer);
        note.textContent = "出炉了！带水印的 720p 样片；注册后做你自己的正片不带水印。";
        const done = $("tryDone");
        done.classList.remove("hide"); done.style.display = "flex";
        done.innerHTML = `<video controls playsinline src="${esc(st.video)}"></video>
          <div class="s"><h3>${esc(st.title || "样片出炉")}</h3>
          <p>这是一条 15 秒左右的带水印样片。注册 GetCut，用你自己的文案和素材出正片——
          不带水印、配音音色随便挑，还能一键导出剪映草稿精剪。</p>
          <button class="go" id="tryReg">用我的文案做一条 ▸</button></div>`;
        $("tryReg").onclick = () => { AUTHMODE = "register"; showAuth(); };
        done.scrollIntoView({ behavior: "smooth", block: "center" });
      } else if (st.error){
        clearInterval(LAND.timer);
        note.textContent = "这次没做成：" + (st.error || "") + "，稍后再试一次。";
      } else if (st.queued_pos){
        note.textContent = "排队中，前面还有 " + st.queued_pos + " 个……";
      } else if (st.stage !== "done"){
        note.textContent = "正在出片 · " + (st.progress || 0) + "%（约 1–3 分钟）";
      }
    }, 4000);
  };
}

let lastSentAt = 0;
async function sendCode(emailId = "auEmail", buttonId = "auSend", endpoint = "/api/auth/send-code"){
  const email = $(emailId).value.trim();
  const err = (m) => { const el = $("aerr"); el.style.display = "block"; el.textContent = m; };
  const ok = (m) => { const el = $("aerr"); el.style.display = "block"; el.style.color = "var(--ok)";
    el.style.background = "var(--ok-soft)"; el.textContent = m; };
  const reset = () => { const el = $("aerr"); el.style.color = ""; el.style.background = ""; };
  if (!email) return err("请先输入邮箱");
  const btn = $(buttonId);
  btn.disabled = true;
  try {
    const r = await api(endpoint, { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email }) });
    reset(); ok(r.message || "验证码已发送");
    lastSentAt = Date.now();
    let left = 60;
    btn.textContent = left + " 秒后重发";
    clearInterval(codeTimer);
    codeTimer = setInterval(() => {
      left -= 1;
      if (left <= 0){ clearInterval(codeTimer); btn.disabled = false; btn.textContent = "获取验证码"; }
      else btn.textContent = left + " 秒后重发";
    }, 1000);
  } catch (e) {
    btn.disabled = false;
    err(e.message || "发送失败");
  }
}
async function submitRegister(){
  const err = (m) => { const el = $("aerr"); el.style.display = "block";
    el.style.color = ""; el.style.background = ""; el.textContent = m; };
  const email = $("auEmail").value.trim();
  const code = $("auCode").value.trim();
  const pass = $("auPass").value;
  if (!email) return err("请输入邮箱");
  if (!/^\d{6}$/.test(code)) return err("请输入 6 位验证码");
  if (pass.length < 8) return err("密码至少 8 位");
  if (pass !== $("auPass2").value) return err("两次输入的密码不一样");
  const btn = $("auGo");
  btn.disabled = true; btn.textContent = "注册中…";
  try {
    const r = await api("/api/auth/register", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email, code, password: pass, remember: true }) });
    ME = await api("/api/me");
    paintAccount();
    await loadTemplates();
    route(true);
  } catch (e) {
    btn.disabled = false; btn.textContent = "注册并进入";
    err(e.message || "注册失败");
  }
}

let lock = null;
const setHash = (h) => { lock = h; if (location.hash !== h) location.hash = h; };
async function route(force){
  if (!force && location.hash === lock) return;
  lock = location.hash;
  leaveFlow();
  const epoch = viewEpoch;
  const m = location.hash.match(/#\/project\/([a-f0-9]+)(?:\/(import|confirm|generate|export))?/);
  if (m){
    try {
      const ps = await api("/api/projects");
      if (epoch !== viewEpoch) return;
      const p = ps.find(x => x.project_id === m[1]);
      if (p){ CUR = p; return renderProject(m[2]); }
    } catch (e) { if (epoch !== viewEpoch) return; if (e.auth) return showAuth(); }
  }
  if (epoch !== viewEpoch) return;
  if (location.hash === "#/pricing") return openPricing();   // 直达/返回都能落到权益页
  CUR = null;
  renderHome();
}
function goHome(){ CUR = null; setHash("#/"); renderHome(); }

    if (r.file) out.push({id:r.id, ts:r.ts, title:p.title, project:p.project_id});
  }));
  return out;
}

function poster(r){

let HOME_PS = [], HOME_RS = [], HOME_FILTER = "all";
function renameProject(p){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="rnTitle">
    <h3 id="rnTitle">重命名项目</h3><p>只改列表里显示的名字，不动素材包和已有的成片。</p>
    <input type="text" id="rnName" maxlength="40" value="${esc(p.title || "")}" aria-label="项目名">
    <div class="row"><button class="btn sm line" data-c>取消</button><button class="btn sm" data-k>保存</button></div></div>`;
  const inp = m.querySelector("#rnName");
  const close = () => m.remove();
  const save = async () => {
    const title = (inp.value || "").trim().slice(0, 40);
    if (!title){ inp.setAttribute("aria-invalid","true"); inp.focus(); toast("项目名不能为空"); return; }
    const btn = m.querySelector("[data-k]"); btn.disabled = true; btn.textContent = "保存中…";
    try{
      // 复用 mount：它按项目归属校验权限，且 title/bundle 一起写；不为改名单开接口
      await api(`/api/projects/${p.project_id}/mount`, {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({bundle: p.bundle ?? null, title})});
      p.title = title;
      const hit = HOME_PS.find(x => x.project_id === p.project_id); if (hit) hit.title = title;
      if (CUR && CUR.project_id === p.project_id) CUR.title = title;
      close(); drawGrid(); toast("已改名为「" + title + "」");
    }catch(err){
      btn.disabled = false; btn.textContent = "保存";
      toast("改名失败：" + humanError(err.message));
    }
  };
  m.querySelector("[data-c]").onclick = close;
  m.querySelector("[data-k]").onclick = save;
  m.onclick = (e) => { if (e.target === m) close(); };
  m.addEventListener("keydown", (e) => {
    if (e.key === "Escape") close();
    if (e.key === "Enter"){ e.preventDefault(); save(); }
  });
  document.body.appendChild(m); inp.focus(); inp.select();
}
function drawGrid(){
  const g = $("pgrid"); if (!g) return;
  g.innerHTML = "";
  HOME_PS.filter(p => {
    if (HOME_FILTER === "done") return (p.renders_count || 0) > 0;
    if (HOME_FILTER === "todo") return !(p.renders_count > 0);
    return true;
  }).forEach(p => g.appendChild(pcard(p)));
}
function pcard(p){

function wireImport(drop, input, onFile){
  if (!drop) return;
  input.onchange = (e) => onFile(e.target.files[0]);
  drop.onclick = () => input.click();
  drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); input.click(); } };
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) onFile(f);
  });
}
async function heroStart(file){

function uploadZip(file, onProgress){
  // 用 XHR 才能拿到上传进度；fetch 没有进度事件，用户会以为卡死了
  const fd = new FormData(); fd.append("file", file);
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.setRequestHeader("x-auth-token", TOK());
    xhr.upload.onprogress = (e) => {
      if (onProgress && e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100));
    };
    xhr.onload = () => {
      let d = {}; try { d = JSON.parse(xhr.responseText || "{}"); } catch (err) { d = {}; }
      if (xhr.status >= 200 && xhr.status < 300 && d && d.name) resolve(d);
      else { const err = new Error((d && d.error) || ("HTTP " + xhr.status)); err.data = d; reject(err); }
    };
    xhr.onerror = () => reject(new Error("网络中断，上传失败"));
    xhr.send(fd);
  });
}
/* 拖拽区里的上传进度：一条动着的条 + 百分比 */
function dropBar(drop, pct, label){
  if (!drop) return;
  let bar = drop.querySelector(".dropbar");
  if (!bar){ bar = document.createElement("span"); bar.className = "dropbar"; bar.innerHTML = "<i></i>"; drop.appendChild(bar); }
  bar.querySelector("i").style.width = Math.max(6, Math.min(100, pct)) + "%";
  const b = drop.querySelector("b"); if (b && label) b.textContent = label;
}
function dropReset(drop, text){
  if (!drop) return;
  const bar = drop.querySelector(".dropbar"); if (bar) bar.remove();
  const b = drop.querySelector("b"); if (b) b.textContent = text;
}

  d.querySelectorAll("[data-close]").forEach(el => el.onclick = closeFlowDialog);

function updateFlowJobView(force){
  if (!FLOW || FLOW.view !== "generate" || !$("vg-bigbar")) return;
  const j = FLOW.status || {};
  const terminal = ["failed","unknown"].includes(j.stage);
  const done = j.stage === "done";
  const queued = j.stage === "queued";
  const pct = done ? 100 : Math.max(0, Math.min(99, Number(j.progress) || 0));
  const s8 = Math.max(1, Math.min(8, Number(j.stage8) || 1));
  // 一句话说清"现在在干嘛"；环进度本身在条上写清"第几步、哪一环"
  const line = queued ? (j.queued_pos ? `排队中 · 前面还有 ${j.queued_pos} 个任务` : "排队中，马上轮到它")
    : done ? "可以看了，也可以下载或导出剪映草稿。"
    : terminal ? humanError(j.error)
    : (j.detail || "正在连接任务状态…");
  const bar = $("vg-bigbar"), fill = $("vg-fill");
  if (fill) fill.style.width = (queued ? 4 : pct) + "%";
  bar.setAttribute("aria-valuenow", String(pct));
  $("vg-pct").textContent = queued ? "排队中" : pct + "%";
  const label = queued ? "排队中" : done ? "全片完成" : terminal ? "已停止" : (STAGE8[s8-1] || "处理中");
  $("vg-step").innerHTML = `${queued || terminal ? "" : `<span class="vg-stepn">第 ${s8}/8 步 · </span>`}${esc(label)}`;
  $("vg-elapsed").textContent = j.elapsed != null && !done ? "已用 " + mmss(j.elapsed) : "";
  $("vg-bigstage").textContent = done ? "成片好了。" : terminal ? "这一版没做成" : "正在生成你的视频";
  $("vg-bigline").textContent = line;
  $("vg-bigline").className = (j.stage === "failed" || j.stage === "unknown") ? "vg-bigline vg-error" : "vg-bigline";
  bar.classList.toggle("vg-donebar", done);

  // 结果区：完成后就地给出成片（用户不用再找入口）
  const key = JSON.stringify([done, FLOW.jobId, j.stage]);
  if (!force && FLOW.artifactKey === key) return;
  FLOW.artifactKey = key;
  const rs = flowRenders();
  const last = rs.length ? rs[rs.length - 1] : null;
  if (done && last){
    $("vg-result").innerHTML = `<div class="vg-done">
      <video class="vg-export-player" id="mainPlayer" controls playsinline src="${esc(vid(last.id))}"></video>
      <div class="vg-doneactions"><a class="btn go" id="dlBtn" href="${esc(vid(last.id))}" download>下载 MP4</a>
      <button class="btn line" id="vg-to-export">历史版本与剪映草稿</button></div>
      <p class="vg-notes" style="margin-top:14px">想再改一版？返回上一步调整后重新生成，旧版本不会被覆盖。</p></div>`;
    $("vg-to-export").onclick = () => setFlowView("export");
  } else if (terminal && !done){
    $("vg-result").innerHTML = `<div class="vg-doneactions" style="margin-top:18px"><button class="btn line" id="vg-back-confirm">返回确认，再生成一版</button></div>`;
    $("vg-back-confirm").onclick = () => setFlowView("confirm");
  } else {
    $("vg-result").innerHTML = "";
  }
}

          ${br.has_logo ? `<button class="btn sm line" id="bkLogoDel">移除</button>` : ""}
          <span id="bkLogoMsg" style="font-size:12px;color:var(--ink-2)"></span>
        </div>
      </div>
    </div>
    <div class="acct-sec">
      <h4>我的声音<small>录 30 秒，之后配音就用你的声音</small></h4>
      ${vc && vc.has_voice ? `<p style="font-size:12.5px;color:var(--ok);margin:0 0 8px">已克隆${vc.clone && vc.clone.created ? " · " + esc(vc.clone.created) : ""}，重录可覆盖</p>` : ""}
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn sm" id="bkRec">● 开始录音</button>
        <span id="bkRecTime" style="font-size:12.5px;color:var(--ink-2)"></span>
        <audio id="bkRecPlay" controls style="height:30px" class="hide"></audio>
        <button class="btn sm" id="bkRecUp" disabled>用这段克隆我的声音</button>
      </div>
      <label style="display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink-2);margin-top:10px">
        <input type="checkbox" id="bkConsent">
        <span>我确认录制的是<b>我本人</b>的声音，并同意 GetCut 用它合成我账号下的视频配音。成片按规范标注 AI 配音。</span></label>
      <p id="bkRecMsg" style="font-size:12.5px;margin:8px 0 0;min-height:1em"></p>

        placeholder="留空 = 显示 Powered by GetCut" style="margin-top:2px">

    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn sm line" id="bkClose">关闭</button></div>
  </div>`;
  let mediaRec = null;
  const stopRec = () => { if (mediaRec && mediaRec.state === "recording") mediaRec.stop(); };
  const close = () => { stopRec(); m.remove(); };
  m.querySelector("#bkClose").onclick = close;
  m.onclick = (e) => { if (e.target === m){ stopRec(); m.remove(); } };
  // Logo：传完即存，就地刷新预览
  const logoMsg = m.querySelector("#bkLogoMsg");
  const file = m.querySelector("#bkLogo");
  if (file) file.onchange = async () => {
    if (!file.files || !file.files[0]) return;
    logoMsg.textContent = "上传中…";

    try { await api("/api/brand/logo", {method: "POST", body: fd});

      setTimeout(() => { m.remove(); openBrandKit(); }, 600);
    } catch (e) { logoMsg.textContent = e.message || "上传失败"; }
  };
  const del = m.querySelector("#bkLogoDel");
  if (del) del.onclick = async () => {
    try { await api("/api/brand/logo", {method: "DELETE"}); m.remove(); openBrandKit(); }
    catch (e) { toast(e.message || "移除失败"); }
  };
  // 文字水印：改完就走（失焦/回车保存）
  const wm = m.querySelector("#bkWm"), wmMsg = m.querySelector("#bkWmMsg");
  const saveWm = async () => {
    const v = wm.value.trim();
    try {
      await api("/api/brand", {method: "PUT", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({watermark_text: v})});
      wmMsg.textContent = v ? "已保存，出片右上角就是它" : "已保存，水印显示 Powered by GetCut";
    } catch (e) { wmMsg.textContent = e.message || "保存失败"; }
  };
  wm.onchange = saveWm;
  // ---- 我的声音：MediaRecorder 录音 + 克隆 ----
  let recChunks = [], recTimer = null, recBlob = null;
  const recBtn = m.querySelector("#bkRec"), recTime = m.querySelector("#bkRecTime"),
        recPlay = m.querySelector("#bkRecPlay"), recUp = m.querySelector("#bkRecUp"),
        recMsg = m.querySelector("#bkRecMsg"), consent = m.querySelector("#bkConsent");
  consent.onchange = () => { recUp.disabled = !(consent.checked && recBlob); };
  recBtn.onclick = () => {
    if (mediaRec && mediaRec.state === "recording"){ mediaRec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder){ recMsg.textContent = "这个浏览器不支持录音，换 Chrome/Edge 试试"; return; }
    navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
      mediaRec = new MediaRecorder(stream);
      recChunks = [];
      mediaRec.ondataavailable = e => recChunks.push(e.data);
      mediaRec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        clearInterval(recTimer);
        recBtn.textContent = "● 重新录";
        recBlob = new Blob(recChunks, {type: mediaRec.mimeType || "audio/webm"});
        recPlay.src = URL.createObjectURL(recBlob);
        recPlay.classList.remove("hide");
        recUp.disabled = !consent.checked;
        recMsg.textContent = "录好了，先听一听，满意就点右边的按钮";
      };
      mediaRec.start();
      const t0 = Date.now();
      recTime.textContent = "0:00";
      recTimer = setInterval(() => {
        const sec = Math.floor((Date.now() - t0) / 1000);
        recTime.textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
        if (sec >= 45) mediaRec.stop();   // 45 秒封顶，30 秒左右效果最好
      }, 250);
      recBtn.textContent = "■ 停止";
      recMsg.textContent = "在安静的地方，用平时说话的语气读一段稿子，30 秒左右";
    }).catch(() => { recMsg.textContent = "麦克风没权限，到浏览器地址栏允许一下"; });
  };
  recUp.onclick = async () => {
    if (!recBlob) return;
    recUp.disabled = true; recMsg.textContent = "上传并克隆中，约十几秒…";
    const fd = new FormData();
    fd.append("file", recBlob, "recording.webm");
    try {
      await api("/api/voice-clone", {method: "POST", body: fd});
      recMsg.style.color = "var(--acc)";
      recMsg.textContent = "克隆成功！音色列表里选「我的声音」就能用你的声音配音";
      toast("我的声音已就绪");
    } catch (e) {
      recUp.disabled = !consent.checked; recMsg.style.color = "";
      recMsg.textContent = e.message || "克隆失败";
    }
  };
  document.body.appendChild(m);
}

/* Task lifecycle: no overlapping timer polls; every response belongs to a project/job epoch. */
let JD = null;
function newJD(){ return {lastPct:-1,lastChange:Date.now(),localT0:Date.now(),samples:[],firstPoll:true}; }
async function startRender(b){
  if (!CUR || BUILD_PENDING.has(CUR.project_id) || flowBusy()) return;
  if (!CUR.bundle || !b || !String(b.script || "").trim()){ toast("请先导入并确认完整文案"); return; }
  if (!FLOW || FLOW.view !== "confirm" || b !== CURB) return;
  const pid = CUR.project_id, epoch = viewEpoch, bundle = CUR.bundle;
  const payload = {project_id:pid,bundle,voice:CFG.voice,bgm:CFG.bgm,
    sfx:CFG.sfxMode !== "off",sfxMode:CFG.sfxMode,subtitles:true,
    sources:CFG.sources !== false, watermark:CFG.watermark !== false, format:CFG.format,
    useLlm:true};
  BUILD_PENDING.add(pid); paintFlowFooter();
  try {
    const r = await api("/api/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if (!r || !r.job) throw new Error((r && r.error) || "启动失败");
    // Even after navigation, remember the job under its originating project, never the new one.
    localStorage.setItem("vg.job." + pid,r.job);
    if (!flowHere(epoch,pid) || !FLOW) return;
    job = lastJob = r.job; FLOW.jobId = r.job;
    FLOW.status = {stage:"queued",stage8:1,progress:0,detail:"已提交，等待后台开始"};
    FLOW.selectedStage = null; FLOW.view = "generate"; FLOW.artifactKey = null;
    setHash("#/project/" + pid + "/generate"); paintFlow(); startPoll(); toast("已在后台开始生成，你可以继续做别的项目");
  } catch(e){
    if (!flowHere(epoch,pid)) return;
    if (e.auth) return showAuth();
    toast("启动失败：" + humanError(e.message));
    // A different browser may have submitted this project; restore its real job on conflict.
    if (e.data && /已有任务/.test(e.message)) renderProject();
  } finally { BUILD_PENDING.delete(pid); if (flowHere(epoch,pid)) paintFlowFooter(); }
}
function startPoll(){
  stopPoll(); JD = newJD();
  const token = pollEpoch, jid = job, pid = CUR && CUR.project_id;
  const tick = async () => {
    await pollJob(jid);
    if (token === pollEpoch && CUR && CUR.project_id === pid && job === jid)
      timer = setTimeout(tick,1500);
  };
  tick();
}
async function pollJob(jid){
  const epoch = viewEpoch, token = pollEpoch, pid = CUR && CUR.project_id;
  if (!pid || !jid || job !== jid || !FLOW || FLOW.jobId !== jid) return;
  const current = () => flowHere(epoch,pid) && pollEpoch === token && job === jid && FLOW && FLOW.jobId === jid;
  let j;
  try { j = await api("/api/job/" + encodeURIComponent(jid)); }
  catch(e){
    if (!current()) return;
    if (e.auth) return showAuth();
    FLOW.pollError = "状态连接暂时中断，将继续重试。不能据此判断任务已停止。";
    updateFlowJobView(); return;
  }
  if (!current() || j.project_id && j.project_id !== pid) return;
  FLOW.pollError = ""; FLOW.status = j;
  if (!JD) JD = newJD();
  if (j.progress !== JD.lastPct){ JD.lastPct = j.progress; JD.lastChange = Date.now(); }
  updateFlowJobView();
  if (["done","failed","unknown"].includes(j.stage)){
    stopPoll();
    if (localStorage.getItem("vg.job." + pid) === jid) localStorage.removeItem("vg.job." + pid);
    if (j.stage === "unknown") FLOW.status.detail = "服务重启或任务记录已清理。请查看本项目历史成片，或返回确认重新生成。";
    updateFlowJobView();
    if (j.stage === "done" || j.stage === "unknown") await refreshStageCard();
    if (!flowHere(epoch,pid) || job !== jid) return;
    // Keep the selected review stage. Completion exposes export, never inserts a player here.
    paintFlowFooter();
    if ($("vg-change")) $("vg-change").disabled = false;
    if ($("vg-drop")) $("vg-drop").disabled = false;
    if ($("vg-bundles")) $("vg-bundles").disabled = false;
    document.querySelectorAll('[data-flow="export"]').forEach(el => { el.disabled = !flowRenders().length && j.stage !== "done"; });
  }
}

/* 唤起本地导入助手。装了的机器浏览器会失焦弹"打开 GetCut 助手？"；
   没装的机器唤起没任何反应，2.6 秒页面还在前台 → 弹首次安装引导。 */
function wakeGetCutAssistant(pullPath, rid) {
  const src = location.origin + pullPath;
  let woke = false;
  const off = () => { woke = true; };
  window.addEventListener("blur", off);
  document.addEventListener("visibilitychange", off);
  location.href = "getcut://import?src=" + encodeURIComponent(src);
  setTimeout(() => {
    window.removeEventListener("blur", off);
    document.removeEventListener("visibilitychange", off);
    if (!woke) openJyAssist(rid);
  }, 2600);
}

/* 下载导入包（不想装助手的退路）：带转圈，避免点链接干等 */
async function downloadDraft(pid, rid) {
  const res = await fetch(qs(`/api/projects/${pid}/renders/${rid}/jianying-draft`));
  if (!res.ok) throw new Error("打包失败");
  const blob = await res.blob();
  const cd = res.headers.get("Content-Disposition") || "";
  const m = /filename\*=UTF-8''([^;]+)/.exec(cd);
  const name = m ? decodeURIComponent(m[1]) : "jianying-draft.zip";
  const url = URL.createObjectURL(blob);
  const t = document.createElement("a");
  t.href = url; t.download = name;
  document.body.appendChild(t); t.click(); t.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

      : (st.building ? "草稿正在后台打包（约 1 分钟），先下载 MP4 也行。" : "点一下开始打包草稿（约 1–2 分钟）。");
  } catch (e) { /* 状态拿不到就不提示 */ }
}

boot();
</script>
