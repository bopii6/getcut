<!DOCTYPE html>
<!--
  videogen 工作台 · 亮色纸感工作台
  设计立场：
    · 工具，不是落地页 —— 打开就是项目台，没有营销 Hero
    · 纸感亮色界面，与成片（纸卡编辑风）同一种气质；媒体一律坐在黑色底座上
    · 一个砖红强调色（#A44231，与成片模板同源），只用于「进行中 / 选中」
    · 项目页左右两栏：左边成片与内容，右边常驻配置 + 渲染按钮 + 实时进度
  字：展示字「思源黑体 Heavy」子集（自托管，与成片同款），正文系统黑体
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>videogen · 工作台</title>
<style>
@font-face{
  font-family:"Display";
  src:url("/fonts/display-900.ttf") format("truetype");
  font-weight:900;font-display:swap;
}
:root{
  --paper:#F6F5F2; --surface:#FFFFFF; --sunken:#EFEDE8;
  --ink:#211E1A; --ink-2:#6D6860; --ink-3:#A19A8F;
  --line:#E7E4DD; --line-2:#D9D5CC;
  --accent:#A44231; --accent-deep:#8A3526; --accent-soft:#F5E7E2;
  --ok:#3D7A50; --ok-soft:#E7F0E9;
  --err:#B3261E; --err-soft:#F8E9E7;
  --media:#131110;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --sh-1:0 1px 2px rgba(33,30,26,.05), 0 3px 14px rgba(33,30,26,.05);
  --sh-2:0 2px 8px rgba(33,30,26,.08), 0 18px 44px rgba(33,30,26,.12);
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  --ease:cubic-bezier(.25,.6,.3,1);
}
*{box-sizing:border-box;margin:0}
::selection{background:var(--accent);color:#fff}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img,video{display:block}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.display{font-family:"Display",var(--sans);font-weight:900;letter-spacing:-.02em}

/* ── 顶栏 ── */
.top{position:sticky;top:0;z-index:30;background:rgba(246,245,242,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1280px;margin:0 auto;height:60px;padding:0 24px;
  display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-family:"Display",var(--sans);font-size:14px}
.brand small{color:var(--ink-3);font-weight:600;font-size:12px;margin-top:2px}
.top .sp{flex:1}
.tact{display:flex;align-items:center;gap:10px}

.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 96px}
.view{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── 按钮 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:8px;min-height:44px;padding:0 22px;font-size:15px;font-weight:700;
  background:var(--ink);color:#fff;transition:background .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{background:#37322C}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--sunken);color:var(--ink-3);cursor:default}
.btn.accent{background:var(--accent)}
.btn.accent:hover{background:var(--accent-deep)}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.line:hover{background:var(--sunken)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:7px}
.ghost{color:var(--ink-2);font-size:14px;font-weight:600;border-radius:7px;
  padding:8px 12px;transition:background .2s,color .2s}
.ghost:hover{background:var(--sunken);color:var(--ink)}
.ghost.danger:hover{background:var(--err-soft);color:var(--err)}

/* ── 通用组件 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec-h .n{color:var(--ink-3);font-size:13px}
.sub-h{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 8px}
.kbd{font-family:var(--mono);font-size:12px;background:var(--sunken);
  border-radius:5px;padding:2px 7px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.run{background:var(--accent-soft);color:var(--accent-deep)}
.tag.err{background:var(--err-soft);color:var(--err)}

/* ── 首页 ── */
.import{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;border-radius:var(--r-l);
  background:var(--surface);border:1.5px dashed var(--line-2);cursor:pointer;
  transition:border-color .2s,background .2s}
.import:hover,.import.over{border-color:var(--accent);background:var(--accent-soft)}
.import .ico{width:42px;height:42px;flex:none;border-radius:10px;background:var(--sunken);
  display:grid;place-items:center}
.import b{display:block;font-size:15px}
.import span{color:var(--ink-2);font-size:13px}
.import .pick{margin-left:auto}
.rail-sec{margin-top:32px}
.posters{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;
  scroll-snap-type:x proximity}
.posters::-webkit-scrollbar{height:8px}
.posters::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.poster{flex:none;width:118px;scroll-snap-align:start;text-align:left}
.poster .frame{background:var(--media);border-radius:10px;padding:5px;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.poster:hover .frame{transform:translateY(-3px);box-shadow:var(--sh-2)}
.poster video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;background:#000}
.poster .t{display:block;font-size:12px;font-weight:600;margin-top:7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .d{display:block;color:var(--ink-3);font-size:11px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px;margin-top:14px}
.pcard{position:relative;text-align:left;border-radius:var(--r-m);overflow:hidden;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.pcard .cover{aspect-ratio:3/4;background:var(--media);position:relative;overflow:hidden}
.pcard .cover img,.pcard .cover video{width:100%;height:100%;object-fit:cover;opacity:.94}
.pcard .cover .letter{position:absolute;inset:0;display:grid;place-items:center;
  color:rgba(244,241,236,.4);font-family:"Display",var(--sans);font-size:40px}
.pcard .cover .cnt{position:absolute;left:10px;top:10px}
.pcard .body{padding:12px 14px}
.pcard .t{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .m{color:var(--ink-3);font-size:12px;margin-top:3px}
.pcard .del{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;
  background:rgba(19,17,16,.55);color:#fff;display:grid;place-items:center;
  opacity:0;transition:opacity .2s,background .2s;backdrop-filter:blur(4px)}
.pcard:hover .del{opacity:1}
.pcard .del:hover{background:var(--err)}
.blank{padding:56px 24px;text-align:center;color:var(--ink-2)}
.blank b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}

/* ── 项目页 ── */
.pj{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:24px;align-items:start}
.pj .crumb{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pj .crumb h1{font-size:20px;font-weight:800;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24em}
.colmain{min-width:0;display:flex;flex-direction:column;gap:20px}

/* 成片播放 */
.stage-card{padding:18px}
.player-row{display:flex;gap:20px;align-items:flex-start}
.media-frame{background:var(--media);border-radius:12px;padding:7px;flex:none}
.media-frame video{width:262px;max-width:100%;aspect-ratio:9/16;border-radius:7px;background:#000}
.stage-side{min-width:0;flex:1;display:flex;flex-direction:column;gap:12px}
.stage-side .stats{color:var(--ink-2);font-size:13px;line-height:1.9}
.hist{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hist .h-item{flex:none;width:56px;text-align:center}
.hist .h-item .frame{background:var(--media);border-radius:8px;padding:3px;transition:box-shadow .2s}
.hist .h-item.on .frame{box-shadow:0 0 0 2px var(--accent)}
.hist video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px}
.hist .h-item span{font-size:10px;color:var(--ink-3)}

/* 内容 */
.hookline{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.hookline .ln{font-size:21px;font-weight:800;line-height:1.55;letter-spacing:-.01em}
.hookline .hl{background:var(--accent);color:#fff;padding:1px 7px;border-radius:4px}
.hookline .cap{color:var(--ink-3);font-size:12px;font-weight:600}
.script-box{max-height:260px;overflow:auto;padding:16px 20px;font-size:15px;
  line-height:1.95;white-space:pre-wrap;color:var(--ink)}
.assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.assets-grid .a{border-radius:8px;overflow:hidden;background:var(--sunken)}
.assets-grid img,.assets-grid video{width:100%;aspect-ratio:4/3;object-fit:cover}
.assets-grid .cap{padding:7px 9px;font-size:11.5px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.disc{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
details.disc>summary{cursor:pointer;padding:13px 18px;font-size:14px;font-weight:700;
  list-style:none;display:flex;align-items:center;justify-content:space-between;color:var(--ink)}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary .n{color:var(--ink-3);font-weight:600;font-size:12px}
details.disc .disc-b{padding:0 18px 16px}

/* 右栏 */
.rail{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.panel{padding:18px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel .ph h3{font-size:14px;font-weight:800}
.bundle-chip{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;
  background:var(--sunken);font-size:13px}
.bundle-chip .b-ico{width:30px;height:30px;flex:none;border-radius:8px;background:var(--surface);
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.bundle-chip .b-name{min-width:0;flex:1}
.bundle-chip .b-name b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bundle-chip .b-name span{color:var(--ink-3);font-size:11.5px}
.bundle-chip button{color:var(--accent-deep);font-weight:700;font-size:12.5px;flex:none;padding:4px 6px;border-radius:6px}
.bundle-chip button:hover{background:var(--accent-soft)}
.bundle-none{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px;border:1.5px dashed var(--line-2);border-radius:10px;font-size:13px;color:var(--ink-2)}
.grp{padding:14px 0;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:0}
.grp .gh{font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:9px}
.tpls{display:flex;flex-direction:column;gap:6px}
.tpl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left;
  transition:background .15s,box-shadow .15s}
.tpl:hover{background:var(--sunken)}
.tpl.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tpl .sw{width:30px;height:42px;flex:none;border-radius:6px;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tpl .sw i{position:absolute;left:4px;bottom:4px;width:9px;height:9px;border-radius:50%}
.tpl b{display:block;font-size:13.5px;line-height:1.35}
.tpl small{display:block;color:var(--ink-2);font-size:11.5px;line-height:1.45}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:34px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface);
  transition:all .15s}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;box-shadow:none}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.field .t{font-size:13.5px;font-weight:600}
.field .d{color:var(--ink-3);font-size:11.5px;margin-top:1px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;flex:none;
  transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--ok)}
.sw.on i{left:21px}
select{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  padding:8px 10px;font-size:13px;max-width:190px}
textarea{width:100%;background:var(--sunken);border:1px solid transparent;border-radius:8px;
  padding:10px 12px;font-size:13px;resize:vertical;min-height:60px;line-height:1.7}
textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.note-warn{background:#FBF3E4;border:1px solid #EAD9B8;color:#7A5A10;font-size:12.5px;
  border-radius:9px;padding:10px 12px;line-height:1.6}
.render-cta{display:flex;align-items:center;gap:12px}
.render-cta .est{color:var(--ink-2);font-size:12px;line-height:1.5}
.render-cta .est b{color:var(--ink)}
.render-cta .btn{flex:1;min-height:48px;font-size:15px}

/* 任务卡 */
.task .th{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.task .th .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.task.running .th .dot{background:var(--accent);animation:blink 1.4s var(--ease) infinite}
.task.done .th .dot{background:var(--ok)}
.task.failed .th .dot{background:var(--err)}
@keyframes blink{50%{opacity:.25}}
.task .tpct{margin-left:auto;font-family:"Display",var(--sans);font-size:26px;letter-spacing:0}
.task .pbar{height:5px;border-radius:3px;background:var(--sunken);margin:10px 0 8px;overflow:hidden}
.task .pbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);
  transition:width .5s var(--ease)}
.task .pdetail{font-size:12.5px;color:var(--ink-2);min-height:20px}
.task .pmeta{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11.5px;margin-top:4px}
.stages8{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.stages8 li{font-size:11px;font-weight:600;color:var(--ink-3);padding:3px 8px;border-radius:999px;
  background:var(--sunken)}
.stages8 li.on{background:var(--accent);color:#fff}
.stages8 li.done{background:var(--ok-soft);color:var(--ok)}
.stills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stills .shot{aspect-ratio:9/16;border-radius:6px;background:var(--sunken);overflow:hidden;
  display:grid;place-items:center;color:var(--ink-3);font-size:10px;cursor:pointer}
.stills img{width:100%;height:100%;object-fit:cover;animation:shotin .5s var(--ease)}
@keyframes shotin{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
.task .terr{margin-top:10px;background:var(--err-soft);color:var(--err);border-radius:8px;
  padding:10px 12px;font-size:12.5px;white-space:pre-wrap;max-height:130px;overflow:auto}
.task .tfoot{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink-3);font-size:11.5px}
.task .tfoot code{font-family:var(--mono)}

/* ── 浮层 ── */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);z-index:80;
  background:var(--ink);color:#fff;padding:11px 20px;font-size:14px;border-radius:10px;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(33,30,26,.45);z-index:70;
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border-radius:16px;padding:24px;width:min(440px,100%);
  max-height:92vh;overflow:auto;box-shadow:var(--sh-2);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.modal .box h3{font-size:17px;font-weight:800}
.modal .box p{font-size:13.5px;color:var(--ink-2);margin:8px 0 16px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal input[type=text],.modal input[type=password]{width:100%;border:1px solid var(--line-2);
  border-radius:8px;padding:11px 12px;font-size:14px}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal .play{background:var(--media);border-radius:12px;padding:7px;width:min(340px,80vw)}
.modal .play video{width:100%;border-radius:7px;background:#000}
.modal .play .cap{color:rgba(244,241,236,.55);font-size:12px;padding:8px 3px 1px}
.mlist{max-height:280px;overflow:auto;margin-top:4px}
.mlist button{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;
  padding:11px 10px;border-radius:8px;font-size:13.5px;transition:background .15s}
.mlist button:hover{background:var(--sunken)}
.mlist .m{color:var(--ink-3);font-size:12px;white-space:nowrap}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:14px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:99}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:960px){
  .pj{grid-template-columns:1fr}
  .rail{position:static}
}
@media (max-width:640px){
  .wrap{padding:18px 14px 96px}
  .top .in{padding:0 14px}
  .player-row{flex-direction:column}
  .media-frame{align-self:flex-start}
  .media-frame video{width:min(262px,70vw)}
  .import .pick{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a class="brand" href="#/" id="brand"><span class="mark">V</span>videogen<small>工作台</small></a>
    <span class="sp"></span>
    <div class="tact">
      <button class="btn sm accent" id="newBtn">新建项目</button>
    </div>
  </div>
</header>
<a class="skip" href="#main">跳到主内容</a>
<main class="wrap" id="main" tabindex="-1"></main>

<script>
/* ================= 基础 ================= */
const $ = (id) => document.getElementById(id);
const TOK = () => localStorage.getItem("vg.token") || "";
const qs = (u) => u + (u.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOK());
async function api(u, o) {
  o = o || {};
  o.headers = Object.assign({"x-auth-token": TOK()}, o.headers || {});
  const r = await fetch(u, o);
  let d = null;

}

function wireImport(drop, input, onFile){
  if (!drop) return;
  input.onchange = (e) => onFile(e.target.files[0]);
  drop.onclick = () => input.click();
  drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); input.click(); } };
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) onFile(f);
  });
}

      <div class="grp"><div class="gh">语速 <span id="rateTxt" style="color:var(--ink);font-weight:800">${(CFG.rate/100).toFixed(2)}×</span>
        <span style="float:right" id="estTxt"></span></div>
        <div class="pills" id="rateSeg"></div></div>
      <details class="disc" style="margin-top:12px"><summary>音乐、音效与画面信息<i class="n">更多设置</i></summary>
        <div class="disc-b">
          <div class="grp"><div class="gh">背景音乐</div>
            <select id="bgm" aria-label="背景音乐" style="max-width:100%"></select></div>
          <div class="grp"><div class="gh">智能音效</div><div class="pills" id="sfxSeg"></div></div>
          <div class="grp"><div class="field"><span class="t">字幕</span>
            <button class="sw ${CFG.subtitles ? "on" : ""}" data-k="subtitles" role="switch"
              aria-checked="${CFG.subtitles}" aria-label="字幕"><i></i></button></div>
          <div class="field"><span><span class="t">资料来源</span>
            <span class="d" style="display:block">画面底部露出引用来源</span></span>
            <button class="sw ${CFG.sources ? "on" : ""}" data-k="sources" role="switch"
              aria-checked="${CFG.sources}" aria-label="资料来源"><i></i></button></div>
          <div class="grp"><div class="gh">免责声明</div>
            <textarea id="disclaimer">本片内容基于公开报道与公开资料整理，观点仅供参考，不构成任何投资建议</textarea></div>
        </div></details>
      <div class="render-cta" style="margin-top:14px">
        <div class="est">成片 <b id="est2">—</b><br>渲染 <b id="render2">—</b></div>
        <button class="btn accent" id="go">开始渲染</button>
      </div>
    </section>
    <section class="card panel task" id="taskCard"></section>`;
  paintBundlePanel();
  paintConfig(b);
  paintTaskIdle();
}
function paintBundlePanel(){
  const el = $("bundlePanel"); if (!el) return;
  if (!CUR.bundle){
    el.innerHTML = `<div class="ph"><h3>素材包</h3></div>
      <div class="bundle-none"><span>还没挂素材包</span><button class="btn sm line" id="pickBundle">选择</button></div>`;
  } else {
    el.innerHTML = `<div class="ph"><h3>素材包</h3></div>
      <div class="bundle-chip">
        <span class="b-ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg></span>
        <span class="b-name"><b>${esc(CUR.bundle)}</b><span id="bundleMeta"></span></span>
        <button id="pickBundle">更换</button>
      </div>`;
    api("/api/bundles").then(list => {
      const m = $("bundleMeta");
      const hit = list.find(x => x.name === CUR.bundle);
      if (m && hit) m.textContent = hit.assets + " 素材";
    }).catch(() => {});
  }
  $("pickBundle").onclick = openBundleModal;
}
function openBundleModal(){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true">
    <h3>素材包</h3><p>选服务器上已有的，或上传一个新的 zip。</p>
    <button class="btn line sm" id="bmUpload" style="width:100%">上传 zip 文件</button>
    <input type="file" id="bmZip" accept=".zip" class="hide">
    <div class="sub-h" style="margin-top:14px">已有的素材包</div>
    <div class="mlist" id="bmList"><p style="color:var(--ink-3);font-size:13px">读取中…</p></div>
    <div class="row"><button class="btn sm line" data-c>关闭</button></div></div>`;
  m.querySelector("[data-c]").onclick = () => m.remove();
  m.onclick = (e) => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
  m.querySelector("#bmUpload").onclick = () => m.querySelector("#bmZip").click();
  m.querySelector("#bmZip").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const up = await uploadZip(f);
      await mountBundle(up.name, up.name);
      m.remove();
    } catch (err) { toast("上传失败：" + err.message); }
  };
  api("/api/bundles").then(list => {
    const box = m.querySelector("#bmList");
    if (!list.length) return void (box.innerHTML = `<p style="color:var(--ink-3);font-size:13px">还没有素材包</p>`);
    box.innerHTML = "";
    list.forEach(x => {
      const btn = document.createElement("button");
      btn.innerHTML = `<span>${esc(x.name)}</span><span class="m">${x.assets} 素材 · ${esc(x.updated)}</span>`;
      btn.onclick = async () => { await mountBundle(x.name, x.name); m.remove(); };
      box.appendChild(btn);
    });
  }).catch(() => {});
}
async function mountBundle(name, title){
  try {
    await api(`/api/projects/${CUR.project_id}/mount`, {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({bundle:name, title})});
    CUR.bundle = name; if (title) CUR.title = title;
    toast("已挂载 " + name);
    renderProject();
  } catch (e) { toast("挂载失败：" + e.message); }
}

function paintConfig(b){
  // 模板
  const fmt = $("fmt");
  fmt.innerHTML = TPLS.map(t => {
    const v = TPL_VIS[t.id] || {};
    return `<button class="tpl ${t.id === CFG.format ? "on" : ""}" data-v="${esc(t.id)}">
      <span class="sw" style="background:linear-gradient(135deg,${v.bg||"#000"} 0 55%,${v.paper||"#777"} 55% 100%)">
        <i style="background:${v.acc||"#999"}"></i></span>
      <span><b>${esc(t.name)}</b><small>${esc(v.hint || "")}</small></span></button>`;
  }).join("");
  fmt.querySelectorAll(".tpl").forEach(o => o.onclick = () => {
    fmt.querySelectorAll(".tpl").forEach(x => x.classList.remove("on"));
    o.classList.add("on"); CFG.format = o.dataset.v; saveCfg();
  });
  // 音色
  const vs = $("voiceSeg");
  vs.innerHTML = Object.keys(VOICE).map(v =>
    `<button class="pill ${v === CFG.voice ? "on" : ""}" data-v="${v}">${esc(VOICE[v].split(" · ")[0])}</button>`).join("");
  vs.querySelectorAll(".pill").forEach(p => p.onclick = () => {
    vs.querySelectorAll(".pill").forEach(x => x.classList.remove("on"));
    p.classList.add("on"); CFG.voice = p.dataset.v; saveCfg();
  });
  // 语速
  const setRate = (r) => {
    r = Math.max(60, Math.min(200, r)); CFG.rate = r; saveCfg();
    $("rateTxt").textContent = (r/100).toFixed(2) + "×";
    updateEst(b);
    $("rateSeg").querySelectorAll(".pill").forEach(x => x.classList.toggle("on", +x.dataset.r === r));
  };
  const rs = $("rateSeg");
  rs.innerHTML = [80,90,100,110,125].map(r =>
    `<button class="pill ${r === CFG.rate ? "on" : ""}" data-r="${r}">${(r/100).toFixed(2)}×</button>`).join("");
  rs.querySelectorAll(".pill").forEach(p => p.onclick = () => setRate(+p.dataset.r));
  // 音效档位
  const sfxSeg = $("sfxSeg");
  const SFX = [["off","关闭"],["hook","仅开场"],["accent","开场+卡片"],["full","全片"]];
  sfxSeg.innerHTML = SFX.map(([v, t]) =>
    `<button class="pill ${CFG.sfxMode === v ? "on" : ""}" data-v="${v}">${t}</button>`).join("");
  sfxSeg.querySelectorAll(".pill").forEach(p => p.onclick = () => {
    sfxSeg.querySelectorAll(".pill").forEach(x => x.classList.remove("on"));
    p.classList.add("on"); CFG.sfxMode = p.dataset.v; saveCfg();
  });
  // 开关
  document.querySelectorAll(".sw[data-k]").forEach(s => s.onclick = () => {
    s.classList.toggle("on"); CFG[s.dataset.k] = s.classList.contains("on");
    s.setAttribute("aria-checked", CFG[s.dataset.k]); saveCfg();
  });
  // BGM
  api("/api/music").then(list => {
    const sel = $("bgm"); if (!sel) return;
    sel.innerHTML = `<option value="">不用背景音乐</option>` +
      list.map(m => `<option value="${esc(m.file)}">${esc(m.name)}${m.mood ? " · " + esc(m.mood) : ""}</option>`).join("");
    const want = CFG.bgm && list.some(m => m.file === CFG.bgm) ? CFG.bgm : (list[0] ? list[0].file : "");
    sel.value = want; CFG.bgm = want; saveCfg();
    sel.onchange = () => { CFG.bgm = sel.value; saveCfg(); };
  }).catch(() => {});
  updateEst(b);
}
function updateEst(b){
  if (!b) { $("est2").textContent = "—"; $("render2").textContent = "—"; return; }
  const est = Math.round(b.estSeconds / (CFG.rate/100));
  $("estTxt").textContent = "成片约 " + mmss(est);
  $("est2").textContent = mmss(est);
  $("render2").textContent = renderEstimate(est);
}

/* —— 任务卡 —— */
function taskEl(){ return $("taskCard"); }
function paintTaskIdle(){
  const t = taskEl(); if (!t) return;
  t.className = "card panel task";
  t.innerHTML = `<div class="th"><span class="dot"></span>任务<span class="tpct" style="font-size:15px;color:var(--ink-3)">待机</span></div>
    <div class="pdetail" style="margin-top:8px">还没有在跑的任务。点上面的「开始渲染」开工。</div>
    <div class="tfoot"><code id="taskId">—</code></div>`;
}
function paintTaskRunning(){
  const t = taskEl(); if (!t) return;
  t.className = "card panel task running";
  t.innerHTML = `<div class="th"><span class="dot"></span><span id="tstage">正在生成</span>
      <span class="tpct" id="tpct">0%</span></div>
    <div class="pbar"><i id="tbar"></i></div>
    <div class="pdetail" id="tdetail">连接中…</div>
    <div class="pmeta"><span id="teta"></span><span id="tstep"></span></div>
    <ul class="stages8" id="tstages">${STAGE8.map(s => `<li>${s}</li>`).join("")}</ul>
    <div class="stills" id="tstills">
      ${[1,2,3,4].map(() => `<div class="shot">取景中</div>`).join("")}
    </div>
    <div class="terr hide" id="terr"></div>
    <div class="tfoot"><span>任务</span><code id="taskId">—</code>
      <button class="ghost" id="copyId" style="margin-left:auto;padding:2px 8px">复制</button></div>`;
  $("copyId").onclick = () => {
    const txt = $("taskId").textContent;
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(() => toast("已复制"), () => toast("复制失败"));
    else toast("当前环境不支持复制");
  };
}
function paintStills(stills){
  const strip = $("tstills"); if (!strip || !stills) return;
  const have = strip.querySelectorAll("img").length;
  if (stills.length <= have) return;
  stills.forEach((url, i) => {
    if (i < have) return;
    const cell = strip.children[i] || strip.appendChild(document.createElement("div"));
    cell.className = "shot";
    cell.innerHTML = `<img src="${qs(url)}" alt="分镜剧照 ${i+1}">`;
    cell.onclick = () => window.open(qs(url), "_blank");
  });
}
function markStages(idx){
  const lis = $("tstages"); if (!lis) return;
  [...lis.children].forEach((li, i) => {
    li.className = i + 1 < idx ? "done" : (i + 1 === idx ? "on" : "");
  });
}
function wireRenderPane(b){
  $("go").onclick = () => startRender(CURB);
  const again = $("againBtn");
  if (again) again.onclick = () => startRender(CURB);
  // 恢复未完成的任务
  const saved = localStorage.getItem("vg.job." + CUR.project_id);
  if (saved){ job = lastJob = saved; paintTaskRunning(); startPoll(); }
}
async function startRender(b){
  if (!CUR.bundle){ toast("先挂一个素材包"); return openBundleModal(); }
  const btn = $("go");
  if (btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span>启动中`; }
  try {
    const r = await api("/api/build", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({project_id: CUR.project_id, bundle: CUR.bundle,
        voice: CFG.voice, rate: String(CFG.rate), bgm: CFG.bgm,
        sfx: CFG.sfxMode !== "off", sfxMode: CFG.sfxMode,
        subtitles: CFG.subtitles !== false, sources: CFG.sources !== false,
        format: CFG.format,
        disclaimer: (($("disclaimer") || {}).value || "").trim() || undefined, useLlm: true})});
    if (!r || !r.job) throw new Error((r && r.error) || "启动失败");
    job = lastJob = r.job;
    localStorage.setItem("vg.job." + CUR.project_id, job);
    paintTaskRunning();
    startPoll();
  } catch (e) {
    if (e.auth) return openGate();
    if (btn){ btn.disabled = false; btn.textContent = "开始渲染"; }
    toast("启动失败：" + e.message);
  }
}
function startPoll(){
  stopPoll();
  JD = newJD();
  JD.lastChange = Date.now();
  pollJob(job);
  timer = setInterval(() => pollJob(job), 1500);
}
async function pollJob(jid){
  let j;
  try { j = await api("/api/job/" + jid); } catch (e) { if (e.auth) openGate(); return; }
  const t = taskEl(); if (!t) return;
  if (j.stage === "unknown"){
    if (lastJob !== jid) return;
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    try {
      const l = await api("/api/latest");
      if (l && l.video){
        t.className = "card panel task done";
        t.querySelector(".tpct").textContent = "完成";
        t.querySelector("#tdetail").textContent = "服务重启过，已找回最近一次成片。";
        refreshStageCard();
      } else paintTaskIdle();
    } catch (e) { paintTaskIdle(); }
    return;
  }
  const idx = Math.min(j.stage8 || 1, 8);
  const pct = Math.max(0, Math.min(100, j.progress || 0));
  const now = Date.now();
  if (pct !== JD.lastPct){ JD.lastPct = pct; JD.lastChange = now; }
  const el = j.elapsed != null ? j.elapsed : Math.round((now - JD.localT0)/1000);
  const firstPoll = JD.firstPoll !== false;
  JD.firstPoll = false;
  if (firstPoll && el > 5) JD.localT0 = now - el*1000;

  $("tpct").textContent = pct + "%";
  $("tbar").style.width = pct + "%";
  $("tstage").textContent = j.stage === "done" ? "全部完成" : STAGE8[idx-1];
  if (j.detail) $("tdetail").textContent = j.detail;
  $("tstep").textContent = j.stage === "done" ? "" : "第 " + idx + " / 8 步";
  $("taskId").textContent = jid;
  markStages(j.stage === "done" ? 9 : idx);
  paintStills(j.stills);

  JD.samples.push({t: now, p: pct});
  JD.samples = JD.samples.filter(s => now - s.t < 90000);
  const s0 = JD.samples[0], sN = JD.samples[JD.samples.length - 1];
  const dt = (sN.t - s0.t)/1000, dp = sN.p - s0.p;
  const rate = dt > 20 ? dp/dt : 0;
  const eta = $("teta");
  if (j.stage === "done") eta.textContent = "";
  else if (pct >= 85 && rate > .02)
    eta.textContent = "已用 " + mmss(el) + " · 还需约 " + mmss(Math.max(5, Math.round((100-pct)/rate)));
  else eta.textContent = "已用 " + mmss(el) + (QUOTE[j.stage] ? " · " + QUOTE[j.stage] : "");
  $("tdetail").textContent = (j.detail || "") + ((now - JD.lastChange)/1000 > 25 && j.stage !== "done"
    ? "（仍在处理中，没有卡住）" : "");
  if (j.stage === "done") $("tdetail").textContent = "成片已经生成，左侧可以直接预览。";

  if (j.stage === "failed"){
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    t.className = "card panel task failed";
    t.querySelector(".tpct").textContent = "失败";
    $("tstage").textContent = "没有生成成功";
    const er = $("terr");
    er.classList.remove("hide");
    er.textContent = (j.error || "未知错误").slice(0, 400);
    const foot = t.querySelector(".tfoot");
    const retry = document.createElement("button");
    retry.className = "btn sm"; retry.style.marginLeft = "auto";
    retry.textContent = "重试渲染";
    retry.onclick = () => startRender(CURB);
    foot.appendChild(retry);
    return;
  }
  if (j.stage === "done"){
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    lastJob = jid;
    t.className = "card panel task done";
    t.querySelector(".tpct").textContent = "完成";
    refreshStageCard();
  }
}

/* ================= 启动 ================= */
loadTemplates().then(() => route(true));
</script>
