<!DOCTYPE html>
<!--
  方向：黑场 · 电影感（client 指定：炫酷）
  舞台而不是落地页：纯黑底 + 单色朱红氛围光 + 胶片颗粒；视频是舞台上唯一的光源。
  记忆点（每屏一个）：
    · 首页   —— 三层景深视频舞台（鼠标视差）+ 片名以遮罩揭幕 + 底部无限胶片带
    · 成片页 —— 分镜剧照墙：渲染一开始先拍下关键画面，一张张闪入，等待变成看片
    · 进度   —— 帧数滚动 + REC 呼吸灯 + 进度线扫光
  字：展示字「思源黑体 Heavy」子集（14KB 自托管，与成片同款）；正文系统黑体
  色：黑 #08070A / 纸白 #F4F1EC / 朱红 #E0452A（成片主色的高饱和版）
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>videogen · 短视频工作台</title>
<style>
@font-face{
  font-family:"Display";
  src:url("/fonts/display-900.ttf") format("truetype");
  font-weight:900;font-display:swap;
}
:root{
  --void:#08070A; --void-2:#100E13; --card:#17151B; --mount:#E6E3DD;
  --ink:#F4F1EC; --ink-2:rgba(244,241,236,.60); --ink-3:rgba(244,241,236,.34);
  --rule:rgba(244,241,236,.12); --hover:rgba(244,241,236,.06);
  --accent:#E0452A; --accent-soft:rgba(224,69,42,.16); --ok:#6FA87A;
  --t-13:13px; --t-15:15px; --t-17:17px; --t-20:20px; --t-26:26px; --t-72:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s10:40px; --s16:64px; --s24:96px;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0}
::selection{background:var(--accent);color:#fff}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--ink);font-family:var(--sans);
  font-size:var(--t-17);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
p{color:var(--ink-2)}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.display{font-family:"Display",var(--sans);font-weight:900;letter-spacing:-.035em;line-height:1.06}

/* 电影质感：颗粒 + 氛围光（只用品牌色，不用蓝紫渐变球） */
.grain,.glow{position:fixed;inset:0;pointer-events:none;z-index:1}
.grain{opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.glow{background:radial-gradient(60% 45% at 68% 22%,rgba(224,69,42,.22),transparent 70%),
  radial-gradient(40% 40% at 12% 80%,rgba(224,69,42,.10),transparent 72%)}
main,.top{position:relative;z-index:2}

/* ── 顶栏 ── */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(rgba(8,7,10,.86),rgba(8,7,10,.4))}
.top .in{max-width:1320px;margin:0 auto;padding:0 var(--s6);height:72px;
  display:flex;align-items:center;gap:var(--s4)}
.brand{display:flex;align-items:center;gap:10px;font-size:var(--t-15);font-weight:800;
  letter-spacing:.02em}
.brand i{width:8px;height:8px;background:var(--accent);
  box-shadow:0 0 16px var(--accent);animation:rec 2.4s var(--ease) infinite}
@keyframes rec{0%,100%{opacity:1}50%{opacity:.35}}
.top .sp{flex:1}
.quiet{color:var(--ink-2);font-size:var(--t-15);min-height:40px;display:inline-flex;
  align-items:center;transition:color .3s var(--ease)}
.quiet:hover{color:var(--ink)}

.wrap{max-width:1320px;margin:0 auto;padding:0 var(--s6) var(--s24)}
.view{animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:#fff;border-radius:2px;padding:0 28px;min-height:52px;
  font-size:var(--t-15);font-weight:700;letter-spacing:.01em;position:relative;
  box-shadow:0 8px 30px rgba(224,69,42,.32);transition:box-shadow .35s var(--ease),transform .35s var(--ease)}
.btn:hover{box-shadow:0 12px 44px rgba(224,69,42,.5);transform:translateY(-1px)}
.btn[disabled]{background:var(--card);color:var(--ink-3);box-shadow:none;transform:none}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.btn.line:hover{box-shadow:inset 0 0 0 1px var(--ink-2);transform:none}
.btn.sm{min-height:42px;padding:0 20px;font-size:var(--t-13);font-weight:600;box-shadow:none}

/* ── 首页舞台 ── */
.hero{display:grid;grid-template-columns:minmax(0,43fr) minmax(0,57fr);
  gap:var(--s10);align-items:center;min-height:min(84vh,760px);padding:var(--s10) 0 var(--s16)}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--accent);
  font-size:var(--t-13);font-weight:700;letter-spacing:.16em;margin-bottom:var(--s6)}
.kicker s{text-decoration:none;display:block;width:26px;height:1px;background:var(--accent);
  box-shadow:0 0 12px var(--accent)}
h1.mask{font-size:56px;max-width:9.2em}
.mask .ln{display:block;overflow:hidden}
.mask .ln > span{display:block;transform:translateY(105%);
  animation:rise .9s var(--ease) forwards}
@keyframes rise{to{transform:none}}
.rule{height:2px;background:var(--accent);width:0;margin:var(--s6) 0 0;
  box-shadow:0 0 18px var(--accent);animation:draw .9s .45s var(--ease) forwards}
@keyframes draw{to{width:88px}}
.hero .lede{margin-top:var(--s6);font-size:var(--t-20);line-height:1.6;max-width:24em;
  animation:fade .8s .5s var(--ease) both}
.facts{margin-top:var(--s6);color:var(--ink-3);font-size:var(--t-13);
  display:flex;gap:var(--s3);flex-wrap:wrap;animation:fade .8s .6s var(--ease) both}
.facts s{text-decoration:none;color:rgba(244,241,236,.18)}
.act{display:flex;align-items:center;gap:var(--s6);margin-top:var(--s10);
  animation:fade .8s .7s var(--ease) both}
.dropbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  margin-top:var(--s4);max-width:420px;padding:var(--s3) var(--s4);border-radius:2px;
  box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-2);font-size:var(--t-15);
  transition:background .3s var(--ease),box-shadow .3s var(--ease);
  animation:fade .8s .8s var(--ease) both}
.dropbar:hover,.dropbar.over{background:var(--hover);box-shadow:inset 0 0 0 1px var(--accent);
  color:var(--ink)}
.dropbar .pick{color:var(--accent);font-weight:700;white-space:nowrap}

/* 舞台：三层景深 + 视差 + 揭幕 */
.stage{position:relative;height:600px;perspective:1400px}
.layer{position:absolute;transform-style:preserve-3d;will-change:transform;
  transform:translate3d(calc(var(--px,0) * var(--depth)),calc(var(--py,0) * var(--depth)),0)}
.screen{background:var(--mount);padding:9px;border-radius:2px;
  box-shadow:0 40px 120px rgba(0,0,0,.85),0 0 0 1px rgba(244,241,236,.08)}
.screen video{display:block;background:#000}
.screen .cap{display:block;padding:8px 2px 0;color:rgba(26,24,21,.5);font-size:11px;
  letter-spacing:.04em}
.l-main{left:6%;top:8%;z-index:3}
.l-main .screen{width:296px}
.l-main video{width:278px;height:494px}
.l-back{right:8%;top:0;z-index:2;opacity:.66;filter:saturate(.8) brightness(.75)}
.l-back .screen{width:212px}
.l-back video{width:194px;height:345px}
.l-far{right:2%;bottom:2%;z-index:1;opacity:.4;filter:saturate(.6) brightness(.6) blur(.6px)}
.l-far .screen{width:158px}
.l-far video{width:140px;height:249px}
.reveal{clip-path:inset(100% 0 0 0);animation:wipe 1s var(--ease) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.l-main .reveal{animation-delay:.15s}
.l-back .reveal{animation-delay:.3s}
.l-far .reveal{animation-delay:.45s}
.sheet{background:var(--mount);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;color:rgba(26,24,21,.5);font-size:var(--t-13);
  gap:8px;line-height:1.7}

/* 胶片带 */
.film{margin-top:var(--s16);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  overflow:hidden;position:relative;padding:var(--s3) 0;
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.film .track{display:flex;gap:var(--s3);width:max-content;animation:roll 46s linear infinite}
.film:hover .track{animation-play-state:paused}
@keyframes roll{to{transform:translateX(-50%)}}
.film .f{flex:none;background:var(--mount);padding:4px;border-radius:1px}
.film .f video,.film .f img{display:block;width:92px;height:164px;object-fit:cover;background:#000}
.film .f.punch{display:grid;place-items:center;width:92px;height:172px;
  box-shadow:inset 0 0 0 1px var(--rule);background:transparent;color:var(--ink-3);font-size:11px}

/* ── 片架 ── */
.shelf{margin-top:var(--s16)}
.shelf .head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4)}
.shelf .head h2{font-family:"Display",var(--sans);font-weight:900;font-size:var(--t-26)}
.shelf .head .n{color:var(--ink-3);font-size:var(--t-13)}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:var(--s6);margin-top:var(--s6)}
.plate{position:relative;text-align:left}
.plate .holder{background:var(--mount);padding:7px;border-radius:2px;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease);
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.plate:hover .holder{transform:translateY(-6px) scale(1.015);
  box-shadow:0 26px 60px rgba(0,0,0,.7),0 0 0 1px var(--accent)}
.plate video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#000}
.plate .meta{display:block;padding:9px 2px 0}
.plate .t{display:block;font-size:var(--t-15);font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .d{display:block;color:var(--ink-3);font-size:var(--t-13);margin-top:2px}
.plate .tags{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:2}
.tag{font-size:11px;padding:3px 7px;border-radius:2px;background:rgba(8,7,10,.72);
  color:var(--ink);backdrop-filter:blur(6px);font-weight:600}
.tag.on{background:var(--accent);color:#fff}
.tag.play{display:flex;align-items:center;gap:5px}
.tag.play::before{content:"";width:0;height:0;border-left:6px solid currentColor;
  border-top:4px solid transparent;border-bottom:4px solid transparent}
.empty-shelf{color:var(--ink-3);font-size:var(--t-15);padding:var(--s10) 0}

/* ── 项目行 ── */
.rows{margin-top:var(--s16)}
.rows .head{display:flex;align-items:baseline;gap:var(--s3);
  border-bottom:1px solid var(--rule);padding-bottom:var(--s3);color:var(--ink-2);
  font-size:var(--t-13);letter-spacing:.1em}
.rw{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s4) var(--s6);
  align-items:center;padding:var(--s3) var(--s2);border-bottom:1px solid var(--rule);
  min-height:72px;position:relative;transition:background .3s var(--ease)}
.rw::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:0;
  background:var(--accent);transition:width .45s var(--ease);box-shadow:0 0 12px var(--accent)}
.rw:hover{background:var(--hover)}
.rw:hover::after{width:100%}
.rw .mini{width:34px;height:60px;background:var(--card);border-radius:2px;overflow:hidden;
  display:grid;place-items:center;font-family:"Display",var(--sans);font-weight:900;
  color:var(--ink-3);font-size:var(--t-15)}
.rw .mini video{width:100%;height:100%;object-fit:cover;display:block}
.rw .t{font-size:var(--t-17);font-weight:700;text-align:left;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rw:hover .t{color:var(--accent)}
.rw .m{color:var(--ink-3);font-size:var(--t-13);text-align:right;white-space:nowrap}
.rw .m .del{margin-left:var(--s4);color:var(--ink-3)}
.rw .m .del:hover{color:var(--accent)}
.blank{border:1px dashed var(--rule);border-radius:2px;padding:var(--s16) var(--s10);
  text-align:center;color:var(--ink-2)}
.blank b{display:block;font-family:"Display",var(--sans);font-weight:900;font-size:var(--t-26);
  color:var(--ink);margin-bottom:var(--s2)}

/* ── 项目内 ── */
.sbar{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;padding-top:var(--s10)}
.sbar h2{font-family:"Display",var(--sans);font-weight:900;font-size:var(--t-26)}
.sbar .who{color:var(--ink-3);font-size:var(--t-13)}
.rail{display:flex;gap:var(--s10);flex-wrap:wrap;margin:var(--s10) 0 0;
  border-bottom:1px solid var(--rule);padding-bottom:var(--s3)}
.rail button{display:flex;align-items:baseline;gap:7px;color:var(--ink-3);font-size:var(--t-15);
  min-height:40px;padding-bottom:6px;border-bottom:2px solid transparent;
  margin-bottom:calc(-1 * var(--s3) - 1px);
  transition:color .3s var(--ease),border-color .3s var(--ease),text-shadow .3s var(--ease)}
.rail button .n{font-size:var(--t-13);font-weight:800}
.rail button.done{color:var(--ink-2)}
.rail button.on{color:var(--ink);border-bottom-color:var(--accent);text-shadow:0 0 18px rgba(224,69,42,.5)}
.rail button.on .n{color:var(--accent)}
.rail button:not([disabled]):hover{color:var(--ink)}
.rail button[disabled]{cursor:default;opacity:.4}
.body{padding-top:var(--s10)}
.lead{font-size:var(--t-17);color:var(--ink-2);max-width:32em;margin-bottom:var(--s10)}

.drop{display:block;width:100%;text-align:center;padding:var(--s24) var(--s6);
  border:1px dashed var(--rule);border-radius:2px;transition:border-color .3s var(--ease),background .3s var(--ease)}
.drop:hover{border-color:var(--accent);background:var(--hover)}
.drop b{display:block;font-family:"Display",var(--sans);font-weight:900;font-size:var(--t-26);
  color:var(--ink);margin-bottom:var(--s2)}
.drop span{color:var(--ink-2);font-size:var(--t-15)}
.sub{color:var(--ink-3);font-size:var(--t-13);margin:var(--s10) 0 var(--s2);
  padding-bottom:var(--s2);border-bottom:1px solid var(--rule);letter-spacing:.08em}
.blist button{width:100%;display:flex;justify-content:space-between;align-items:baseline;
  gap:var(--s4);padding:var(--s4) var(--s2);text-align:left;font-size:var(--t-17);
  border-bottom:1px solid var(--rule);min-height:56px;transition:background .3s var(--ease),padding-left .3s var(--ease)}
.blist button:hover{background:var(--hover);padding-left:var(--s4)}
.blist .m{color:var(--ink-3);font-size:var(--t-13)}

.ctitle{font-family:"Display",var(--sans);font-weight:900;font-size:var(--t-26);
  max-width:24em;margin-bottom:var(--s3)}
.stats{color:var(--ink-3);font-size:var(--t-13)}
.hook{background:var(--void-2);border:1px solid var(--rule);padding:var(--s10) var(--s10) var(--s6);
  margin:var(--s10) 0 var(--s16);position:relative;overflow:hidden}
.hook::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;
  background:var(--accent);box-shadow:0 0 24px var(--accent)}
.hook .ln{font-family:"Display",var(--sans);font-weight:900;font-size:34px;line-height:1.5;
  letter-spacing:-.03em}
.hook .hl{background:var(--accent);color:#fff;padding:2px 10px;box-shadow:0 0 26px var(--accent-soft)}
.script{background:var(--void-2);border:1px solid var(--rule);padding:var(--s10);
  max-height:320px;overflow:auto;font-size:var(--t-17);line-height:1.9;white-space:pre-wrap}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
  gap:var(--s4);margin-top:var(--s4)}
.a img,.a video{width:100%;height:96px;object-fit:cover;display:block;background:var(--card);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.a{overflow:hidden;border-radius:2px}
.a:hover img,.a:hover video{transform:scale(1.06);box-shadow:0 0 0 1px var(--accent)}
.a .cap{color:var(--ink-3);font-size:var(--t-13);margin-top:var(--s2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actbar{display:flex;justify-content:flex-end;margin-top:var(--s16)}

.grp{margin-bottom:var(--s16)}
.grp .h{font-size:var(--t-13);color:var(--ink-2);padding-bottom:var(--s2);
  border-bottom:1px solid var(--rule);margin-bottom:var(--s4);letter-spacing:.1em}
.opt{display:flex;gap:var(--s3);flex-wrap:wrap}
.opt button{text-align:left;padding:var(--s4) var(--s6);min-height:78px;min-width:186px;
  border-radius:2px;background:var(--void-2);box-shadow:inset 0 0 0 1px var(--rule);
  transition:box-shadow .35s var(--ease),transform .35s var(--ease),background .35s var(--ease)}
.opt button:hover{transform:translateY(-2px)}
.opt button.on{box-shadow:inset 0 0 0 1px var(--accent),0 0 30px var(--accent-soft)}
.opt b{display:block;font-size:var(--t-17);font-weight:700}
.opt small{color:var(--ink-3);font-size:var(--t-13)}
/* 模板选择器：左侧一块配色缩略，右侧名称 + 说明 */
.opt.tpl button{display:grid;grid-template-columns:auto 1fr;align-items:center;
  gap:2px var(--s4);min-width:238px;min-height:88px}
.opt.tpl .sw{grid-row:1 / 3;width:36px;height:56px;border-radius:3px;position:relative;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 4px 14px rgba(0,0,0,.45)}
.opt.tpl .sw i{position:absolute;left:6px;bottom:6px;width:12px;height:12px;border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.opt.tpl b{grid-column:2}
.opt.tpl small{grid-column:2;line-height:1.35}
.field{display:flex;align-items:center;justify-content:space-between;gap:var(--s10);
  padding:var(--s4) 0;border-bottom:1px solid var(--rule)}
.field .t{font-size:var(--t-17)}
.field .d{color:var(--ink-3);font-size:var(--t-13);margin-top:2px;max-width:44em}
.pills{display:flex;gap:var(--s2);flex-wrap:wrap}
.pill{min-height:40px;padding:0 16px;border-radius:999px;font-size:var(--t-15);
  color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule);transition:all .3s var(--ease)}
.pill:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-3)}
.pill.on{background:var(--accent);color:#fff;box-shadow:0 0 24px var(--accent-soft);font-weight:700}
textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule);
  padding:var(--s3) 0;font-size:var(--t-15);resize:vertical;min-height:64px;line-height:1.7}
textarea:focus{outline:none;border-bottom-color:var(--accent)}
select{background:transparent;border:0;border-bottom:1px solid var(--rule);
  padding:var(--s2) 0;font-size:var(--t-15);min-width:210px;text-align:right}
select:focus{outline:none;border-bottom-color:var(--accent)}
select option{background:var(--void-2);color:var(--ink)}
.sw{width:46px;height:24px;border-radius:999px;background:var(--rule);position:relative;
  flex:none;transition:background .3s var(--ease)}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--ink);transition:left .3s var(--ease)}
.sw.on{background:var(--accent);box-shadow:0 0 22px var(--accent-soft)}
.sw.on i{left:25px}
.go{display:flex;align-items:center;justify-content:flex-end;gap:var(--s10);
  margin-top:var(--s16);padding:var(--s4) 0;position:sticky;bottom:0;
  background:linear-gradient(transparent,var(--void) 45%)}

/* ── 任务控制台 ── */
.console{position:relative;border:1px solid var(--rule);border-radius:2px;padding:var(--s10);

.track::after{content:"";position:absolute;top:0;left:-30%;width:30%;height:100%;

@keyframes sweep{to{left:110%}}
.meta{display:flex;justify-content:space-between;gap:var(--s4);color:var(--ink-3);font-size:var(--t-13)}

/* 分镜剧照墙 */
.shots{margin-top:var(--s10)}
.shots .h{font-size:var(--t-13);color:var(--ink-3);letter-spacing:.1em;margin-bottom:var(--s3)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:var(--s3)}

@keyframes flash{from{opacity:0;transform:scale(1.06);filter:brightness(2.2)}to{opacity:1;transform:none;filter:none}}
.shot .idx{position:absolute;left:9px;bottom:7px;font-size:10px;font-weight:800;
  color:#fff;background:rgba(8,7,10,.6);padding:2px 6px;border-radius:2px}
.shot.wait{display:grid;place-items:center;color:var(--ink-3);font-size:11px;
  background-image:repeating-linear-gradient(45deg,rgba(244,241,236,.03) 0 8px,transparent 8px 16px)}

.steps{margin-top:var(--s10);columns:2;column-gap:var(--s16)}
.steps li{display:flex;align-items:baseline;gap:var(--s3);font-size:var(--t-15);
  color:var(--ink-3);padding:var(--s2) 0;break-inside:avoid}
.steps li .n{width:24px;flex:none;font-size:var(--t-13);font-weight:800}
.steps li .t{flex:1}
.steps li .d{font-size:var(--t-13);color:var(--ink-3)}

.tip{color:var(--ink-2);font-size:var(--t-15);margin-top:var(--s10);max-width:38em}
.foot{margin-top:var(--s10);display:flex;align-items:center;gap:var(--s4);
  color:var(--ink-3);font-size:var(--t-13);flex-wrap:wrap}
.foot code{color:var(--ink-2)}
.err{color:var(--accent);font-size:var(--t-15);margin-top:var(--s10);max-width:44em}
.err pre{font-family:var(--sans);color:var(--ink-2);font-size:var(--t-13);
  white-space:pre-wrap;margin-top:var(--s2);max-height:140px;overflow:auto}
.result{margin-top:var(--s16);padding-top:var(--s10);border-top:1px solid var(--rule)}
.frame{display:inline-block;padding:9px;background:var(--mount);border-radius:2px;margin:var(--s6) 0;
  box-shadow:0 30px 90px rgba(0,0,0,.8)}
video.res{display:block;width:300px;max-width:100%;background:#000}
.rrow{display:flex;align-items:center;gap:var(--s6);margin-top:var(--s4)}
.hist{margin-top:var(--s16)}
.hist .h{font-size:var(--t-13);color:var(--ink-3);letter-spacing:.1em;
  border-bottom:1px solid var(--rule);padding-bottom:var(--s2)}
.hist li{display:flex;align-items:baseline;gap:var(--s10);padding:var(--s3) 0;
  border-bottom:1px solid var(--rule);color:var(--ink-2);font-size:var(--t-15)}
.hist li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist li .d{color:var(--ink-3);font-size:var(--t-13)}

/* ── 浮层 ── */
.toast{position:fixed;left:50%;bottom:var(--s10);transform:translate(-50%,10px);
  background:var(--void-2);color:var(--ink);padding:13px 24px;font-size:var(--t-15);
  border-radius:2px;box-shadow:0 0 0 1px var(--accent),0 12px 40px rgba(0,0,0,.7);
  opacity:0;pointer-events:none;z-index:60;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(4,3,6,.86);z-index:58;backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:var(--s6)}
.modal .box{background:var(--void-2);padding:var(--s10);width:min(460px,100%);border-radius:2px;
  max-height:92vh;overflow:auto;box-shadow:0 0 0 1px var(--rule),0 40px 120px rgba(0,0,0,.9);
  animation:pop .4s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal .box h3{font-family:"Display",var(--sans);font-weight:900;font-size:var(--t-26)}
.modal .box p{font-size:var(--t-15);margin:var(--s3) 0 var(--s10)}
.modal .row{display:flex;gap:var(--s4);justify-content:flex-end}
.modal .play{width:min(380px,86vw);background:var(--mount);padding:9px;border-radius:2px}
.modal .play video{width:100%;display:block;background:#000}
.modal .play .cap{color:rgba(26,24,21,.55);font-size:var(--t-13);padding:8px 2px 0}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:16px;background:var(--accent);color:#fff;padding:10px 16px;z-index:99}
.spin{width:13px;height:13px;border:1.5px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){

}
@media (max-width:1100px){

  .layer{position:static;transform:none!important;opacity:1!important;filter:none!important}
  .layer .screen{width:auto}

}

}

<body>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<header class="top">
  <div class="in">
    <a class="brand" href="#/" id="brand"><i></i>videogen</a>
    <span class="sp"></span>
    <button class="quiet hide" id="newBtn">新建项目</button>
  </div>
</header>
<a class="skip" href="#main">跳到主内容</a>
<main class="wrap" id="main" tabindex="-1"></main>

<script>
const $ = (id) => document.getElementById(id);
const api = (u, o) => fetch(u, o).then(r => r.json());
let CUR = null;
let CFG = { voice:"zh-CN-YunxiNeural", rate:100, bgm:"assets/bgm_upbeat.mp3",
            sfxMode:"hook", subtitles:true, sources:true, format:"editorial" };

// ── 渲染模板 ──
// 缩略图与说明写在前端；模板清单以 /api/templates 为准（服务端按同一份注册表校验）
const TPL_VIS = {
  editorial:{bg:"#1c1a18", paper:"#e4e2e0", acc:"#a44231",
             hint:"纸卡 + 顶部标题带 + 信息卡，信息量最足"},
  finance:  {bg:"#0b1622", paper:"#12202f", acc:"#2ea8d8",
             hint:"深蓝终端感 + 网格，适合行情、财报、数据"},
  minimal:  {bg:"#f1f1ef", paper:"#ffffff", acc:"#111111",
             hint:"纯白极简大字，留白多，适合深度观点"},
  bleed:    {bg:"#000000", paper:"#111111", acc:"#f0b429",
             hint:"素材铺满全屏，沉浸感强，适合情绪片、Vlog"},
  news:     {bg:"#07101f", paper:"#eef2f7", acc:"#c8102e",
             hint:"深蓝正红 + 底部信息条，适合时政、突发"},
  retro:    {bg:"#2a231a", paper:"#ece0c9", acc:"#b3542e",
             hint:"米黄纸 + 颗粒暗角，适合人物、历史"},
  portrait: {bg:"#000000", paper:"#1a1817", acc:"#a44231",
             hint:"9:16 满屏，素材直接铺满"},
};
let TPLS = Object.keys(TPL_VIS).map(id => ({id, name:id}));
async function loadTemplates(){
  try{
    const r = await api("/api/templates");
    if (r && r.templates && r.templates.length){
      TPLS = r.templates;
      if (!TPLS.some(t => t.id === CFG.format) && r.default) CFG.format = r.default;
    }
  }catch(e){ /* 接口不可用时用内置清单兜底 */ }
}
let timer = null, job = null, lastJob = null;
let JD = { lastPct:-1, lastChange:0, stages:{}, localT0:0, samples:[], shownStills:0 };

const STAGE8 = ["读取素材","AI 配音","分镜规划","画面设计","画面渲染","音效混音","画面校验","完成"];
const TIP = {
  tts: "正在把文案合成配音，通常 30–90 秒。",
  plan: "AI 导演正在读全篇文案、排分镜。",
  props: "正在拍分镜剧照，下面这张墙会一张张亮起来。",
  render: "画面渲染是最耗时的一步，通常 3–8 分钟。剧照已经在上面了，片子正在长出来。",
  audio: "正在混合配音、音乐和音效，通常 1–3 分钟。",
  verify: "正在逐镜抽帧校验画面，通常 1–2 分钟。",
};
const QUOTE = {
  tts: "配音通常 30–90 秒", plan: "分镜规划通常几十秒", props: "分镜剧照通常 10–30 秒",
  render: "画面渲染通常 3–8 分钟", audio: "混音通常 1–3 分钟", verify: "校验通常 1–2 分钟",
};
const VOICE = {"zh-CN-YunxiNeural":"云希 · 清爽男声","zh-CN-YunjianNeural":"云健 · 浑厚男声",
  "zh-CN-YunyangNeural":"云扬 · 新闻男声","zh-CN-XiaoxiaoNeural":"晓晓 · 女声"};

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const voiceLabel = () => VOICE[CFG.voice] || CFG.voice;
const mmss = (s) => { s = Math.max(0, Math.round(s || 0));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const num = (n) => {
  const v = Number(String(n == null ? 0 : n).replace(/,/g, ""));
  return isFinite(v) ? v.toLocaleString("en-US") : "0";
};
const vid = (id) => "/video/" + encodeURIComponent(id);
function renderEstimate(sec){
  const base = Math.max(.5, (sec||0)/60*4.4 + 1.2);
  const lo = Math.max(1, Math.round(base*.9)), hi = Math.round(base*1.25);
  return lo === hi ? "约 " + lo + " 分钟" : "约 " + lo + "–" + hi + " 分钟";
}
function allRenders(projects){
  const out = [];
  projects.forEach(p => (p.renders || []).forEach(r => {
    if (r.file) out.push({id: r.id, ts: r.ts, title: p.title, project: p.project_id});
  }));
  return out;
}
// 揭幕动画期间元素被裁掉，Chrome 会跳过 autoplay；所以显式补一次播放
function kickPlay(v){
  if (!v) return;
  v.muted = true;
  const go = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
  go();
  v.addEventListener("canplay", go, {once:true});
  setTimeout(go, 700);
  setTimeout(go, 1600);
  setTimeout(go, 3000);
}
// 取首帧：只 preload=metadata 时不会画出画面，需要显式 seek 一次
function frameAt(v, t){
  if (!v) return;
  const seek = () => { try { if (v.currentTime < t) v.currentTime = t; } catch (e) {} };
  if (v.readyState >= 1) seek();
  else v.addEventListener("loadedmetadata", seek, {once:true});
}
function toast(m){
  let t = $("__t");
  if (!t){ t = document.createElement("div"); t.id = "__t"; t.className = "toast";
    t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = m; t.classList.add("on");
  clearTimeout(t.__h); t.__h = setTimeout(() => t.classList.remove("on"), 2400);
}
function dialog(title, desc, onOk, okText, readonly, extraHTML){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true">
    <h3>${esc(title)}</h3>${desc ? `<p>${esc(desc)}</p>` : ""}${extraHTML || ""}
    <div class="row">${readonly ? `<button class="btn sm" data-c>知道了</button>`
      : `<button class="btn line sm" data-c>取消</button>
         <button class="btn sm" data-k>${esc(okText||"删除")}</button>`}</div></div>`;
  m.querySelectorAll("[data-c]").forEach(b => b.onclick = () => m.remove());
  const k = m.querySelector("[data-k]");
  if (k) k.onclick = () => { m.remove(); onOk(); };
  m.onclick = (e) => { if (e.target === m) m.remove(); };
  document.body.appendChild(m); (k || m.querySelector("[data-c]")).focus();
}
function playDialog(r){
  dialog("看一下这条成片", "", () => {}, "", true,
    `<div class="play"><video src="${vid(r.id)}" controls autoplay playsinline></video>
      <div class="cap">${esc(r.title)} · ${esc(r.ts || "")}</div></div>`);
}

/* ── 路由 ── */
let lock = null;
const setHash = (h) => { lock = h; if (location.hash !== h) location.hash = h; };
async function route(){
  if (location.hash === lock) return;
  lock = location.hash;
  const m = location.hash.match(/#\/project\/([a-f0-9]+)(?:\/(\d))?/);
  if (m){
    const ps = await api("/api/projects");
    const p = ps.find(x => x.project_id === m[1]);
    if (p){ CUR = p; return renderStudio(parseInt(m[2] || "1", 10)); }
  }
  renderHome();
}
function goHome(){ CUR = null; stopPoll(); setHash("#/"); renderHome(); }
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
$("brand").onclick = (e) => { e.preventDefault(); goHome(); };
$("newBtn").onclick = newProject;

/* ── 首页 ── */
async function renderHome(){
  stopPoll();
  $("newBtn").classList.add("hide");
  $("main").innerHTML = `<div class="view"><p class="lead">载入中…</p></div>`;
  const ps = await api("/api/projects");
  const rs = allRenders(ps).reverse();
  const hero = rs.length ? `
    <div class="layer l-main" style="--depth:-14px">
      <div class="screen reveal"><video src="${vid(rs[0].id)}" muted loop autoplay
        playsinline preload="auto"></video>
        <span class="cap">${esc(rs[0].title)} · ${esc((rs[0].ts||"").slice(-5))}</span></div>
    </div>
    ${rs[1] ? `<div class="layer l-back" style="--depth:-26px">
      <div class="screen reveal"><video src="${vid(rs[1].id)}#t=1.4" muted playsinline
        preload="metadata"></video></div></div>` : ""}
    ${rs[2] ? `<div class="layer l-far" style="--depth:-38px">
      <div class="screen reveal"><video src="${vid(rs[2].id)}#t=2.2" muted playsinline
        preload="metadata"></video></div></div>` : ""}`
    : `<div class="layer l-main" style="--depth:-14px"><div class="screen reveal">
        <div class="sheet" style="width:278px;height:494px">
          <span style="font-family:Display,sans-serif;font-weight:900;font-size:26px;
            color:rgba(26,24,21,.7)">还没有成片</span>
          <span>渲染第一条，这里就会亮起来</span></div></div></div>`;
  const film = rs.length ? `<div class="film"><div class="track">
      ${[...rs, ...rs].map(r => `<span class="f"><video src="${vid(r.id)}#t=1.6" muted
        preload="metadata" playsinline></video></span>`).join("")}
    </div></div>` : "";
  $("main").innerHTML = `<div class="view">
    <section class="hero">
      <div>
        <div class="kicker"><s></s>短视频生成工作台</div>
        <h1 class="display mask">
          <span class="ln"><span>把文案和素材，</span></span>
          <span class="ln"><span style="animation-delay:.12s">做成能发的短视频</span></span>
        </h1>
        <div class="rule"></div>
        <p class="lede">导入素材包，AI 导演排分镜、配音、画面与音效，本机渲染出片。</p>
        <div class="facts"><span>1080×1920 竖屏</span><s>/</s><span>本机渲染</span><s>/</s>
          <span>素材不出服务器</span><s>/</s><span>${renderEstimate(96)}出片</span></div>
        <div class="act">
          <button class="btn" id="new2">新建项目</button>
          ${rs.length ? `<button class="quiet" id="watch">看一条成片</button>` : ""}
        </div>
        <div class="dropbar" id="dropbar" role="button" tabindex="0"
          aria-label="拖入素材包 zip 直接开始">
          <span>拖入素材包 zip，直接开工</span><span class="pick">选择文件</span>
        </div>
        <input type="file" id="heroZip" accept=".zip" class="hide">
      </div>
      <div class="stage" id="stage">${hero}</div>
    </section>
    ${film}
    <section class="shelf">
      <div class="head">
        <h2>成片</h2><span class="n">${rs.length} 条 · 点开即播</span>
      </div>
      ${rs.length ? `<div class="plates" id="plates"></div>`
        : `<div class="empty-shelf">还没有成片。渲染第一条之后，这里会摆满你的片子。</div>`}
    </section>
    <section class="rows">
      <div class="head">项目 · ${ps.length}</div>
      ${ps.length ? `<ul id="list"></ul>` : `<div class="blank" style="margin-top:var(--s6)">
        <b>还没有项目</b>新建一个，把素材包 zip 拖进来就能开始。</div>`}
    </section>
  </div>`;
  $("new2").onclick = newProject;
  if (rs.length) $("watch").onclick = () => playDialog(rs[0]);
  wireHeroDrop();
  wireParallax();
  // 舞台大屏：强制播放；其余层与胶片带：取首帧
  const main = document.querySelector(".l-main video");
  kickPlay(main);
  document.querySelectorAll(".l-back video,.l-far video").forEach(v => frameAt(v, 1.4));
  document.querySelectorAll(".film .f video").forEach(v => frameAt(v, 1.6));
  const plates = $("plates");
  if (plates) rs.forEach(r => plates.appendChild(plate(r)));
  const list = $("list");
  if (list) ps.forEach(p => list.appendChild(entry(p)));
}
// 片架：悬停自动播放，移开回到首帧
function plate(r){
  const el = document.createElement("article");
  el.className = "plate";
  el.innerHTML = `<div class="tags"><span class="tag on">成片</span>
      <span class="tag play">悬停即播</span></div>
    <div class="holder"><video src="${vid(r.id)}#t=0.8" muted loop playsinline
      preload="metadata"></video></div>
    <span class="meta"><span class="t">${esc(r.title)}</span>
      <span class="d">${esc(r.ts || "")} · <b data-dur>—</b></span></span>`;
  const v = el.querySelector("video");
  // 取片长 35% 处的一帧：展示内容本身，而不是千篇一律的片头
  const seekMid = () => {
    try {
      const t = isFinite(v.duration) && v.duration > 4 ? v.duration * 0.35 : 1.4;
      v.currentTime = t;
    } catch (e) {}
  };
  if (v.readyState >= 1) seekMid();
  else v.addEventListener("loadedmetadata", seekMid, {once:true});
  v.addEventListener("loadedmetadata", () => {
    const d = el.querySelector("[data-dur]");
    if (d && isFinite(v.duration)) d.textContent = mmss(v.duration);
  });
  el.onmouseenter = () => { v.play().catch(() => {}); };
  el.onmouseleave = () => { v.pause(); seekMid(); };
  el.onclick = () => playDialog(r);
  return el;
}
// 舞台视差：鼠标移动时三层按景深反向位移
function wireParallax(){
  const stage = $("stage"); if (!stage) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (matchMedia("(hover: none)").matches) return;
  const kick = (e) => {
    const r = stage.getBoundingClientRect();
    const x = (e.clientX - (r.left + r.width / 2)) / r.width;
    const y = (e.clientY - (r.top + r.height / 2)) / r.height;
    stage.style.setProperty("--px", x.toFixed(3));
    stage.style.setProperty("--py", y.toFixed(3));
  };
  window.addEventListener("mousemove", kick, {passive:true});
}

function tweenCount(to){
  const el = $("pcount"); if (!el) return;
  const from = Number(el.dataset.v || 0);
  const toN = Number(String(to).replace(/,/g, "")) || 0;
  if (!isFinite(toN) || toN === from) return;
  el.dataset.v = String(toN);
  const t0 = performance.now(), dur = 520;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const val = Math.round(from + (toN - from) * e);
    const parts = el.innerHTML.split("<em>");
    el.innerHTML = num(val) + (parts[1] ? "<em>" + parts[1] : "");
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function setCount(done, total){
  const el = $("pcount"); if (!el) return;
  if (total == null){ el.innerHTML = "<em>0</em><span class=\"u\">帧</span>"; el.dataset.v = "0"; return; }
  const parts = el.innerHTML.split("<em>");
  const tail = (parts[1] || "0</em><span class=\"u\">帧</span>");
  el.innerHTML = num(done) + "<em> ⁄ " + num(total) + "</em>" + tail.split("</em>")[1];
  tweenCount(String(done).replace(/,/g, ""));
}

  $("player").src = vid(jid);
  $("dl").href = vid(jid);
  $("rmeta").textContent = "任务 " + jid;
}
function renderHistory(){
  const rs = (CUR.renders || []).filter(r => r.file);
  const sec = $("hist"), ul = $("histList");
  if (!rs.length || !sec) return;
  sec.classList.remove("hide");
  ul.innerHTML = "";
  rs.slice().reverse().forEach(r => {
    const jid = r.id || String(r.file).split("-").pop().replace(".mp4","");
    const li = document.createElement("li");
    li.innerHTML = `<span class="d">${esc(r.ts || "")}</span>
      <span class="t">${esc(String(r.file).split(/[\\/]/).pop())}</span>
      <a class="quiet" href="${vid(jid)}" download>下载</a>`;
    ul.appendChild(li);
  });
}
async function startRender(){
  const btn = $("go");
  if (btn){ btn.disabled = true; btn.innerHTML = "<span class=\"spin\"></span>启动中"; }
  try {
    const r = await api("/api/build", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({project_id: CUR.project_id, bundle: CUR.bundle,
        voice: CFG.voice, rate: String(CFG.rate), bgm: CFG.bgm,
        sfx: CFG.sfxMode !== "off", sfxMode: CFG.sfxMode,
        subtitles: CFG.subtitles !== false, sources: CFG.sources !== false,
        format: CFG.format,
        disclaimer: ($("disclaimer")?.value || "").trim() || undefined, useLlm:true})});
    if (!r || !r.job) throw new Error((r && r.error) || "启动失败");
    job = lastJob = r.job;
    localStorage.setItem("vg.job." + CUR.project_id, job);
    await renderStudio(4);
  } catch (e){
    if (btn){ btn.disabled = false; btn.textContent = "开始渲染"; }
    toast("启动失败：" + e.message);
  }
}
function startPoll(){
  stopPoll();
  $("pmode").textContent = "REC";
  $("pstage").textContent = "正在生成";
  JD.lastChange = Date.now();
  pollJob(job);
  timer = setInterval(() => pollJob(job), 1500);
}
async function pollJob(jid){
  let j;
  try { j = await api("/api/job/" + jid); } catch (e){ return; }
  if (j.stage === "unknown"){
    if (lastJob !== jid) return;
    const l = await api("/api/latest");
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    if (l && l.video){
      lastJob = l.job;
      $("pbar").style.width = "100%";
      $("pmode").textContent = "DONE";
      $("pstage").textContent = "生成完成";
      $("pdetail").textContent = "服务重启，已找回最近一次成片。";
      showResult(l.job); renderHistory();
    } else {
      $("pmode").textContent = "LOST";
      $("pstage").textContent = "任务中断";
      $("pdetail").textContent = "服务重启导致这次任务丢失，可以重新渲染。";
      fail("", "重新渲染");
    }
    return;
  }
  const idx = Math.min(j.stage8 || 1, 8);
  const pct = Math.max(0, Math.min(100, j.progress || 0));
  const now = Date.now();
  if (pct !== JD.lastPct){ JD.lastPct = pct; JD.lastChange = now; }
  const el = j.elapsed != null ? j.elapsed : Math.round((now - JD.localT0)/1000);

  const fr = /(\d[\d,]*)\s*\/\s*(\d[\d,]*)\s*帧/.exec(j.detail || "");
  setCount(fr ? fr[1] : null, fr ? fr[2] : null);
  paintStills(j.stills);
  $("pbar").style.width = pct + "%";
  $("pbarBox").setAttribute("aria-valuenow", pct);
  $("pstage").textContent = j.stage === "done" ? "全部完成" : STAGE8[idx-1];
  if (j.detail) $("pdetail").textContent = j.detail;
  $("ppct").textContent = j.stage === "done" ? "100%" : pct + "% · 第 " + idx + " 步，共 8 步";
  $("taskId").textContent = jid;

  JD.samples.push({t:now, p:pct});
  JD.samples = JD.samples.filter(s => now - s.t < 90000);
  const s0 = JD.samples[0], sN = JD.samples[JD.samples.length - 1];
  const dt = (sN.t - s0.t)/1000, dp = sN.p - s0.p;
  const rate = dt > 20 ? dp/dt : 0;
  const peta = $("peta");
  if (j.stage === "done") peta.textContent = "";
  else if (pct >= 85 && rate > .02)
    peta.textContent = "已用 " + mmss(el) + " · 还需约 " + mmss(Math.max(5, Math.round((100-pct)/rate)));
  else peta.textContent = "已用 " + mmss(el) + (QUOTE[j.stage] ? " · " + QUOTE[j.stage] : "");

  const firstPoll = JD.firstPoll !== false;
  JD.firstPoll = false;
  if (firstPoll){ JD.watchFrom = idx; if (el > 5) JD.localT0 = now - el*1000; }
  const from = JD.watchFrom || 1;
  const lis = $("stages").children;
  for (let i = 1; i <= 8; i++){
    if (i < idx && i >= from && !JD.stages[i]?.doneAt) JD.stages[i] = {doneAt: now};
  }
  let prev = null;
  for (let i = 1; i <= 8; i++){
    const li = lis[i-1]; if (!li) continue;
    li.className = i < idx ? "done" : (i === idx ? "on" : "");
    const d = li.querySelector("[data-dur]");
    const st = JD.stages[i];
    if (i < idx && st?.doneAt) d.textContent = mmss((st.doneAt - (prev || JD.localT0))/1000);
    else if (i === idx && j.stage !== "done") d.textContent = mmss((now - (prev || JD.localT0))/1000);
    else d.textContent = "";
    if (i < idx) prev = st?.doneAt || prev;
  }
  const quiet = (now - JD.lastChange)/1000;
  if (j.stage === "done") $("tip").textContent = "成片已经生成。";
  else $("tip").textContent = (quiet > 25 ? "仍在处理中，没有卡住。" : "") + (TIP[j.stage] || "");

  if (j.stage === "failed"){
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    fail(j.error, "重试渲染");
    return;
  }
  if (j.stage === "done"){
    stopPoll(); localStorage.removeItem("vg.job." + CUR.project_id);
    lastJob = jid;
    $("pbar").style.width = "100%";
    $("pmode").textContent = "DONE";
    $("pstage").textContent = "生成完成";
    $("ppct").textContent = "100%"; $("peta").textContent = "";
    $("stages").querySelectorAll("li").forEach(li => {
      li.className = "done"; li.querySelector("[data-dur]").textContent = ""; });
    showResult(jid);
    const ps = await api("/api/projects");
    const me = ps.find(x => x.project_id === CUR.project_id);
    if (me) CUR = Object.assign(CUR, {renders: me.renders || CUR.renders});
    renderHistory();
  }
}
function fail(detail, btnText){
  $("pmode").textContent = "ERROR";
  $("pstage").textContent = "没有生成成功";
  $("pdetail").textContent = "常见原因：素材路径失效、配音接口网络异常、模型额度不足。";
  const e = $("perr");
  e.classList.remove("hide");
  e.innerHTML = esc((detail || "未知错误").slice(0, 400)) +
    `<div style="margin-top:16px"><button class="btn line sm" id="retry">${esc(btnText)}</button></div>`;
  $("retry").onclick = startRender;
}
loadTemplates().then(route);
</script>
